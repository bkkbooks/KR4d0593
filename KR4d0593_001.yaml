front:
  text: 張光弼詩集卷之一
  hash: sha256:64fdca160e197962247c182bf5957e88aa248a254614bc942bccf018890bbdd8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_001-1a}
body:
  text: 古風五言飲馬長城窟行飲馬長城窟飲多泉脉枯嘶跑不肯行思若畏前途驅之尚不忍惻然駐征車朔風當面吹墮指裂肌膚豈念衣裳單頋已猶亡夫功名登天然何時執金吾隂陽無停機百年諒湏㬰常恐遂物化奄忽委路隅此懐當告誰策馬自長吁古意白露積瑶堦明月生羅幃流光劇奔電窈雿閟空閨黄金奉桒間母乃禮義虧安得亷耻士再詠關雎詩雜詩髙樓抗浮雲南盡洞庭野凉風颯然至槁葉凄以下登臨極四頋莫我所思者憂来欲奮飛羽翼不余假昭質匪金石流年劇奔馬日暮湘水隂幽蘭謾盈把日月交互行四時亦云易去時栁未黄又見楓葉赤人生範圍内生死難固必别離将訴誰訴之又何益昨宵夢相見嬿婉如平昔覺來但虚幔衾枕有餘憶行路難鴻鴈及秋来玄鳥先社去俱生亭毒内羽翼乃不遇翔者不知水泳者不知山世事每如此人生行路難少年行㸔取木槿花朝榮夕已萎芳容有凋謝胙澤何所施壽命如可長仙人今何之髙堂有歌舞及此少年時古别離陽關古别離對面折楊栁旋踵委道傍焉得長在手丈夫四方志竭力車馬走慷慨平生懐不在然諾後傾貲鑄寳劒性命同所有去去勿復陳黄金印如斗古瑟錦瑟古之樂造自軒轅間朱絲五十絃柱列鵷鷺班中有洞庭水白日興波瀾人文際昌期出應清廟弹洋洋雅頌音一唱而三嘆神人既以和鳯鳥翔其翰聖明御天下百靈咸仰攀讀離騷經三閭椘同姓怨生扵所愛讒人在君側繩墨日偭背虞兹宗社隕繁辭兾收採反覆三致忠九死猶未悔靈修終不察遂投汨羅水斯文幸未䘮風雅接三代豈惟南國士汲汲仰霑溉讀秦記登髙望逺海中有三神山秦皇惑方士採藥駐容顔如求不死藥何必波濤間玄牡氣孔神日夜相循環若人善保之入聖而超凢所以廣成子度世安泥丸言志少小誦六經中歳始聞道乃知三百篇不貴辭娟好發言将自宣猶若未深造常恐歲年晚白露先芳草覃思時竄易舉茟如振槁庻或諧雅音詠歌以終老相逄行京師衆大區鞍馬俱俊㳺相逄念輕薄觧贈雙呉鈎性命付然諾妻子托綢繆朝過狹斜道暮宿娼家樓五侯與之談七貴為之謀心膂誓百年羽翼期九州當其勢合時喝倒黄河流一朝貲用盡門户無鳴騶郷關耻獨歸京邑難久留慨念平生懐徘徊頋河丘浮雲詎終朝失意将焉尤古詩壮哉沛中歌命世之雄者帝王有大度不在論風雅綿蕝禮樂修採詩固無暇蘓李離别辭亦自關教化文章與政通斯豈雜王覇漢詩十九首不復辨名氏蘇李及枚乗伯仲之間耳當時尚詞賦六義誰作意雖非大雅言頗有風人致篇章何在多自足傳扵世所嗟黄𥘉後作者莫與企曹公英雄姿吐辭自天成横槊鞍馬間慷慨念平生汝頴諸文學歛祍奉明廷對酒惜時邁載歌伸鹿鳴風雲入壮懐河山助威靈至今鄴中唱猶擅文章名銅雀有遺憾哀哉短歌行鄴中盛文辭七子相掎角雖膺丞相辟未免傷流落世胄相友善宴好以酬酢出内結腹心庻僚仰殊渥願因雲雨㑹戢翼永栖托貴賤俱黄土徒存建安作魏文在世子嗣領五官将國事既有閑經術尤所尚讌㳺集文學詞藻咸宗仰五星垂光彩両曜分氣象風流積二世况復人君量快樂芙蓉池乗輦一何壮寕同汝頴士戚戚兾所望東阿帝室親復乃貴介弟降志詞翰間國事罔所兾思深而文典光彩照當世切切陳自劾捐軀以明志淫情洛神賦所願以自棄禰衡輕狡人况以才自負将赴漁陽檛侮人還自侮曹公豈容物嫁悪與黄祖值兹劻勷際焉用鸚鵡賦所以賢逹士貴在識時務三謝國親臣世家金閨彦玄談雖時尚好爵尤所羡出各領名郡而不拘履踐能忘永嘉山水事㳺宴摛章固自羙雅誦從此變餘波及齊梁纎穠入哀怨嗣宗絶臧否善若䖏時晦詠懐數十篇倬尔追漢魏駕車哭而返此豈無所謂嘯登廣武䑓神氣偶相㑹從来倜儻心土苴視富貴惟有步兵厨百用時一醉淵明君子儒心事甚夷曠醉来得佳眠自謂羲皇上文章固可誦莭㮣尤所仰且無州縣拘安得言不放託志聖賢録千載成絶響髙人王右丞輞川亦有樂位居尚書省志不異丘壑誰言肉食鄙而不事澹泊辭擅大雅名集多應制作唐音得所宗夫子寔先覺工部行在官飢寒莫與比奔走盗賊中朝夕命如寄一飯不忘君危言以鳴世親䝉萬乗知不救妻子累文章天地間風雅可無愧賦者謾接迹此作竟誰繼襄陽孟浩然五言擅時譽迹放覊旅間氣藉江山助感懐峴山作託興洞庭賦九重獲見知一語乃上忤弊廬南山歸亦足蔽風雨篇章如可傳可傳遇不遇蘇州韋刺史早事武皇帝既䝉南宫録復膺符竹寄折莭就繩墨檢身勤治理賦詩長日静静閤餘香至晚逄楊開府感激道所以宜尔金玉音風雅存遺製鴛鴦篇駌鴦水中禽居常有㝎偶行則共洲渚栖不異淵藪交􅖪情所私和鳴氣相友白頭不自嫌彩翼戢左右雄雌或失配霜霰甘獨守嗟哉羽毛類賦性乃何厚願獻金閨女繡作君子綬人或違天常翻為此禽醜幽蘭萹幽蘭不自媚樷雜生溪磵寂寞空林色過者誰復玩及時或見收不與衆芳亂夢恊天使與握勤郎官盻頋兹馨香徳庻以同歲宴閨思篇連日洲渚上香風吹杜若閨人念離别逺思生幃薄去年執手時記省採蘭約如何燕鴻跡遽尔成綿邈将慿夢中見反側睡難著起視東西廂衆星已寥落晨鷄方再鳴曙色已東作安得携手人歸来共春酌丹華篇脩莖冐丹華碧葉相掩暎晨露發其姿舉世莫與並㣲風波上來綽約有餘韻相㸔咫尺地人逺河漢近緑房多苦心竚立秋塘暝美女篇燕趙有美女紅蓮暎緑荷珮環彫夜玉團扇畫春羅流盻星光動曵𥚑雲氣多囬車南陌上誰不駐鳴珂松濤軒松聲學海濤汹汹不可息如驅萬山泉迸落千丈石浩然入清聴心與竟為一焉知咸陽道車馬走赤日大哉利名事静者夢不及三良詩百歳誰免死貴是留其名三良殉秦穆慷慨平生情一語奉明主千秋共哀榮從容就長夜斯人豈偏生所以黄鳥詩至今頌遺聲班婕妤婕妤辭輦時風誼動宫闕後来紈扇詠詞氣何悽屑婦人何所恃所恃惟姿色過時而色衰枕席成棄物不見長信宫苔生玉階側一脉泉銘為中一元禅師作天地不自私至寳發山川誰扵黄金巖得此一脉泉㳙㳙成不息曹溪寕後先造物亦有待扵師亦前縁既供香積厨復灌冨陽田譬彼釋氏法一燈徧三千泉流願無竭燈光永相傳日居而月諸扵億萬斯年送薛山人歸富春舊識談天叟挑嚢又賦歸性諧麋鹿友身老薜蘿衣髙歩雲同舉濳形鶴自飛清醪香潑甕黄絹織成機生事有繩凖清言無是非勿矜絃上操若聴古人稀贈孫雷師祈雨有應天人本無二萬物備吾身一誠苟無妄呼吸皆鬼神南邦五六月熯陽如火燉法師念民食升壇肆怒嗔符召五雷伏龍起三江濱風雲随指頋沛澤来逡廵豈惟盈溝澮更且溢河津道路接歌頌田家具倉囷芒芒大鈞内造化豈不仁安得法師軰飛行遍八垠以兹雲霓心慰彼大旱民拙逸詩守拙中乃逸用智機或生所以抱真士泯焉黜聪明賣藥不二價懸壷無姓名逍遥城市間心與造物并鶴長断則悲鳬短續則驚萬物有常性巧偽非人情乗黄一剪拂千里無留行賢哉拙逸翁可以為世程從軍行一身既從軍寜復頋家室日食官倉粮唯知事行役昨朝號令下負弩趍大磧驅車出城去旌麾耀白日男児重横行萬乗假羽翼意氣從中來性命何所惜鵰鳴沙塞雨四面無馬跡不有封矦貴班超肯投筆晚春詞暄風日夜起春到亦已久清晨捲簾坐惆悵閨中婦聞鶯暗垂泪對花懶擡手昨宵夢夫婿白馬章䑓走結成合歡帯自置妾懐䄂覺來風張幔啼鳥在髙栁空織錦廻文佳期竟何有採蓮詞採蓮復採蓮採花莫採葉葉上多朝露花間盛顔色同舟二姝女流盻軼明月闘溜荷上珠将逞肌膚白岸上騎馬郎調笑五陵客豈不念所歡淇水不可越捕魚詞漁家無别業衣食惟罟網生長風波中舟楫慣来徃江平風波静天静榔板響得魚固所欲忖心輒内怏羣生各有命吾寕愛其飬放麑翁乃属中山相贈吴琰代宣州天風吹孤蓬一去無留蹤或與回飈遇猶希返故樷同飲南陵水况是親骨肉相見無别辭縷縷訴衷曲衷曲猶未伸征車動行塵屏營髙堂上尊酒聊具陳紉蘭以為贈此志良不薄兾蔵懐䄂間時用慰綿邈題蕳掾辨誣卷後種蘭雜荆棘棘長傷蘭根結交或匪良中道生謗言所以明哲士慎之非一門羙玉累卞和明珠誣馬援終焉各有辨暫屈寕為冤自警二首愚者昧其識沉冥生死中一為利欲染罔測吉與凶轢轆前後聲覆轍無不同遑遑駟馬車騶從行趋風悪影不息䕃世路焉愧躬兩足與之翼去齒存其角乾坤負冥頑造化乃忖度恃此以為勇能無遭束縛衝冠與裂眦未信盡堪託毋為萬物先内省有先覺飲酒詩示婿時伯庸四首連日春風暖面容為之鮮仰㸔樹上花荑蕚亦復然中有和鳴鳥羽翼相向肩胡能不命觴酌此花鳥前飲之豈不醉所貴乃其天頽乎麹蘖間南床得佳眠如何靖莭翁乃賦止酒篇青陽時至矣萱草滿堂階柔葉刷翠羽對之憂思裁室中無長物所蓄唯酒盃客至即與飲既醉從先囬平生曠逹懐何曽計尊罍得錢即付酒酒盡錢復来百年能㡬何笑口時自開光隂劇奔電金石難與期仙人浮丘公此日竟何之㸔取古聖賢丘塜亦纍纍死而不朽者六經豈余欺酒中有妙趣俗士不可醫及時不作樂事過徒傷悲年華駟馬車日夜勞驅馳既老憐餘生放情在麹蘖每到花開時一飲輙累月何曽校尊罍酒量盈與竭二儀蘧蒢舎百年覇旅客劉伶乃放逹注意頌酒徳不見昨日花今朝謝顔色賢愚俱有歸脩短随造物卧病寄孟天暐郎中數㑹誠不辭暫離還相憶雖無膏肓慮伏枕已旬日雨雪髙樓上隂沉病增劇不知湖中水晴後添㡬尺日照花枝明風吹栁條碧感此春事㴱携壷想無及孝感詩為吕運使題宋學士作序天地無私恩日月無私照信哉太史筆區别造化妙禎祥靡有常孝感斯乃兆金魚章服貴三事唯克肖使君寔啟之後嗣有餘耀題唐李昭道畫摘瓜圖即小李将軍思訓子中舎唐宗室丹青煥雲漢適當天后朝家國生屯難所願執藝事婉焉而上諌製為摘瓜圖忠恪非鄙慢兾或宵覧餘骨肉釋冰炭章懷恭順子盡室赴憂患回首横門道苦淚落餘棧路見摘瓜者恧然興永嘆悲哉黄䑓詞四摘乃絶蔓神噐有天命侈心暫惑亂梁公社稷臣直刼四廟筭煌煌萬方業復得返貞觀上已日杭州府學教授徐一䕫四齋訓導拉逰智果寺訪東城題參寥泉佳逰在上已属此清明前春景已云宴風光猶未暄徃尋智果寺竟得参寥泉雲物豈殊昔人世自更遷邈哉長公詠風流想當年我軰復登臨花界何因縁古佛儼香閣真詮積華軒境超萬念空道勝諸妄捐緬懐此㑹難徘徊未云還申章續芳藻兾或来者傳此君軒為周昉賦種竹不在多竹多翻自俗周生逹此意窓户惟数竹涼飈集雅吹炎景消煩燠情神穆如詠興寄淇園緑誰云翡翠枝不有鳯凰宿苔堦近相對色浄尊中醁雖非沈湎事庻以忘寵辱何可一日無此君羙如玉棲鶴軒張天師行舘在佑聖觀丁虚一提點方丈鶴馭從天來雪光照雲闕戞然九臯唳散落三山側乃知羽人師近作金門客玉女見投壷后羿從奔月令威古仙子竟使枉其輙不言三清事但叙千年别至今棲鶴䖏光怪常不滅有時玉笙歌雲氣猶下接欲賦㳺仙詞作者不可得斗酒誰為呼吾将招李白陳孔碩回㤗和柬寄其丈人羅椘翁䖏士昔别翁未婚翁今已抱孫俊哉東床婿玉樹照名門知我丈人行再拜情誼敦惠頋每持酒坐語移朝昏離居獲軫念殊慰覊旅䰟我自京城囬安分守丘樊家事復儒業寕同東掖垣尚頼稽古力似若吾道存終焉营莬裘兩翁老青原嘯軒開軒出平湖四望惟青天嘯聲静中起萬象俱回旋雲霞未改色水波為之先白日每少光長風亦蕭然沉吟阮公詠興懷廣武邊寂寞千載後慷慨千載前斯人竟何人託志在空言雪巖夏雲多竒峯洞照赤日下玲瓏萬雪巖突如隔大野南風有時来素色欲飄洒体物而賦之誰為漢司馬持以遺所思丹青莫圖寫北山堂築堂大湖北堂上何所見好峰七十二終日如對面其中盡白雪且是難持贈鶴鳴露氣升魚躍波光泛唯尔禪居人天機兩相羡李息齋平章畫著色竹御屏此君有逸韻翠佩而長𥚑遭彼列仙人披以鴻爪書把玩猶未觧倐焉凌空虚化為九鳯雛其聲雜笙竽煌煌薊丘公描冩登畫圖丹青照屏惟如對古丈夫乃知廟堂上一日不可無至今伶倫氏見之為踟蹰題天平寺禎上人房每過屢不逄出寺乃一見巖囬樹色暝日轉霞光絢􅌽留復入寺禮待良繾綣欣同静者室坐久殊未厭寂然禅榻外罏烟落經卷境静累自遣情忘道非逺方丈如或容吾将老貧賤訪仁一初尊師願聞清淨法徃謁冨春僧妙論聴不厭道心中自增如此醍醐味使我嘗未曽豈無宿世因坐對古佛燈庻㡬一言下彼此證三乗雪齋東坡命名少㳺作記萬有從妄作庸辨偽與真假山復假雪空色自相因東坡古維摩出語驚天人弹指為説法一息乃萬旬舊時言所説㡬見湖水春染習或未除示此前後身題詩附齋壁庻與坡詩隣思雲軒為羅從亊賦福州人四川省掾三川望三山相去㡬萬里親舎白雲下懷思曷云已朝思歌陟岵暮思歌陟屺如之何勿思禄不乃甘㫖哀哉天壤間此思孰終始舉日皆白雲寧論此與波但移思雲心夙夜勤治理委質既在心忠孝同一軌題郭文醫虎圖利忘九重淵珠從龍頷得仁忘千金軀手探虎口骨獸或復其性其禍不可測馴擾亦何術貴在道與徳天茁亭為栁膺賦侯門臭酒肉窮居厭藜藿賦分各有定天胡為厚薄荒園灌数畒亦足代耕穫折葵助鼎俎剪韭供春酌雖非八珎饌其味良不悪三牲何可常一瓢易為樂古之志道者糲食甘澹泊造物茁此徒扵世寕妄作賢哉宋嘆矣樊遲學勿嫌食肉鄙儒家貴儉約妙髙院大方垕上人碧岑日在望雨雪阻登臨二客從事者杖藜長松隂縁雲及上方步履皆黄金佛香出寳閣一息契𥘉心心如白蓮花塵垢何由侵攅眉入社後此㑹還可尋廬山得逺公法侣滿東林虎溪偶然事傳笑直至今我軰乃避俗垕師試可欽壽光宫訪道士不遇留題髙阜臨大溪激流喧衆石中蔵夀光宫年深翳金碧儼然天人尊羽衛何赫奕回廊䕃古木苔蘚少行跡傳昔丹霞士扵斯錬金液丹井雖尚存鸞鶴無一隻徘徊長松下瞻望雲氣白不見種桃人惆悵理還策宜晚堂送江架閣還奉化隆替理之常仕進難固必在事寡尤悔扵心孰欣慼從来黄甘里先廬頗完葺雖非大哉居亦異環堵室歸来冝晚歲懐抱得所適謳吟及芳辰言笑共佳夕赤城有霞氣光照五色筆門前有大路而無車馬䟢幸焉返𥘉服素願於此畢㝠㝠江上鷗矯首羡歸翼過清逸䖏士盧公墓上作䖏士古豪傑在衆不自異平昔郷曲間随時以軒輊聚書千餘卷将遺子孫計醖酒百餘石将虞賔客至甚慕魯仲連扵人無所媚辟書下䑓省踰垣而趋避遂隱清平山居然事髙致地隣萬松嶺日乆聞鶴唳朝論羙其風錫以清逸謚煌煌揚宣慰深情託􅊚契豈期七十年遽棄人間世遂使倜儻懐銷盡虹霓氣髙墳蔓宿莾寕不為長喟子常仕今朝宗廟瑚璉器自唐譜系存簮纓舊門地賢哉郭有道母忝蔡䓃誌無憂子詩為楊州湯仲銘䖏士賦安分以逹生所適皆天㳺恂恂里巷間何忮復何求簞瓢自終日冬夏惟一裘既不願名爵寧對狐貉羞忘機鷗與親浪迹雲中儔中區本混沌愚者昧雕鎪樂哉湯䖏士冝尔名無憂奉聴玘法師講楞伽經留别玘公註經回扵世無所慕結壇在南塢心與道為務行苦緇素歸律嚴鬼神護吾從挹清芬肺腑久歸附仰聆楞伽㫖灌頂發甘露四衆瞻禮間繞床天花雨古無雪山子我願黄金鑄兹行匪慢㳺實以聞經故𥘉地誰不明末法自迷誤不謂支道林猶識許玄度忻然詶宿願言笑亦已屡出寺且復留徘徊川光暮還當理輕楫時到茆家步師既不忘予予忘南塢路南塢釋如玘次韻附吾佛生世間赴彼羣機慕説法歴五時華嚴最先務聲聞若聾啞慈悲善調護脫除著弊衣令伊可親附弹斥淘汰餘一乗方顯露所以鷲峯頭四華繽紛雨頑銅及鈍鉄天爐盡鎔鑄後五百世来誰復知其故居士佛㑹人聞說知㡬度自吾得為友歲月㡬成屢復此話無生扵焉慰遲暮東林雖云逺玄蹤可追歩鑿池種藕花共超真歸路訪巢雲子不值留題桃源不可覔結屋以巢雲只此方丈内便覺超人羣秋晚槿籬秀雨餘塘水渾安知巢雲子不是雲中君又值荷蓑出無從書練裙聴松軒為朗上人題㣲風吹幽松近聴聲愈好師非寒山子安得此懐抱天機内相㑹百體同浩浩如適清涼境大地絶熱惱每從畫省歸騎馬必一造妙趣湏自知難與别人道舟行即事舟行如虚空上下天光裏中宵撤前幔繁星在清泚天河横未落北斗當面指涼風波上来吹皺青文綺蘆洲集夜禽䀨聒鳴不已悪聲雖攪眠清景則可喜却思車馬塵此時動城市題隱居圖䖏州王啟明隱居萬山中日夕有佳色時扵巖上石蒸起雲氣白桒麻欎相望鷄犬識巷陌中林芳草地不有車馬轍為與城市逺似覺囂塵絶原田既膏腴且是宜稼穑溪流既清駛且是利舟楫耕漁鄙夫事富貴要不得但見桃花開不知何歲月寄謝丹青人吾将安蹇劣種徳堂為岳醫士題種徳不在淺種藥不在深雖有千畆地不如方寸心種之百年後所得非尺尋忠信乃佳實慈愛為繁隂如有仙人杏一核延千林以此惠後嗣安用多黄金百馬圖畫師畫馬時心與馬為一精神各自分萃此馬百匹起卧適馬性踶􅲪通馬力逸如龍在水馳若虎而翼逰牝得羣聚風騰各相及或滚塵沙黄或嘶草芽碧豈無麒麟骨松下塩車泣誰将朔漠大圖畫歸咫尺曹韓不並世按圖為尔惜木槿花誰謂木槿花朝榮夕已萎顔容逐電光老大行相随髙堂有歌舞乃取少年時夀命信可長仙人竟何之浮雲一首别髙士敏人生如浮雲聚散何可必倐忽萬里餘求之渺無迹有時天上見若我舊相識飄揺玉雪姿可望不可即羡此凌風翰與彼得共適田家詞為農謹天時四體務勤力日夕耘耔罷植杖聊假息児童原上牧婦女機中織田家無别事俯仰唯衣食黽俛共百年辛苦何所惜世有五矦貴農人夢不及但願風雨好一穗千萬粒卒歲無徴科庻俛憂儋石六月三日雨日車當空行雷聲從地起長風吹行雲萬籟若有喜田夫念稼穑望雲如望米甘澤始沛然三日不可止吁嗟乎蒼生何以荅天地田家田家無所具客至唯鷄黍厨下作新炊門前備酒醑涼風吹户牖髙栁䕃塗路還家既不逺送上採菱渡蘭雪軒幽蘭不自芳君子以貽好白雪不自潔君子用嫓操與彼蘭與雪聊付爾懐抱人生㓜而學壮則行其道青春未晼晚白日正杲杲何乃七尺軀迷邦以懷寳時哉不可失功名貴及早
