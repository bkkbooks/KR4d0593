seq: 8
front:
  text: 元張光弼詩二卷爲不觧事書人強為觧事作七卷分之遂失其本来面目一卷之五卷元合作苐一卷六卷之七卷元合作苐二卷也其書借海塩胡孝轅氏所録徃數年前聞孫唐卿氏有是集碌碌南北未及假録昨歲差旋徃謁孝轅遂携之歸錄之以償夙昔然胡本中頗多浥爛損壊字尚須假孫氏本𥙷之集有輦下曲一百二首宮中詞二十一首皆道胡元宫闈中事也别有
  hash: sha256:037b9452d5a3e8982df38111750279a6298e5108d7374e89ea2874c1d4a7576f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_008-1a}
body:
  text: 國初宗室得所賜元老宫人言庚申君宫中事為作宮詞百今見丈園謾錄惜為刪去五十二章今惟存四十八章録作一家亦俻一代之遺事云旹天啟二年壬戌正月上元後一日書於武源山中連隂雨二十日矣尚未有晴意恐復作元年連綿四五月也清常道人書嘉慶甲戌収淂明刻夲校非特浥爛損壊字与趙所據抄之夲合且此夲有墨筆旁添之字皆刻本所有其爲海塩胡孝轅夲無疑明刻新從湖賈之趕考玉峯銷中所收來自浙中當不誣也趙㨿抄于前余覆勘于後尚有一二實为趙抄时所遺書經三寫魯魚亥豕故樂淂祖夲也校注記閏二月十九正下𣸪爲識此夲多為唐卿夲校補一過幸先由此而刻夲反可藉是獲今書可編如此𣸪爲又記
  hash: sha256:7aba83b89ecb8ee7a260917a68362fe50d1a20494fcd6fb6dc920209f3358e0a
