canonical_identifier: bkk:krp/KR4d0593/krp/v1/juan/8
seq: 8
front:
  text: 元張光弼詩二卷為不解事書人強為解事作七卷分之遂失其本來面目一卷之五卷元合作苐一卷六卷之七卷元合作苐二卷也其書借海鹽胡孝轅氏所録往數年前聞孫唐卿氏有是集碌碌南北未及假録昨歲差旋往謁孝轅遂携之歸録之以償夙昔然胡本中頗多浥爛損壞字尚須假孫氏本𥙷之集有輦下曲一百二首宮中詞二十一首皆道胡元宫闈中事也别有
  hash: sha256:d47f03090566c13dc2866effa1650005d59939487f881de98982338bdd800523
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_008-1a}
body:
  text: 國初宗室得所賜元老宫人言庚申君宫中事為作宮詞百今見丈園謾録惜為刪去五十二章今惟存四十八章録作一家亦備一代之遺事云時天啓二年壬戌正月上元後一日書於武源山中連隂雨二十日矣尚未有晴意恐復作元年連綿四五月也清常道人書嘉慶甲戌收淂明刻夲校非特浥爛損壞字與趙所據抄之夲合且此夲有墨筆旁添之字皆刻本所有其為海鹽胡孝轅夲無疑明刻新從湖賈之趕考玉峯銷中所收來自浙中當不誣也趙據抄于前余覆勘于後尚有一二實爲趙抄時所遺書經三寫魯魚亥豕故樂淂祖夲也校注記閏二月十九正下𣸪為識此夲多為唐卿夲校補一過幸先由此而刻夲反可藉是獲今書可編如此𣸪為又記
  hash: sha256:bc8076a084e2bd28d3e526c86b75a914c5e550f6fe263a039ff13ed56d9765df
