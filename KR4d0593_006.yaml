front:
  text: 張光弼詩集卷之六
  hash: sha256:d9744e89935c528813cbb32994535bf7c06c946212e5b0405b82a19696a506e8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_006-1a}
body:
  text: 七言律詩投贈潞國公承旨學士張仲舉漢家舊德有桓榮赤舄登朝羽翼成三晉鳯鳴千載會兩河龍見五雲迎獨于社稷多艱日復使君臣大義明自念昔曽親几杖頌歌慙後魯諸生投上巾書右丞相履舄從容自九重相王忠孝更誰同千年帶礪猶初誓萬國臣鄰盡下風星貫紫垣朝佩劔月臨黃道夜傳弓漢家若論安劉策四皓難書苐一功五府驛代楊左丞留題後有楊維禎次韻免胄日趨丞相府解鞍夜宿五侯家玉杯行酒聽春兩銀燭照人如晚霞受命敢忘軍旅事撫時又過掖垣花漢家未可輕韓信尚要生擒李左車東髮從戎十五年戰回平地血成川英雄生世有如此忠孝報君當慨然俶擾弄兵俱赤子中興有道自皇天猖狂暫假姑蘇息繫􅖪終須拜馬前湖山堂宴贈天使還亰畫旗風衷繡筵開竟日歌鐘樂未回栁拂玉鞍秋繫馬酒淹羅袖醉傳杯杭城近自月前復使者適從天上來歸對大廷真得實眼中諸將盡竒才嶽鄂王墳上作朔雪炎風共此年中原父老亦堪憐竪儒屢遣祈求使大將空持殺伐權忠誼有碑書大莭姦邪無靣見重泉至今宰木猶南拱遺憾西陵是墓田陪宴相府得芍藥花有賦醉吐車茵愧不才馬前胡蝶趂花回玉瓶盛露扶春起錦帳圍燈照夜開垂白敢思溱洧贈欹紅還是廟廊栽楊州何遜空才思誰對髙寒詠閣梅退居湖上投贈楊左丞四首樓外湖光白渺茫樓中少婦試新粧行年將近半百歲大醉豈能千萬場織繡舞裙飛蛺蝶白描歌扇睡鴛鴦垂楊滿院無人到芍藥花開日正長信馬蘇公堤上行水邉鷗鷺不曽驚春波滿眼湖光細花片飛來兩點輕天上碧雲如有詠樓中紅袖謾多情牧之老去狂心歇總把風流付後生宿酒猶多睡未忺好風何處散香奩可教春日間瑶瑟而使楊花撲繡簾削迹不煩三顧重息機將廢六壬占今朝畫省無公事又得從容少避嫌且觀神女為行兩莫問郎官應列星芳草到門無俗駕好山終日在湖亭白鷗共戲荷葉小黃鳥亂啼楊栁青肯信曲欄干外立晚涼吹得酒都醒宴犒將士酒酣命健兒舞劔為樂浙省平章泣下不禁感事有賦平陸龍蛇起殺機旄頭又自照金微兩階干羽知何似二典君臣豈盡非劍舞尊前回夜電燭明帳下接晨輝可憐司馬江州淚濕盡團花舊戰衣陪宴後堂觀牡丹回有作風光偏惱掖垣人銀甕連車載酒頻寒食煙新萬家樹洛陽花擅一年春揀好任從天女散近前不嫌丞相嗔壓帽紅香歸路晚幾多瞻望馬前塵至浦陀洛迦山寺作佛事七晝夜祈見海岸觀世音及善財岩七日之間隨心應見大衆瞻仰無不慶讚丞相函香致此誠願深海水救群生慈悲謂可消諸惡征伐容將息大兵金色圓光開寶髻玉毫妙相珞珠瓔手巾示現楊枝露碩洗干戈作太平戊戍題海上作華表仙人舊姓丁羽毛今日惜飄零海巾又見蓬萊淺門外空憐楊栁青暮雨朝雲翻覆手落花飛絮短長亭如何未熟黃粱飯説道英雄夢已醒楊忠愍公墓上作夢覺邯鄲萬有空邦人猶自説英雄道家論將忌三世臣子報君唯一忠淺土何堪封馬鬛迷魂猶自恨秋風死綏固是將軍事國史旗常盡雋功惆悵六首交逰蚤歲在幽燕費用黃金買少年闕下朝回瞻馬首酒間俊發抱龍泉劇談寧顧日西落倒載不知天左旋惆悵近來才解事先生五栁種門前三山夢斷綵雲空幾把長箋賦惱公畫閣小杯鸚鵡緑玉盤纎手荔枝紅春衫汗裛薔薇露夜帳香回茉莉風惆悵近來江海上却將鞍馬學從戎畫船湖上載春行日日花香扇底生蘇小樓前看洗馬水仙祠畔坐聞鶯碧桃紅杏渾相識紫燕黃蜂俱有情惆悵繁華成逝水盡歸江海作潮聲惆悵當年使酒來娼樓紅粉夜相催可憐明月二分在不見璚花半朵開誰復醉翁堂下栁更堪從事閣中梅楊州一片青青草誰信春來無鴈回惆悵雄藩海上逰武昌佳氣接神州東風歸思王孫草北渚愁生帝子洲椘國江山真可惜劉家豚犬亦何羞不須更問中原事官栁新栽過戟樓至今惆悵在東城結伴看花取次行輦道駐車招飲妓宫牆回馬聽流鶯星河織女從離别海水蓬萊見淺清不有酒船三萬斛此生懷抱向誰傾過楊忠愍公軍府留題總是田家門下客誰于軍府若為情林花滿樹鶯都散雨水平池草自生街上相逄驚故吏馬前迎拜泣殘兵能言樓上題詩處猶有將軍舊姓名睡覺滿院楊花風力輕牡丹時月好晴明簾垂不知白日晚睡覺忽聞黃鳥鳴萬斛春光金盞酒百年心事玉人筝劉伶未到忘形處枉自間將畚鍤行湖亭納涼奈爾湖光月色何不知此境為誰多忽驚墜露翻荷葉想見微風生水波炎景只消清夜飲老懷都付小鬟歌家中未必涼如此且待樓西轉絳河燈前有賦雨夜湖樓錦帳垂有人為爾故眠遲春衫照影看教舞寶合熏煙學畫眉何處絶纓憐椘客為誰掩𬒮泣樊姬思量暗室無窮事留到天明不忍欺湖船勸曺德照僉院酒倩得名姬唱慢歌梁塵直欲下輕波西風八月芰荷老落日滿湖鳧鴈多到手莫辭雙盞飲轉頭又是一年過光隂只在槐柯上奈此浮生樂事何宿中書左司呈上太尉丞相天上誰開白玉堂東垣列宿共輝光畫屏雪映蓬山鶴錦帳雲凝漢署香嚴尹世交憐杜老楊州詩興屬何郎連雲騎省乘風露月過秋河夜色涼别春次楊州成廷圭韻燕語鶯啼畫可哀更無馬迹到青苔自從玉樹成歌後曽見銅仙下淚來為晉為秦花幾度行雲行雨日千廽若教蝴蝶知春夢儘把黃金付酒杯省垣梅花官梅過臘花開遍何遜楊州興未闌踈映粉闈疑是畫香飄羅袖欲生寒公餘不厭巡簷笑夜後還思把酒看只恐明朝零落盡枉教人恨角聲殘安慶南城寄賀守帥余廷心郡守韓公𢡟余家留是郡故句巾及之壯哉淮邑冠荆舒新築堅城鐡不如完美皆吾大夫力奠安與爾庶民居歸來江漢朝宗水滯迹周南太史書莫説鬢毛成種種近來吾亦愛吾廬丞相委入姑蘇索各官俸米留别幕府諸公不比常年載酒逰杏花時莭出杭州粉圍未覺為郎貴萱草難忘此日憂沙漠帛書空見鴈江湖春水莫容鷗何須折盡垂楊栁留取他年繫别愁至姑蘇呈太尉相君求米若求雨負外得船如得仙聀忝下僚班可耻情通鄰好亦堪憐山中棊局迷樵客溪上桃花誤釣船醉把玉杯無所計不勝惆悵晚春前城南武威樓成守帥余廷心自安慶使人索詩自來名將出名儒暫駐襜帷向上居城繞朱闌連百雉門排畫戟壯群雲開五老招何及秋對九峯清有餘樓上記成鐫琬琰廬陵須得蔡襄書辭答張太尉見招中年頓覺壯心去涉世頗知前事非若使范增能少用肯教劉表失相依風雲天上渾無定麟鳯人間不受鞿殘夢已隨舟楫逺五湖春水一鷗飛秋興一夜涼風便覺秋楚人多感易生愁金盤露水何曽見紈扇恩情末肻休零落梧桐宫井上稀踈楊桞御街頭近來收得麻姑信説道蓬萊更可憂夜登天童寺觀海日登臨何事獨關情北斗闌干對面橫漢使猶空河畔影霓裳如在月中聲魚龍水闊星辰動鴻鴈風髙鈴鐸鳴不待下方雞唱罷衲僧東指海雲平桃花園招兀顔亷訪使飲桃花好是未全開人世花間醉幾回一片嬌隨歌袖去滿園紅待使君來尊罍有興皆清事風雨明朝又緑苔誰見朔兒千歲實銜巾青鳥莫相猜武夷山南郡名山説武夷幔亭尚想是秦時空巾簫管何曽絶洞裏曽孫自不知石室尚遺仙蛻骨棹歌俱唱宋人辭山前毛竹知龍籜笑與壺公作杖騎冷泉亭觀猿舊從巫峽看猿挂此日山巾復見之黠與樵蘇爭墜果捷于風雨下髙枝月沉夜澗魂先斷風攪霜空呌轉悲應記往年梅嶺事玉環付與老僧持觀潮次貝廷琚韻世代銷沉在此聲幾回東下復西傾翻騰日月迷朝夕簸蕩魚龍㝎死生㗸石每憐精衛小投膠未見濁河清眼前波浪猶如此莫説蓬山頂上行題後堂壁兵權去手志何伸耻是隨班入省頻亰國蹉跎空在夢蓬萊清淺已生塵繞朝謾贈秦人策孔子將書魯國麟散騎得辭丞相後五湖安往不間人春閨詞白日髙堂欲暮難鳴鳩乳燕靜相干銀瓶行酒雙環緑玉琯調笙十指寒胡蝶每因飛過見牡丹多是折來看明朝為遣安西使錦字紅燈織夜闌春懷幾涴先生漉酒巾眼中猶自落花頻春來秪與醉為伴睡起翻疑夢是真翠羽棲香秦隴鳥玉叉墜鬢雒陽人風光已逐流年去此事那容更問津湖上漫興百鎰黃金一笑輕少年買得是狂名尊中酒釀湖波緑席上人歌鳯語清蛺蝶畫羅官樣扇珊瑚小柱教坊筝南朝舊俗憐輕薄每到花時别有情爛熳風光在酒家狂蜂冶蝶趂繁華人來人往如趨市樓上樓前盡屬花波面畫船雙蕩漿堤邉黃犢一逰車目成眉語知何限銷盡柔魂在狹斜湖上新泥雪漸融門前溝水暗相通裙欺萱草輕盈緑粉學櫻桃淺淡紅暮雨欲來銀燭上春寒猶在酒尊空青綾𬒳薄不成夢又是一畨花信風樂事杭州奈爾何人間冨貴易銷磨畫船湖水年年在紅粉娼樓處處多歌引行雲來綺席舞畨廽雪下春波東坡往日留詩後更有何人載酒過聞鶯風花時莭又清明迸泪何緑聽曉鶯咫尺故鄉天近逺幾家春草路縱橫英雄轉眼俱為鬼造物于人豈絶情自是晚生堯舜世不關天地不升平同趙郎竹園夜飲塵土無由得見侵粉墻髙護碧雲深日行南陸暑不到月過天河龍自吟沉飲何妨同阮籍幽情亦或過山隂夜涼庭院羅衣薄吹徹參差思不禁逰雲門寺同寶林别峯尊師賦東逰好是雲門寺况是若耶溪水邉茶會詩傳唐舊刻松壇名重晉諸賢行雲欲傍支郎馬垂栁能維賀老船也當一場風月夢為題名姓法堂前凝香閣聽雪陡然寒重紫貂輕便覺髙簷瓦有聲欹枕欲同蟬殼蛻開門唯恐鶴巢傾數杯酒力春容轉滿盞茶香夜思清小玉迫床推不醒袖籠檀板失天明桐柏宫留題甚慕天台馬子微後千年始到幽棲江湖歲月憐新夢泉石煙霞感舊題阿母信傳青鳥後玉笙人逺絳河低當時不盡風流興付與山鶯儘自啼繡毬花次兀顔亷使韻繡簾春晚欲生寒滿樹玲瓏雪未乾落遍楊花渾不覺飛來蝴蝶忽成團叉頭懶戴應嫌重手裏間拋却好看天女夜涼乘月到羽車偷駐碧闌干竹居為張行中題南渡循王之子孫文采風流今獨存既有緑筠為别業何須畫戟在髙門小堂翡翠橫叉影曲徑莓苔散屐䀶侍婢牽蘿相輔葺幾回風雨送黃昏菊隱齋為金子才賦蒔菊家園作隱淪要于晚莭伴間身從來東晉多名士豈獨南陽有老人色綻黃花知應候香浮緑酒不過旬蘇耽橘井桐君録從古良醫盡佚民𥘉月薄暮蛾眉臨水出照人猶自未分明𥘉升逺岫如無意欲下西樓却有情離别幾多長在望團圓三五未能成豈知少婦階前拜羅袖才揎恨已盈瑚樓樓前芳樹碧盈盈付與幽禽自在鳴堤上馬馱紅粉過湖中人載畫船行日長燕子語遍好風暖楊花體更輕何限才情𬒳春惱獨教書記得狂名碧梧軒為賈彥仁彥德二貢士賦賈家種玉能成樹上有結巢雙鳯凰隂連深井暮雲碧花落大尊春酒香孔崔羽毛歌扇小石抽顔色舞裙長莫教擊墜軒前緑留與吹笙共晚涼東堂梨花為爾東堂雪滿株花時長是憶吾廬風前恐化莊周蝶月下還迷衛玠車老至逄春成感慨興來把酒為躊蹰尋常一樣清明莭説似當年總不如問月亭衮衮流年逐逝波試將此意問姮娥到頭白髮幾人在愛此清光今夜多直欲仰天援北斗便須儘量酌天河此懷此處不傾倒禁得宋郎秋思何題清心堂詩卷後為相院判賦曽把桐鄉作故鄉衙回繫馬入斯堂竇家五子榮丹桂謝氏諸郎焚紫囊乞得異花曽見種釀成名酒許先嘗澘然掩卷垂殘淚不獨題詩愧老蒼贈謝肅東還風塵如此送君行莫惜離觴與再傾執手且聽楊栁曲過江便是越州城龍駒墮地即千里鳯鳥及時才一鳴年少有才終大用賈生曽擅洛陽名春暉堂為謝肅題謝傅風流在越鄉至今文采見諸郎百年喬木慈烏聚幾日東風萱草長江上鯉魚朝入饌枕前紈扇晚生涼詩成便欲煩青鳥㗸置君家白玉堂次林叔大都事韻四首春來長是誤佳期鴆鳥雄鳩不可私錯信櫻桃懸蟢子悔將衫袖染鵝兒燒殘蠟燭渾成淚折斷蓮莖却是絲辜負緑窗間歲月只教楊栁妬腰枝何處銀鞍白鼻騧忘將錦瑟數年華渡頭水急憐桃葉陌上春狂信栁花那得芳心到鸚鵡泣將殘泪付琵琶一身已自成惆悵况似平陽十萬家莫謾題情在粉墻藕絲終日繫柔腸不知漢主黃金屋何似盧家白玉堂好夢自拋桃葉後間愁過似栁條長無端收得畨羅帕徹夜薔薇露水香陳王當日賦􅓸波寫淂風流也太多掌上玉鸞看教舞雲中青鳥使傳歌情緘尺素魚中字恨織回文錦上梭休信雙星是牛女年年波浪隔天河白菊雪羽毿然欲滿叢秋香吹遍畫闌東今宵白露今宵月昨夜清霜昨夜風朝灌尚于青蕊見夕餐將與素霞同數莖白髮間相對誰識柴桑畤苧翁驚秋城上髙風散鼓鼙樓頭獨客不勝悲老嬰世故嗟流落病念鄉關厭别離仰面絳霄猶昨日驚心黃葉又當時所悲騎省空名纍不是潘郎愛賦詩昔逰春到名園總是花都城無處不繁華冠翹鶡尾朱𫀆盛馬頓金羈白面斜騎吏去忙官索酒侯門晚散妓留車黨家賤妾粗豪慣輕易銀瓶雪水茶小王孫貂帽貂裘美少年圓牌通籍內門前新分草地緑遊牝舊賜􅊮弓未控弦銀甕葡萄春共載玉鞍驕馬日隨牽穹廬一夜迷深雪忘却朝天是醉眠漢未央宫榱題硯雕墻峻宇幾浮雲金石雖堅亦鮮存秦宫三月已灰燼漢瓦千年猶隸文改用尚能為硯器得名何異在君門咸陽土盡英雄骨誰似榱題記主恩匏瓜道人為徐子貞賦吾豈匏瓜繫此生道人玩世以為名百年雨露司榮悴一日江湖見老成濩落情懷莊子瓠浮沉蹤迹楚江萍壺公借與龍為杖拋著青蚨到處行水竹佳處為壺金子賦夏蓋魚龍舊兩都風濤千頃與之俱鳯毛終日在池上雲氣有時生座隅茶竈晚煙連翡翠釣竿春雨拂珊瑚豈同六逸清狂者沈湎徂徠作酒徒謝張彥恭金注傳來九世醫提携襁負滿門楣自來南渡稱髙手豈獨咸陽愛小兒漢史河源知共派田家荆樹是連枝木桃猶望瓊瑶報誰謂酬醫不費詩朱家園海棠天機人事每相催誰到花前不舉杯車馬園林春半後丹青樓館燕雙廽錦幃睡足晨粧在銀燭燒殘莫雨來昨夜綵雲頻入夢米家今見海棠開過王郎中草堂賦藥欄春暖牡丹香胡蝶雙飛不過墻萬彚天機何處靜一年春事此時忙篇詩未覺為時重尊酒能留共日長豈是輞川無作者直邀裴迪賦山堂適軒為致仕浙東宣慰使楊元誠賦道義相忘樂有餘貴施行與待何如間身已付􅕋蘧蝶暇日何妨小小車蜂戀酒香留几席花隨日影到琴書軒巾㝎有何人到弟子時常間起居聽鶯軒何處春來好聽鶯謝家池館越州城緑楊垂地露煙重紅杏映簾風日清醉把玉杯如有待笑停錦瑟謾多情却思舊過宫懎畔著意馬頭啼數聲過鑑湖風流數得賀家湖觀裏黃冠是酒徒笑出市壚留劍當醉臨秋水索花扶當時未免呼狂客後世猶堪勵鄙夫落日無從訪陳迹啇聲為我起菰蒲秋聲自從大火西流後漸覺涼風到竹林李白已無當世想宋郎又動少年心群隂淂勢夜聲合萬物將窮殺氣沉謾索雅琴彈一曲徽絃繞指是商音七夕天上何因有别離人間謾自指佳期果如女嫁男婚事何限風清月白時銀漢幾曽橫鵲影花盤空復罥蛛絲今朝少婦心中事只有回文錦字知寄淮安夏掖齋為感風花懶出門每于時事解知聞江湖信逺春空鴈僚佐情深日暮雲詩句好于何水部官資髙過杜司勳海波不隔淮陽路遙指蓬萊憶使君有餘清堂連雲騎省與之鄰可是髙堂履舄頻湖雨過雲天似玉山風吹酒月留人紅綃貼肉扶歌板翠羽粧頭出舞茵禮法豈為吾輩設直須樂死百年身柬示二姪女連宵骨肉夢相牽二女洪都有信傳聞説長成渾屋喜寄來針線得人憐阿婆近日身差健老嬸今年病未痊爾叔治兵淮水上使回懷抱覺凄然寄內臺侍御史韓克莊雜花猶記兩諸天共禮旃檀古佛前塔院施僧猶昨日齋房聽雨憶當年抄書不許支官𥿄買酒從教用俸錢老盡尚書舊賓客至今慙愧杜樊川夜泊牛渚磯同韓克莊僉事李五峯先輩登蛾眉亭牛渚磯頭青雀舫蛾眉亭上紫鸞笙月中只可賦秋興酒後不冝留步兵萬里長河何處盡百年遺恨此中生大波總是英雄淚剗却青山氣未平浙省感恩榮言懷述事仰拜宣黃萃一門更煩使者枉南轅寵榮已過愚民分存殁俱蒙聖主恩列爵稱男分五等封君有縣亦通尊區區戎馬驅馳後日月餘光照覆盆明皇妃子擊丸圗畫柱相當馳道開黃旗風裏試龍媒天廽日取戎衣起電繞星樞綵棒催供奉嬪嬙俱令色近前便佞是于思九齡猶是開元目何事都無諫疏來重過育王寺明月堂同照大千尊師賦又携二客過斯堂慙愧當年塔院香染習未除塵土念奔馳猶作馬牛忙慚添白髮頭顱上轉覺青雲道路長儘醉堂前舊時月莫將間話及齊梁贈士人軍中售筆古來文字用鉛槧筆至蒙恬始得名每日諸軍傳檄到何人橫槊賦詩成管裁鳴鳯巢邉莭毫運飢蠶葉上聲莫鄙毛錐無所用要知韓范盡書生亷都事海道失風自丹羅至浙右還閩省指南針下失風帆雪浪連天不見山唯爾不懷和氏璧彼蒼竟錫大夫環皇天未厭生戎馬國步何能斷阻艱此去驛程三百里海棠花底度閩關侍御周伯溫以行臺羈留姑蘇柬寄之白頭歲月付流波何物虛名在諫坡屬國莫嫌持節久子陽猶謂見天多強梁不見圖銷印跋扈如聞欲倒戈一樹紅梨春事晚宣文閣下欲如何殘牡丹繞闌莫惜酒行頻開到姚家已暮春瓊樹今朝歌正好彩雲昨夜夢非真園林雖不異前日車馬可憐非舊人欲倩東風問蝴蝶花前誰是百年身贈胡世顯宣使代張氏捧謝表請命朝廷寄仲舉此去風波萬里長使人指日覲清光雲開雉扇當霄漢龍抱金函出表章羌服從來尊正朔包茅次苐貢明堂浯溪有石髙千丈謾叟重煩頌大唐題御史孟昉野服畫像好似當年賀季真乞身歸老鏡湖春銅章不綰御史印練布能裁處士巾麟閣雲臺千載後鳥啼花落幾回新浮雲過眼尋常事且作齊東一野人王自牧汵起敬諸文士逰西湖南山記題其後近聞甚得湖山樂惜不與之同一逰莫問石城來艇子却思簫管在楊州枕邉蝴蝶髙樓夢扇底芙蓉小院秋今覺司勳非往日酒間無復舊風流得編修朱恆海道之音命酒徴歌記往年玉堂遂有夢相牽魚緘尺素雖云密事載空言始可憐季世人材思管樂盛時戎馬説幽燕張騫慣識天河路俯仰乾坤一慨然髙房山畫廬山圖貢雲林待制有詩在上為其子户部尚書貢師泰賦蓋其家物也萬壑匡廬𥿄滿張好詩好畫兩相當十年物色偶然得二老風流何可忘還見虹光生靜夜却驚雲氣濕髙堂尚書座上多逰客獨有張翰思故鄉謝左丞自軍中至同宴周得新員外别業坐來清聽滿風泉頓覺煩襟為灑然馬上功名真是夢杯巾歲月豈非仙浮雲對嶺張圖畫鳴鳥藏花雜管絃莫訝周郎賓客盛雄姿英發正當年兩山亭留題馬頭曽為使君回北望新亭道路開于越地形緣海盡勾吳山色過江來英雄有恨餘湖水天地忘懷入酒杯珍重謝家林下客玉山何待倩人推三月三日湖上作二首此日誰人肯在家傾城滿意事繁華時非上已不為節春到牡丹才是花霧鬢風鬟湖上女畫輪繡轂道傍卓兒童儘唱銅鞮曲未覺人間日易斜此日西湖似曲江湔裙流水碧淙淙誰家婦女不紅粉是處水亭皆緑窗白髮看花春可數盡船扶醉玉成雙邦人何哂狂居士老至間心尚未降汴河懷古家國承平厭萬機輕乘黃屋出亰畿三年巡狩前王有千里看花亘古稀河畔桞條春自長苑中螢火夜還飛當時九廟躬辭日肯信龍舟更不歸涵虛閣館娃宫今靈岩寺靈岩寺是館娃宫霸國風流夢巳空楚客智窮三諫後越師戍合五湖中佳人已化朝雲白髙閣猶涵久照紅誰料後千年過此却慿闌檻數飛鴻叢玉軒在淨慈寺方丈後有鹽運使李員嶠畫墨竹一林儒學提舉趙松雪題名叢玉參政姚江村作記憲副鄧善之書板刻在軒楣河東使君竹成癖落墨滿林煙雨新雪壁自期留後日碧紗誰與護輕塵百年聚散同殘夢一代風流不數人賴是主僧知敬客不辭騎馬到來頻遊天台山回别省院諸公明時無日不從容三月清逰在醉中晚岫逺當雲際碧野花事近馬前紅雖非奉使河源上猶及題詩浙水東甚覺淹留煩從者靦顔何以答諸公送馬編修還明州當年文采動亰城盡説江南馬長卿青史可憐成絶筆白頭相見重關情內湖栁色春仍好小院斜陽晚更明門外畫船堪載酒玉杯儘向故人傾題張叔芳參謀南澗草堂狂客搆堂南澗濱澗巾濯足任魚嗔日容二仲共三􅏙家與萬松為四鄰石角鉤衣歸騎晚花枝妨帽小園春此來不敢歌叢桂知是淮王座上人歲除日同廖如川至太尉丞相府留坐説周易因賜酒拜官曆賦此上謝歲晚謬為趍府客深慙欵接異他人説經每嘆匡衡老賜酒何容畢卓貞明日千官瞻魏闕幾時萬國共陽春家鄉似覺無歸處準擬酬恩致此身贈太火子玄還閩中子玄侍其師貢祕卿由海道遂赴京師至浙西祕卿死險甚蛟龍又則那只緣有路接天河少年謾動乘桴興中道俄聞曵杖歌司馬壯逰空歲月杜陵歸夢隔天河慿君莫下窮途淚何處深山無薜蘿岩阿右丞周伯溫出示前為宣文閣授經郎代祀孔子廟次韻萬世斯文有耿光端然龍衮閟宫墻春秋不獨尊周室金石如聞奏廟堂碑樹丹楹皇帝詔盒封黃帕內庭香至今仰賴遺經在師表前王惠後王送徐大章建寧路學教授經籍傳家二百年河汾今在路西偏文雄虎豹豈徒作名動京師非偶然領教七閩勝作郡受知八座合稱賢佇看召入承明署禮樂遺書在簡編寄我軒為唐主敬貢士賦人世有生皆我寄看來造物亦兒戲身為蝴蝶何關夢飯熟黃梁自有時形影不煩相贈答死生同是一希夷濁醪到手能成醉此趣陶潛或可知送貢師泰尚書入閩發鹽糧供北軍尚書奉詔趨閩省天子深為餉運憂使者頻來大明殿親軍猶駐武安州浮煙壓地朝添竈明月籠沙夜唱籌驛路海棠迎馬首春光難為使君留送杜時中副使南方風土要相冝小盒檳榔好自隨蛋户負魚朝入市囝娘把燭夜題詩三年舊俗猶前日八郡良家異昔時若問蒼生蘇息否使車除是一驅馳夜潮禁得錢塘江上潮惱人偏在可憐宵頭顱如許更能白魂魄幾何仍欲消濁浪漸髙河影沒雄風未到雪山遙西流力盡還東下月滿空江共寂寥自遣每每樽前惜歲華牡丹開後似無花山中謾説秦為晉海上難逄棗似瓜妄想既空無淂夢神仙所至即為家不須更問升沉事看取西樓月又斜秋閨詞一曲哀筝感素秋梧桐落盡碧溪頭御溝葉上誰題怨錦字機中自織愁紈扇恩情空望望鯉魚書信更悠悠雙星不到銀河近風浪過于隔十洲無題及時無物不倀倀燕語鶯啼總斷腸洛浦輕塵憐故步揚州舊夢惜餘香玉和獺髓寧無藥絃續鸞膠信有方便把漢江都作酒飲時猶恐負春光辨謗詩宣徽院司議李榮貴以使事至明州飛語獲謗拘留二年乞詩白其事司徒方公命還亰師司議因乘海上槎河源歸路未應賖市巾徒爾疑成虎杯內何曽影似蛇官事吉凶占鵲語閨房消息卜燈花南風乞得樓船便六月中旬便到家縱飲外湖裏湖花正開風情滿意看花來白銀大甕貯名酒翠羽小姬歌落梅身外功名真土苴古來賢聖盡塵埃韶光如此不一醉百歲好懷能幾回松筠軒為湖州沈叔方賦軒居好在松筠裏門外清溪繞屋廬文物曽陪諸老後故家似是百年餘客來與酌茯苓酒月出共看科斗書若見漁郎煩借問桃花清思近何如謝吳宗起寫神紫綬空慙老在身每于時事與經綸不呼賀監為狂客却謂張良如婦人潦倒形容何用似荒唐言語半非真凌煙畫像今誰在更與丹青寫此神送劉庸道侍老父入閩就飬此别為生一悵然福州逺在海南邉白頭病叟年八十紅樹寒山路幾千負米既供為子職賃車不仰故人錢起居莫與檳榔逺風土他鄉氣候偏栖霞嶺訪姚子章買得湖船為訪君望中都是北山雲風前楊桞驚秋晚波上芰荷愁日曛青火縱能傳後世白頭休更説從軍棲霞有酒能留客縱飲何妨到夜分送張伯雅架閣入閩省聞道連年瘴氣收城中風景稱清逰參天榕樹快人意似雪梅花當馬頭海客朝盤送珧柱囝娘春詠寫銀鈎母嫌習俗閩中利儘勝吳船唱莫愁題貫酸齋蘆花𬒳詩後學士才名半滑稽滄浪歌裏得新知靜思金馬門前直那似蘆花𬒳底時夢與朝雲行處近醉從江月到來遲風流滿𥿄龍蛇字傳遍梁山是此詩劉生侍貢尚書入閩卒業藉甚劉生尚古文師資貢禹卒前聞從公未覺山程逺到日須知土俗分紅嚼檳榔霞滿口白飛鸚鵡雪成群七閩自惜稱文物莫説三山盡瘴雲感事雨過湖樓作晚寒此心時暫酒邉寬𣏌人唯恐青天墜精衛難期碧海乾鴻鴈信從天上過山河影在月中看洛陽橋上聞鵑處誰識當時獨倚闌老至翻遭世慮牽何曽一覺淂安眠家鄉尚逺潯陽郡世事有如天寶年朝報唯瞻遼海上羽書不斷省門前長星正在天西北白水寒沙盡可憐雨香堂為晦岡李介夫賦雷電冥冥起晦岡百年虛氣會斷堂友人李願在盤谷髙士嚴陵是故鄉薄有資囊供一老盡將文采付諸郎酒坊新斫松杉架每日風來兩氣香席帽山人王達見貽詩附録畫省委蛇退食遲倒衣相見即相知風流不減張亰兆心迹無慙栁士師枕上燕鶯鳴署日道傍花蘂罥逰絲天機人事都觀遍有約山中賸採之題桃源州知州李尚志母暨陽縣君蔣氏墓志銘後承旨學士榮祿大夫晉寧張翥撰小龍岡上有髙墳石表新題蔣院君五品官榮清代爵一封誥織紫鸞紋生兒何愧孫征虜作志可無楊子雲歸去焚香人事畢大夫元是舊將軍題原善張府吏具慶堂張子搆堂題具慶此生捧檄為榮親府中年少固可數幕下英才惟此人尚褧錦衣加吉服忘憂諼草共陽春移忠錫類從兹起何患風雲不要津題推官贈行卷聖主搜賢及海隅王褒歘起應時須澧蘭處處歌公子楚國人人誦大夫藉甚姓名登制命霈然霖雨下雲衢力田孝悌興岩穴何異福王遺畫圗西湖漫興玉局當年為寫真西施冝笑復冝顰朝雲暮雨空前夢桃葉栁枝如故人露電光隂千劫外魚龍波浪一畨新傷心最是林逋宅半畝殘梅共晚春清概隱居門向東吳好處開栁花風裏白鷗來青山對榻容欹枕黃鳥啼春索舉杯賓客偶携紅袖至庖厨新得素鱗回滿前清概誰能領消得曺公八年才贈仙都生栝蒼仙都十二城中有異人毛骨清淩風振珮片霞舉乘月吹笙雙鳯鳴山上羊眠如石化洞中桃熟驗丹成長鑱採藥或能見不識此生真姓名聽雪軒化機潛運本無聲學士情多睡未成隱兒欲同蟬殼蛻開門唯恐鶴巢傾花飛翠袖寒光動茶煮銀瓶夜氣清小閣下簾人似玉舞衣製得五銖輕慧具庵自灤東回慧師新自上亰回壞色袈裟染劫灰河漢路遙難載石蓬萊水淺不勝杯已知道骨鶴同瘦無復機心鷗可猜去把西江都吸盡却從馬祖問如來仙姑泉次劉郎巾韻誰把丹崖手擘開巨靈還到此中來青冥風露銀河近白日雷霆碣石摧神女有時成暮雨胡麻何處是天台劉郎舊不通仙籍能得題詩在紫苔江浙省理問朱文選為妻兾縣若求挽詩鏡鸞莫更惜孤眠白玉臺前幾抱孫兾縣君今題鳯誥婦人貴已載魚軒何須出涕悲同穴政可長歌為鼓盆夫壻白頭無所憾只求文采賦招魂湖山堂觀牡丹儂香偏惹宦逰人銀甕連車載酒頻乍雨乍晴三月莭傾城傾國一年春却勝飛燕為皇后謾把驚鴻比洛神若問風流誰可賦只因宋玉是東鄰和三腳雞士壁上賦河上仙翁有洞房几蓬雖小勝舟航徑花妨帽青霞近楹竹侵衣白露香盤內釣魚供過客床頭剪月照抄方平生飬得雞三腳幾向人間唱曉光素居詩為山隂王思敬賦飬素衡門歲已深坐看喬木幾成隂青雲不到幽人夢白髮能知閲世心附郭無田遺稚子傳家有集是黃金絳霞盈頰先生醉詠遍堯夫擊壤吟送宋倬還南康及此青春還故鄉順風幾日到南康峰連五老出空闊水接二孤來渺茫徐福樓船能共載劉安雞犬亦相將山桃子落都成樹花裏應迷舊草堂答仁一𥘉禪師次韻冨春江頭風浪稀冨春山裏薜蘿垂滿前明月為誰好中有髙僧勞我思意適定同魚躍處神清多在鶴鳴時仰承山偈難酬答不是張衡懶賦詩過峽石山張同知墓上作平生好友説張侯紫峽雲深墓木稠朱􅌧尚能光世澤黃金元不為孫謀夜冠南郡成前輩風月西湖捴舊逰過此豈勝存殁感恨無孤劔挂山頭題若水臨周昉畫用虞先生韻一片行雲出畫簷東風吹恨滿眉尖􅓸波鵠峙塵生步舞鏡鸞廽月照奩楊栁緑肥羞裊娜櫻桃紅熟昈香甜風流更有驚人處呼下丹青語未淹贈王法師祈雨感應名銜知久逹天關可是風雷指顧間禹步㕨香才一息雷聲送雨已千山公私盡有倉箱望壠畒都忘稼穡艱下土不知蒙帝力滿城簫鼓送龍還蘭窗圗為戴椽賦舊家文獻石屏翁楚國髙情世所工捐佩憶曽過澧上浩歌今望在雲中色欺翡翠滋清露香淡薔薇送好風可意郎君玉窗裏肯將幽興出蘭叢謾興浮世浮名一羽輕百年何用較衰榮滿壺好酒供春酌幾尺遊絲共晚晴明月半遮盧女扇飛鴻斜引謝家筝揚州杜牧無拘束每到花時最有情送戴檢校入閩叨忝明時已自分往還唯是舊斯文西窗夜雨同聽處左掖官曹獨有君茉莉䘖香騰玉氣荔芰顏色染羅紋風流東閣應多咏肯與幽蘭寄暮雲雙清館蔡參政立名廬陵兩生來作椽虀甕長年氷雪寒中書八座共相許華衮一字誠為難風神左右映白壁文彩上下翔青鵉况聞客館更清爽秋色南山相對看送湯僉書還亰天上城開白玉京仙曺列聀侍金庭行天半是從龍氣載筆都慿躡鳯翎鳷鵲西飛雲渺渺蓬萊東望海冥冥道家自古無離别唯誦空歌送使星園隱為方員外賦省郎别業苕溪上抱甕日逰溪水邉花徑春晴胡蝶到菜畦雨過桔橰懸兒童慣識題詩客鷗鳥長隨載酒船更説陳琳工筆札獨將文彩從戎旃佑客不用雄蓋世勳不須考證六經文孰為詩火杜工部誰是玄經楊子雲馬上牛頭髙一尺酒邉豪氣壓三軍鹽錢買得娼樓宿鴉鵲鴛鴦醉莫分題前後赤壁賦圗黃州故事今何在漢水東流尚未窮一世英雄爭赤壁百年風月屬坡翁吹簫俊發龍吟後作賦才豪鶴夢中二客從逰雪堂夜丹青猶與昔時同題曹伯起雲門小房相國傳來幾世孫山房隨處見雲門矦家畫戟固無有舊物青氈俱尚存清譽在人瑚璉器髙情終日鳯凰群芝蘭玉樹階庭秀已是新承雨露恩送布政司周照磨赴京聽除沿􅊾回京喜可知青雲母謂著鞭遲供為臣聀乃常事簡在帝心唯所司宗廟豈遺瑚璉器羽儀當會鳯凰池仙郎戀闕情應切不為河梁住少時忠飬堂為張府掾賦張氏搆堂情已著毛生棒檄事方新府中才俊固多士幕下孝亷唯此人返哺老烏憐白首冝男芳草擅青春莫論日用三牲飬一面歡顔足奉親筠窗圗為荆南曺以章賦豫章徐文珍畫此君何可一日無徐君為繪筠窗圗深居碧雲憐日暮展卷清風生坐隅漆簡舊來銷翡翠漁竿釣罷拂珊瑚荆王不近周王獵晚節猶能宿鳯雛秋水軒為陳惟真鏡湖一曲越城邉溢岸秋波若可憐雪點荷塘看鷺下煙消沙渚見鷗眠賦成騎省從班鬢酒在稽山信畫船何在望洋奔海若軒中自足管流年題大隱菴開士殊無别逺翠樓坐來未覺西山逺紫翠千重隔畫闌此處豈容携酒到任誰只許捲簾看佛爐香供朝雲散客碗茶分雪乳寒一自得陪清論後此心不用倩師安醉漁為錢思服賦江湖猶自有狂夫白髮蕭然負壯圖睡著任船隨月走醉歸臨水索花扶要知吕望真漁者可惜酈生非酒徒澤畔獨醒誠可詠春風能到雪肌膚次韻處士和塤上人詩每到爐頭憶懶殘十年戎馬雪窗寒亂來亦為功名易老去才知世路難醉把茱萸應自感狂題鸚鵡欲誰看相逄白髮秋風裏何惜銀燈照夜闌司馬溫公九世孫碏持公自書獨樂圖并東城詩到今將二百餘年𥿄不盈數尺手澤猶存感而賦詩浮雲聚散豈堪論富貴何如道德尊幾見蓬萊成淺水可堪風雨換髙門𥿄圖價匪千金重手澤傳能九世存眼見寢園成茂草却知司馬有兒孫留别寶林同别峯講主深酒船謾爾到山隂賴有髙僧在寶林不信孤鸞臨寶鏡更無流水入瑶琴間吟蝴蝶過鄰近醉擊珊瑚坐竹林此去浙江才百里興來命駕即相尋留題滴翠軒城中買地論黃金種得琅玕欲千尺月臨間砌白煙生霧入空林翠光滴長房杖騎龍一枝子晉笙吹鳯雙翼曽過門前廽酒船洞房清歌逺山碧贈李學究裒然縫掖更垂紳見客何曽有怒嗔講道誰為木鐸者摛詞真似玉堂人舊書幾帙俱先集修竹千尋是切鄰每向百花時莭到長裙自醉小園春重陽日寄洞霄宫賈道士天官侍郎曽寄音因循秋晚始相尋張良中歲頗好道賈島一生成苦吟敢學遊山隨猛虎要聽搗藥試微禽丹泉况説紅如酒好與茱茰一處斟田園居早歲歸田古所稀豈同􅕋瑗晚知非臘醅儘醉顱鷀杓春服仍加薜荔衣一畒園廬皆樂土百年冨貴盡危機沙頭幾動鱸魚興每到花時與願違明州倪師園觀猿捷于風雨過喬枝乍鎖名園亦自疑幾萬里來都是恨苐三聲後最堪悲月沉夜澗魂先去露滴春稍淚對垂冨貴豈能長汝役緑珠還有墜樓時晚歸左掖歸時日未斜小園檢校舊生涯染裙萱草才抽葉破雪櫻桃又著花玉斚試斟官給酒銀煎重瀹貢餘茶西湖水色春來好説道風光似謝家雪溪船為李勛賦玉山自倒雪溪船何似長安酒肆眠良夜竹聲偏到耳舊時月色不論錢佳兒出見詩能誦好客來頻榻懶懸更有落梅歌小妾儘堪陶寫盡餘年徑山興聖萬夀禪寺之廣福菴乃曇芳忠公道場其徒統上人居焉菴前舊有海棠樹洪武三年結實大如木瓜五色有香嘗謂海棠春一夢却成因果結天葩有同仙客誇桃實不待詩人賦木瓜龍頷珠今歸汝手錦衣囊合在誰家明年燕子來時候更與維摩作散花鄰園海棠自家池館久荒涼却過鄰園看海棠日色未嫣紅錦𬒳露華猶􅊜紫絲囊掌巾飛燕還能舞夢裏朝雲自有香銀燭莫辭深夜照幾多佳麗負春光題王維賢東里草堂周遭都是及肩墻馬過猶知舊草堂苔􅏙兩晴蝴蝶亂藥欄風暖牡丹香萹詩未覺為時重杯酒能留共日長豈是輞川無作者却同裴迪賦山莊慕雲菴此菴長與此雲期大孝終身有慕之杯圈更無重飲日板輿還有再乘時行天雨絶皆為淚落日烏啼捴是悲誰刻會稽山下石悠悠千載白雲詞題秋江送别圗故人寫出陽關意都付丹青半幅中霄漢正當鳴鳯日帆檣好趂大鵬風酒期鸚鵡偏能緑花贈芙蓉可奈紅對此題詩無所囑百年輔報是深衷寄戴山人近水齋房自掩扉若耶溪路客來稀浮沉里閈時將隱俯仰人生事已非小妾謾歌楊栁曲髙年渾稱薜蘿衣誰能冨與封君等千畒湖西紫芋肥醉題二月鶯聲最好聽風光終日在湖亭清宵酒壓楊花夢細雨燈深孔雀屏情在綢繆歌白苧心同慷慨贈青萍方平自得麻姑信從此人間見客星贈朝元宫道士邢本𥘉朝元宫裏邢道士神采照人如玉山壺中日月付談笑天上風雲從往還虎守杏林丹已熟龍眠秋水劔長間共傳紫氣如車蓋往往相隨出近關觀雪銀燭髙燒錦瑟停酒杯如對六花傾清寒未覺貂裘重小舞偏憐翠袖輕金谷緑珠紛有態鴻門玉斗碎無聲九天散漫隨風處莫是天人咳唾成筠深軒幽居只在平湖上萬竹冥冥不可尋龍化每因春雨過鳯巢多在碧雲深人皆到此失炎暑風忽過之如瑟琴能有此君相晤對故家何用積黃金晏居有懷徐一夔教授逝者如斯繼者誰遺經獨抱可勝悲心忘爵祿身方逸道載文章老始知乳燕試飛華屋靜桐隂𥘉合畫簾垂古音最愛朱絃瑟彈向髙堂念别離題孝義詩卷可將言行以書紳淮海維揚見若人慷慨分金存乃叔艱難返骨葬其親刺詩杖杜於今廢髙塜麒麟自此新俯仰即今無愧怍平生張掾厚􅉓倫輔賦征雲南椽史凱還詩大矦秉鈇行天討戎幕論兵聀匪輕勢若摧枯狂虜滅文無加點捷書成日陪赤舄紆髙步身附青雲致盛名入奏㝎功應賜爵班超元是魯諸生水竹居為諸葛伯安賦諸葛南陽有草廬何如于越此幽居門前修竹畫不就湖上好山清有餘日暮碧雲生悵望天寒翠袖若愁豫鯉魚遺我平安信盡向琅玕莭內書七夕七夕佳期自古今雙眉有爛夜沉沉可憐乞巧樓前月曽照長生殿裏心鵲引凡情瞻繡户蝶隨秋夢入羅衾斜河已沒東方白雲濕幽蘭思不禁
