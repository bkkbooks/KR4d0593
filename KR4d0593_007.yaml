front:
  text: 張光弼詩集卷之七
  hash: sha256:c5e605022df47eab6c395143d811a33ab7ec9fc68ac7a4b9d393dcbc19e8243b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_007-1a}
body:
  text: 題徐俌墓銘後肯堂處士吾故人嘗過其家今其子溫以戴良銘墓見示愴然有作百年人事謾紛紜覺却南柯夢自分名莭不虧惟獨行墓碑無愧是斯文器中瑚璉非虛譽天上麒麟竟失群髙義有誰如季扎願同留劔掛徐墳送都司邵德章之亰師還記尊前㑹往年又看沿􅊾上朝天青雲自此而升矣白首何堪為黯然劍珮東華深雨露文章西府盛才賢鳯凰池上因多暇為賦停雲慰老顛張旭也題嶽鄂王祠落日西湖土一墟黃泉赤血恨難除開邉衆許儕韓信舉國渾憐喪子胥廊廟錦衣忘板籍京師黔首盻鑾輿即今五夜梅花角吹作南來問訊書過湖山堂舊基見杏花飲賜黃封未幾時丹青池館盡荒基何人富貴可長在自古衰榮更共之樂事恰如春夢覺狂情惟有杏花知醉翁莫說當時醉團扇題詩忘與誰紫薇樓感事太尉當年宴此樓長繩直欲繫清秋隔欄畫舫是湖水捲幔青山見越州疊鼓夜催諸將醉髙燈春照美人愁大夫司馬今頭白不獨登臨感舊逰自貽近年頗覺志悾恫不復行雲入夢中聽曲任教絃有誤賦詩何必句能工豈唯走卒知司馬還有滁人識醉翁樊素小蠻俱未遣幾曽虛度百花風東林之子青年獨老成布𫀆寬博稱其名李膺謾自知文舉楊意無能薦長卿每到草堂成酩酊偶過花徑亦逄迎卜鄰自覺頭加白轉信前賢畏後生虎立寺留題莓苔欲遍盤陀石知是梁朝古道場陳迹謾驚成俯仰空門元不與興亡白漫天上俱兵氣赤伏池中是劔光如㑹生公重說法勸教東海莫栽桑送張丞之湯隂憶昔銀燈鼓瑟琴屏開孔雀夜堂深頭顱謾有新添雪囊槖都無舊賜金好夢未成春漏盡殘星猶在曉河沉郎君自上班騅後露滿銅盤泪不禁題蘇西坡編修自撰墓志後笑傲中吳豈問津風流自擬雪堂人白頭已了浮生事黃土真埋不死身江上鶴飛前日夢門前花散去年春漢家政爾論封禪知有遺書獻紫宸籠鶴軒然羽翼更何之每見雲霄惜舊時鳴候露華生玉樹舞憐雪影散瑶池垂頭就食誠何報側目隨人祗自悲恩重主家看飬别不教鵝鴨混階墀囊琴鍾期何在鑄黃金膠添相投日以深妙製偶經雷氏手虛名猶說蔡家琴千年流水髙山趣一旦離鵉别鵠吟塵滿弊絃雖未試不彈還自有知音亰城得家書題示兒子張同同蘇郎不是飲中仙只好長齊繡佛前蝶到枕邉身是夢花隨春去日如年芙蓉别館還依舊鸚鵡小窗殊可憐縱淂歸來城郭在銅駝冷露濕荒煙寄淞江楊維禎儒司畫蛇飲酒合誰先塵土東華四十年海上豈無詩可和雲間還有事相牽牡丹開後春無力燕子歸來事可憐欲倩鐵龍吹一曲滿湖風浪又廽船夢梅花處為董師程賦江南枕上見梅花一片寒光接素霞蝶化夢魂雲縹眇香生肝肺雪杈丫乃知姑射仙人宅即是林逋處士家白玉堂深簾幕靜畫成踈影在窗紗中酒連日醉頭扶不起記曽有說酒能醫知傷肺氣終為患不典春衫亦是癡小閣留僧看鬪茗矮床對雨教彈碁餘年有甚唐人癖稍得間情便賦詩寄韶州知府金鑑自君領郡韶州去鴻鴈天涯兩送秋盛氣不題鸚鵡賦髙懷應倚仲宣樓蹇豫滯迹猶滄海之子勞形欲白頭鐘乳囊封能逺寄暮年此外更何求碧筒飲次胡丞韻小刺攢攢緑滿莖看揎羅䄂護輕盈分司御史心先醉多病相如渴又生銀浦流雲雖有態銅盤清露寂無聲當年欲博千金笑故作風荷帶雨傾又花外風來香滿湖折荷舉酒笑相呼自來四明有狂客除却髙陽非酒徒飲處有情絲不斷折時多刺手難扶豪家玉斗雖云貴有此尊前風致無送丁道士還澧陵丁令還家骨已仙更無城郭有山川未添白髮三千丈又見銅駝五百年荒草茫茫連故國孤雲冉冉下寥天澧蘭歌送潺湲水望極涔陽思惘然題右禪上人房一染曇花百念空淨香吹遍吉祥風鈎簾燕雨時時過洗鉢魚波處處通雞有佛緣曽聽法檜因寶界漸成龍三生誰識蘇居士唯是鹽官北寺鐘寄孟昉郎中孟子論文自老成蚤于國語亦留情省中醉墨題猶在闕下新知誰與行紈扇晚涼詩自寫翠鬟情重酒同傾接輿莫更間歌鳯只可徉狂了此生寄周昉處士為爾停驂幾扣門每于清事得相論山中載酒梅花過湖上放船春水渾間到竹齊為解帶坐深苔􅏙與開樽當年醉墨留題處風雨新添屋漏㾗題福源編後福緣山作魏家墳知是唐朝宰相孫石首令前官有考咸通年內碣猶存大湖渺渺連精舍喬木隂隂拱墓門千載􅓸煙勳業在可無遺澤及諸昆謾逰甚矣吾衰百念慵花開時復一支笻邦人幸爾不豫鄙兒子樂然為我從載酒有時尋古寺看雲終日對孤峯林家湖上都能說二十餘年老醉翁月桂堂為集慶講主佛國山中古道場月中桂子散天香一枝得共人如郤雙井能來客姓黃誰詠碧雲題樹葉自收清露染衣裳南峯不與清光礙好放餘隂及四方九日過長安鎮王山人因過王生忘坐久階前花有白雞冠草堂出酒生新敬雪壁題詩記此歡肯謂陶潜逄九日却如李白醉長安老夫遍賞東籬菊搖落群芳正耐看歸隱圗為張别駕賦難得歸來賦考槃髙情都付畫圗間可能白首更干祿縱有黃金難買間酒舫載春携二客巾車乘醉從雙鬟陶山地接東西眺謝傳風流或可攀宗陽宫次楊仲弘老若臺觀月詩韻當時諸老宗陽㑹月與浮雲幾變更丁令豈知為鶴事道人猶作賣花聲天溥露色開蟾鏡秋送商音入鳯笙誰信紫薇垣內客今宵又復到蓬瀛送康穆庵赴福州能仁寺席佛運興隆此一機尊師何負七條衣講經春殿人天衛呪鉢夜堂風雨歸花為散來春冉冉栁從攀後思依依幽蘭荔子南方物籠護函封寄莫稀病起花事能消幾夜風櫻桃葉底又深紅豈無金縷湖波上閒却玉杯春雨中枕上楚雲元是夢鏡中潘鬢惜成翁莫言輕薄揚州事著意題詩也未工題雲林隱居圗為崔彥暉賦崔郎志趣在雲林筆底遙岑自淺深欹枕不忘啚畫事開函又動隱居心粉㾗白白生雲氣黛色沉沉覆樹隂幽思不教忘夢寐耳邉長似有猿吟㽜題費山人舊館舊館經過不用期掃門常恐鶴來遲但知重客唯司馬不顧狂言有牧之秋雨石枰看對奕夜堂銀燭照題詩佳人底用千金産只此髙間可不知經鋤齊誰似談翁樂有餘百年生計可林廬甫田種熟門前稻暇日抄成架上書睡起慢憐衰甚矣客來唯問近何如相過里社尋常事只把柴車當酒車謝寶林寺别峰法師惠僧履也知鰻井猶龍井合有交逰似二蘇起舞謾憐成短䄂徒行始覺是窮途書從堂上出雙鯉舄向雲中墮匹鳬無復舊時公府步君門望絶沒湝趣宿郭子振雪洞月光一色杳難分不見丹青藻梲文胡蝶飛來疑是夢梅花開後却思君都忘長日將紈扇猶恐餘寒到練裙宿酒覺來看不厭滿床秋思白如雲答韓介石提舉偶持尊酒看花傾有客能來道姓名佳句才探出懷䄂故人知是不公卿平生學劔心都懶此日歸田計可成彼此頭顱俱種種題詩那得不關情冬日白牡丹律琯催春到牡丹行雲欲墮碧闌干似嫌脂粉能相汙故逞肌膚獨耐寒雪艷最冝金縷蓋天香合是玉雕槃趙昌花鳥新馳譽畫作屏風後面看老圃堂不謂斯時有此翁無能田畝纍其窮異𬞞自灌欲百品老圃官量無十弓草閣曉梳秋髮白玉杯春醉夕陽紅餘生儘可忘榮辱事與樊遲請學同鄒將軍挽詩為臣豈欲國傾危莫把天戈挽落暉一死得埋元氏土寸心無愧首陽薇安居食祿當時貴守莭酬恩此日稀老我嘗從大夫後題詩為爾泪霑衣同貢有𥘉觀潮賦舊時八月潮生日士女傾城出看潮秋唾似從天上落晴􅌚宜向酒中消氣爭鳥道為森爽勢合龍宫亦動搖今度可憐成獨往海門斜日共蕭條自賦髙陽酒徒今老生蚤年擊筑和秦聲許人不負一諾重買笑唯恐千金輕花間駮馬銅鑄出枕上愛姬雲化成誰信青門種瓜者自梳白髮向秋晴僧惠炬有悼黃晋卿太史偈次韻保叔塔日鼓西沉逝水東它生還有此生同蓮花漏豈知元亮茆屋詩曽詠已公夢幻已空身外蝶文章猶􅍢蠧間蟲間情最是山前塔日夜風鈴語未窮寫易軒為方以愚賦不于闕下見文星天與冥鴻惜羽翎人世誰能雙鬢白家山自是亂峯青霞分曉色留書几斗轉寒光落硯屏觀象玩辭從寫遍方千何忝舊明經挈家啚為尤仲斌題葛洪挈家赴勾漏何異龎公歸鹿門擔頭何有琴書纍牛背未覺妻兒村千古清名不易得一斛丹砂何足論大勝齊侯馬千駟令德曽無遺子孫悼王自牧貴賤交逰二十年忍將老泪灑新阡蓋棺不必論身後入室猶如在眼前一首詩今為爾惜數行志在得人編錢塘吟士長相望潘閬林逋孰後先思橘軒為悟空叟長老賦侍書遺墨函封在思橘名軒示不忘往事百年同逝水斯文一語有餘光風流大抵輸前輩臭味還應是故鄉嘉樹因知培植厚只今百顆許誰嘗逺翠樓為殊無别上人賦坐來未覺西山逺紫翠千峯隔畫欄此處豈容携酒到任誰只淂捲簾看雪晴黛拂蛾眉緑雨過螺堆佛髻寒分淂半櫺間拄笏床頭寧復更彈冠蚤行涼風滿棹賀湖邉越上諸山盡可憐逺漢片雲承落月長林匹練曵輕煙窗間織女燈猶在井上啼烏客正眠何用間愁隨夢覺一聲菱唱發前川次韻周昉大尊堂上幾曽空客有登門道未窮吟鬢肯因愁裏白舞衫偏愛酒邉紅百年喔喔雞聲月萬事悠悠馬耳風及此舊逰情分在儘將春付笑談中贈沈生還江州鄉心正爾怯髙樓况復樓中賦逺逰客裏登臨俱是感人間送别不冝秋風前落葉隨車滿日下浮雲共水流知汝琵琶亭畔去白頭司馬憶江州贈寓客還瓜洲把酒臨風聽棹聲河邉官栁緑相迎幾潮路到瓜洲渡隔岸山連鐡甕城月色夜留江叟笛花枝春覆市樓筝贈行不用歌楊栁此日還家足太平無題灼灼庭花露未收樂然雙燕語綢繆新粧滿面猶看鏡殘夢關心懶下樓春到自憐人似玉困來誰問酒扶頭狂蹤已作風絲斷敢怨流年似水流長安鎮市次趙文伯韻淹遍衣衫酒未乾何如李白醉長安牡丹庭院溥新露燕子簾櫳過薄寒春晚絶無情可託日長惟有睡相干舊題猶在輕羅扇小字斜行不厭看與白範論詩白家少傅諸孫在坐語都忘日晷移不用入吳求季扎有如過晋得鍾儀髙情欲共逰絲逺倦迹猶嫌過鳥遲莫道古今風雅異捴于衰晚始相知冬至日次張太守韻喜色輕黃未上眉且將心事付遊絲嵇康取醉非關酒杜甫長吟不為詩一線日長宫女覺五方雲應史官知人間梅栁關春事次苐從教律琯吹對雨好是西湖醉後聽打窗驚栁隔堂屏鶯花又送春光老鳬藻偏㴠雨氣腥曲按銀筝何太急杯行玉手不須停樽前便是巫山夢莫道行雲事未醒趙松雪畫茗溪清逺啚吳興元是水晶宫樓閣溪山罨畫中酒舫載過寒食莭舞衫吹遍鯉魚風當時樂事誰能見此日王孫自不同亭下鷗波如有感行雲猶在玉尊空寄胡侍御後市街頭相見稀此翁真是早知機浮沈里閈陶彭澤輕易官資白紫薇小妾畫堂楊栁曲髙年白髮薜蘿衣風流莫負持螯事越上湖田蟹正肥次韻張都事老却樊川杜牧之風流誰賦栁絲絲不關請誥來歸蚤唯恐尋春去較遲畫舫行時長載酒粉墻到處即題詩至今留得狂名在唯有纎腰弟子知謝僧惠蒲履大夫此日可徒行蒲履深煩逺寄情除是髙僧求易得自非巧手織難成春來見客身差健老去看花步覺輕他日袈裟如過我㝎須著此出門迎寄羅博士莫說文星與酒星己同傖父泣新亭夢中此日頭能白海內何人眼更青鵑化羽毛猶姓杜鶴歸華表尚名丁縱然記得前朝事彈向銀筆只自聽荆溪漁者為義興道士賦千尺荆溪徹底清水中無復見蛟行要同雲鶴間踪跡自放煙波隱姓名濁酒忘形浮世內青山到眼緑蓑輕醉來放棹回船去拊掌風前詠濯纓㽜題徐子方客樓倦逰到處即淹㽜雖是孤村境却幽松下野雲間似鶴門前溪水淺于舟琅玕復簟兒