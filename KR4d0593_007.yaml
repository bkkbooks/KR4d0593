􅊚俱相門學傳莊莭道弥尊幾編家集文章在十世宗支譜系存猶喜繼韓能有子尚憐承祭見諸孫項原瞑目知無憾手録清規付後昆挽崔彥暉母趙夫人趙文敏公之孫女情忝通家見嫁時環珮盛儀猶內院波瀾餘澤自天池佳兒𥙿蠱承先志淑女冝家副夙期已託文章題琬琰百年墓木照豐碑𥘉至芳溪義興罨畫溪頭雪水渾是誰酒舫過溪村故人見我即握手步􅓏看花直到門倉卒傾銀開內閣從容步玉出諸孫餘生愧忝通家舊委曲交情可盡論吳子道招同兄輩嘗子鵝張旭何嘗是酒徒深煩為我作春酤酒行天降盤中露鵝割囊封塞上酥跡逺五湖身既隱醉歸三􅏙子能扶南山逺對東籬菊除却陶家别處無梓軒為湖州曹生賦當軒雙梓碧沈沈直幹凌空過十尋客到不妨為少憩風來或可助長吟百年大用充梁楝一日希聲中瑟琴宜子母忘角弓賦將期奕世共清隂同韓介玉過月溪上人玉雪軒髙僧習靜之所在繞院竹梧生晝隂此境冝居玉堂側是誰移置雪山深銅瓶薝蔔不自供碧碗醍醐為我斟老得一間君所賜小車隨處是山林次雪鶴生詩韻詠海上歸俗僧新安失莭婦北窗晝眠驚扣門詩筒逺寄願所聞太學鄭䖍固三絶小字李潮仍八分湖上好懷非往日枕邉殘夢是行雲兩年屢有倩逰約幾似空言以屬文又雄鳩鳴鴈即天涯未覺藍橋去路賖夜枕不迷胡蝶夢春衫深染石榴花千鐘縱意伯倫酒七碗清心諫議茶錯向牆頭窺宋玉風光元在魯東家贈湖州楊均顯製筆當年馮陸擅吳興曽許楊生寄盛名三館每蒙諸老重萬鈞不博一毫輕歸來未覺江湖逺落拓寧知歲月更潁也此詩須自薦國家用爾頌升平柘軒詩為教授淩彥翀賦滿軒桑柘共生成坐愛春風日向榮五畒宅思鄒孟子百年心慕李延平葉供蠶事誠何損衣彼民生獨用情中有如綸五色線願從衮職𥙷升平武林嚴子英家世善製筆嚴應始以筆治生至今孫子大其名用世雖云四寶具傳家貴在一藝精東郭之㕙即毛潁南山有竹俱管成器利天下功不有慎守其業母自輕昌化縣學訓導章琛抄録武林郡志還鄉唐相郇公尚有孫不將家世忝斯文髙堂别席事抄録小帳停鐙較紏紛脫藁近知將解局疏麻擬折遺離群武林郡志多竒事歸對諸生誦所聞示山中白雪牛耕田世界絶纎塵白玉毫光照爛銀蘆葉膝邉穿得過天花背上落來勻狂蹤未定難明性妄想俱空始見身驀直路頭如不錯也須慙愧執鞭人過上虞仙姑岩觀瀑布泉次别郎中韻誰把髙崖手擘開巨靈還到此中來青冥風露銀河近白日雷霆碣石摧潭上龍漿溥絳雪廟前馬跡過蒼苔猶勝漢使經年别載得河邉片石廽深雪齊為金西白長老賦道人宴坐維磨石積淂天花似雪深明月有輝同大地白蓮無影到東林抽毫司馬應難賦斷臂神光或可尋落絮逰絲紛滿眼從教門外作春隂書藥舟為湖州沈玉泉架閣賦溪上香吹白藕花沈郎舟楫自為家雙鬟蕩槳乘流去小榼留人易日斜採得緑荷成野服慱來紅米是丹砂綵鵉韻寫松烟墨不與青蛇道士賖西湖晚春憶昔東坡為寫真至今詩句在逰人朝雲猶是當時夢桃葉渾非舊日春鶯燕情懷千語少魚龍波浪幾回新傷心誰問林逋宅零落殘梅共晚春留峽石朱山人家桃熟許同朱老喫却先桃熟為開尊白魚入饌溪鱗是紫茁堆盤野味存詩和淵明為我誦酒沽若下勸人醺迂疏且作須臾者何嫌久候門海昌雙廟同張太守次壁上題韻孤城請援待王師保障終成壘卵危作厲誓將擒賊去分羹何惜愛姬為忠臣盡命以報主信史大書無異辭三十六人同日死獨呼南八作男兒趙松雪墨蘭王廬墨妙世無同九畹高情更所工捐佩昔曾過澧上浩歌今望在雲中娟娟奕葉承家澤淡淡幽香媚國風莫把騷辭煩宋玉賦成還到楚王宫松隱齊誰拜青松作大夫蒼然離立共迂疏風聲白日回清夢雲氣長年到隱居剪葉浸泉春釀酒截肪點火夜鈔書歲寒卉木俱零落一伏人間不願餘剪韭軒為韓叔賢賦魏公七世孫故家不貴味能真率爾蔬醪自可人既向畫堂題剪韭更將玉斗出娛賓青青葉綰指環小白白頭攢乳琯勻還是相門風致在食前誰謂庾郎貧南坡書室圗為竺郎中題竺為朱文公外家南坡書室未能還一夕情生夢寐間職任握蘭居紫禁心隨畫筆到青山一經教子今何忝九世為儒古亦難家集河汾來學盛豈無房杜出朝班天香室為定水寺復見心長老賦宋楊誠齊與定水僧璘公有鄉里之好璘以桂作餉誠齊答以七言詩刻寺中雙峯桂樹今何似說道璘公有後身金粟如來能作主碧山學士願為鄰天香入䬲清可食秋露染花黃未句何惜一題方丈室與師同是豫章人送星翁甘碧泉挈家還彭澤縣睽離心事正忡忡執手何能别此翁葭菼戰秋江雨白鷓鴣啼曙嶺霞紅貪狼斗柄才加戍織女雲車又向東我憶陶潜舊鄉里到家休負菊花叢蛟門春色圗為㝎海王宣使題風景蛟門春更佳晴來滿海是雲霞鯤鯨已入任公釣波浪長隨漢使槎天上星辰歸畫省人間歲月屬桃花仙人自有雙鳬舄弱水蓬萊路未賖暘谷軒為王知事賦地入青徐眺望賖雲中雞犬有人家金烏五夜出賜谷王燭萬鄉始可憐家食舊非鄰院米藥資今受施僧錢數間破屋叢書裏誰問洛城盧玉川問牛軒為海昌北寺訥無言書記賦犀牛不逐扇俱破奈有人來問此軒資福無端添注腳石霜何事未忘言大千無跡身俱化一㸃通明角尚存拈起家風隨手應莫言無可付兒孫春草堂為陳生賦可教逰子不關心白髮髙堂日已深憂對冝男雖可忘情同烏鳥若為禁詩書飬志勤三省甘㫖承顔抵萬金報答春暉憐寸草孟郊詩句不堪吟蓬萊道院雲近蓬萊蜃氣消數峯晴照遠相招梁間燕子都歸去觀裏桃花自寂寥盂飯化人忘戀戀院牆篁竹謾蕭蕭雲中何處劉安宅猶有雞聲報午朝演法師惠𥿄帳銀燈夜照白紛紛四面光搖白縠文隔枕不聞巫峽雨繞床唯走剡溪雲風和栁絮何因到月與梅花竟莫分塞北江南風景别却思氈帳舊從軍題天鏡方丈為能仁淨秋江長老賦大宗大派接秋江䂡拄中流露法幢照世萬緣俱是妄行天一鏡逈無雙當家誰道非臨濟說法還須在老龎驀地繞床三振錫更無言句兩心降寄東山寺長老宅區中索畫梅同是多生無垢身孤芳歲晏轉精神濡毫應覺香先到寫影無如月最真庾嶺近來還有信花光以後更何人情知此事難描畫驛使空回何不嗔冬青軒為天印上人賦冬青樹老法王家得與維摩共歲華枝上蠟封經夏雪街前雨積過春花詞人有興從題壁童子何知但煮茶不下禪床迎送拙大千同是一袈裟寄題松風海月方丈為普慈寺林清逺賦普慈寺主㑹當年畫雀雙鳴赴法筵風過忽開松上雨月行不離海中天三生身性何嘗改一念聲聞總是緣先輩往還成故事玉圍曽解寺門前集雲軒妙嚴院主斷聲聞密室圓光覆樹雲牀下虎心俱化善階前鳥跡自成文池窺片月遺空相樹接諸天散異芬傳誦六時行道處至今軒户集氤氲題寶林方丈留别伯舉法師金相浮啚千級開雜花如雨在莓苔要看彈指成樓閣未許胡僧話劫灰法器即如廊廟具寶林自是棟梁材雖然一片袈裟地不是兒孫不可來西疇為陳生賦負郭有田何所憂每年春事在西疇耕回收犢繫墻角客至呼雞下樹頭織女河邉祈杼柚天田星下祝謳窶豳風七月詩歌罷土鼓窪尊樂未休寄報國寺東堂止庵祥尊師覓船直欲橫塘去船去橫塘為訪誰白首正慙玄度老碧雲曽與惠休期山林此日多髙七風雨連床可論詩入杜既能容載酒陶潛無復更攢眉玉岑舊隱為林叔平賦齊館枵然題玉岑老生時作越人吟曰妻曰子留他土維梓維桑念故林豈謂青雲天上逺謾憐白髮鏡中深古來儒士多遺憾為此文章竟陸沈古村為曺迪賦宋曹利用之後人魏國南來有子孫至今人物古而村松根曲處安琴枕山石窪中注酒尊汲冡文章餘竹簡秦人風俗尚桃源海波不接天河水要得仙槎􅏙造門思雲圗為羅從事題抽毫遽爾賦思雲為感羅含以孝聞聀任紫垣親不逮粟支紅腐祿無分終身有慕誰非子此日移忠正在君郎署丹青稱髙步須求名筆記斯文贈寫神朱大年筆頭何在覓人知鏡裏相看不自疑麟閣盡能啚燕頷龍沙誰復恨蛾眉千年名姓毛延壽一代丹青顧愷之夢感九重終見召藝精寧患不逄時送别唐克讓還家家山逺在白雲邉膝下相違又隔年萬里壯逰司馬氏數函書畫米家船裁成綵服歡無已遺却瑶華思惘然海內故人零落盡别離都付酒樽前寄表兄蕭文素處士七十餘年親弟兄書來堪喜復堪驚杯中酩酊無虛日枕上邯鄲過此生老至音書冝有數别來骨肉若為情遭逄洪武開新運又十三年見太平克讓許寄酒詩以趣之春至遣懷唯恃酒莫教花發酒來遲文章每與年俱進世事還于老始知海嶽幾回吟雪夢涔陽有約採蘭期古音最愛朱絃曲彈向髙堂念别離月軒為張令賦思親對月清宵坐了却公家事可知白髮已無重見日清光還有再圎時葉間零落皆成泪窗外栖烏總是悲大孝終身俱有慕不辭為賦蓼莪詩寄湯水嚴仲原處士情忝姻家亦是緣人來無不問湯泉間常採菊東籬下每望長安西日邉素業魚鹽滄海上綵衣孫子畫堂前髙車况是京畿內受用髙年五福全孝友堂為姚氏彥名彥昌昆弟賦兩生孝友誰不知左轄題堂固所冝豈獨聲名從此大要交風俗與之移棣華燁燁照春日烏鳥啞啞啼樹枝林植羽棲俱有感過門賓客可無詩瀼東耕者為杜師黃成章賦鹿門不道似烏溪榆栁連隂覆大堤常日墟船潮上下每年春事瀼東西勸農隨例拜車馬觀稼依稀從杖藜牛角掛書吾道在古來力食盡男兒寄王元吉楊東叟二處士華亭猶有古人存風景依稀似鹿門一曲晴湖通畫舫萬株古木出烏林卜鄰王翰俱文物識字楊雄足酒尊有約重來訪東叟微歌同樂最間園席帽山人所居寶古齊曹招寶古以名齊韞櫝非時不一開啚畫丹青半人物尊􅉓文藻盡雲雷流傳竟自何人淂玩賞知經幾手來世故浮雲眼前事題詩投筆為興懷雙桂堂為俞子成賦雙桂團欒對兩楹碧雲無數共生成郤生片玉曽馳譽竇氏五枝俱向榮奕葉至今傳世澤靈根既老際文明㑹須滿䄂天香裏載酒髙堂說姓名送廖思誠知安肅縣新恩領縣之安肅便道寧家孝使然親舍戀深雲白白官程期速馬翩翩人民社稷上所倚期㑹簿書勤是先政考有成俱大用到官知爾又春前聽泉軒為龍井智法師賦山僧聽得泉聲好每夜坐忘清夜深松上落來驚鶴夢潭中㵼下雜龍吟觀心已淨平生垢到耳能空見在心此去㳙流如不息沛然誰禦海鯨音聽律令鄉飲回贈劉復齊馬弘道晚步河橋念此身餘生猶幸齒編民府城無跡非為賤松菊猶存未是貧官府才聽新降律酒罏先問有錢人衢歌仰詠唐虞化鄉飲俱前老縉紳梅竹軒古梅修竹兩相親坐對髙堂如大賓空谷有人憐翠䄂雒陽無夢染緇塵歲寒清白能同趣日莫平安是此身三友若能同此隱門前楊栁任芳春晚步西河畔㑹葉舜臣自運司中出武林耆舊似公稀未覺文章與世違莭序去人驚逝水樹隂當面轉斜暉群鷗晚戲呈天趣孤鶴宵鳴自道機早作餘寒冝晏出謂言多露濕荷衣悼孔英夫提舉孔子之五十五代孫老泪何堪哭寢門斯人况復是斯文六經政爾傳家集曲阜蒼然掩暮雲欎欎澗松看得地昻昻野鶴又離羣賢郎無忝家聲舊能以文章繼世芬修淨慈寺成賀簡以道長老古佛毗耶願海深萬間彈指變黃金分明兜率諸天境慶贊閻浮施主心堂上鼓鐘聲大地域中龍象盡知音自應雪夜傳衣處不獨神光在少林送沈敬止赴胄監老我頽然厭世紛喜看賢者步青雲事君如得行其志出對還當罄所聞列宿九霄餘氣象靈芝五采絢人文滿朝侍從皆英俊始是文章可䇿勳鄭竹隱處士墓上作何慙南渡舊名臣奕世居然保縉紳五福備身冝爾夀一經教子異他人蛟螭負屭碑文右松柏隂森墓道深彈指浮雲今古事幾家荒草卧麒麟宋髙宗御題李唐畫唐香山九老二律詩兩疏誰是見機還終始君臣似此難宸翰昭回雲漢上衣冠倣佛畫圖間當時諸老琴樽㑹盡是同朝鴛鷺班風采拜辭雲陛下白雲千載在香山中秋望月甲辰年賦月裏分明見九州浮雲西北是璚樓歌鐘未厭今宵酒砧杵那禁此夜愁若使有情須痛哭不知何物是風流霓裳不向當時罷戎馬中原未肯休學舟為崔檢校賦髯崔家寓市河頭齊館臨河題學舟不謂乘桴浮大海應期擊楫誓中流風波浮世何能濟駟馬髙車更有憂可是外郎居騎省却將魂夢記滄州題燕山萬里圗為江左葛元毳編修子賦翰林藁葬古幽州萬里逰魂土一丘父子有情終是苦丹青得趣豈知愁風沙日日黃龍塞雨雪年年青海頭狐死首丘誰不念莫將遺憾在遐陬送單尚致仕還鄉風塵澒洞識龍顔便解兵符拜諌間天上已扶真主出榻前尚乞故鄉還黃金優老車增重紫禁朝天夢可間世受淮田知所賜幾人得似單家山題國清寺三隱堂豐干寒山拾得莫與間人說舊逰這些風彩儘風流只因當日機曽露直到而今笑未休虎跡已無空院閉藤花猶蓋兩岩幽相逄總是知音者莫呌蒼天惱趙州明岩寺疊嶂重岩出半天芙蓉幽洞下相連浮雲富貴二三子放浪人天五百年飯後松風為伴侣春來花鳥作因緣村堂野壁俱題遍句句天機合自然寒岩寺寒山隱身處一片浮雲去不還龍吟虎嘯出人間豐干往日成饒舌太守當時亦厚顔秋至候蟲還唧唧春來鳴鳥自關關烟蘿古洞依然在要問寒山即此山送郭子程湖州收父骨還廬陵事親盡禮誰非孝豈願遭逄世道難千里風塵音間隔十年父子夢魂間首丘自負終天痛函骨寧期此日還地下老翁應自慰免將遺憾在他山同謝别駕過殿山湖登普光寺閣次壁間馬郎中詩韻浮雲終日作輕隂寺下龍潭百丈深古刻尚存邢女記好詩今與謝公吟風行澱水搖深碧雨過松花落細金怕見南湖春草色每來髙閣倦登臨陪月中丞訪寶林寺别峯尊師有詩因次其韻傳呼載道不知遙驄馬乘秋氣益驕佛運已知當末劫寺碑猶及見前朝升堂鐘鼓聞三界聽法魚龍趂兩潮不有斯文為世重東坡何以慕參寥客至潦倒無能困不才樂然笑口有時開呼猿洞口採藥到浴鵠灣頭載酒廽對客且容談玉麈題詩何必寄銀臺甕中聽取春漿熟便買魲魚煮四鰓題東臯隱居為范思賢賦海水桑田幾變遷桃花依舊郡城邉𬞞園百畒充官稅藥價一生供酒錢詩句興來題彩筆道心悟後付朱絃院曹誰信同僚後談笑交逰十五年留題天台香積寺為鄉僧印秋海賦花界追尋一榻涼破除煩惱是禪房慢揮大扇消長日共倒深杯說故鄉萬事到頭成畫虎百年束手共忘羊明朝馬首勞瞻望此别人間更渺茫歸來堂詩為雲間青龍鎮章吉甫太守題時年七旬使君致仕歸來日九十慈親猶在堂秋水鱸魚朝入饌薰風紈扇晚生凉孝廉早已稱髙士名德今冝重一鄉花底杦輿喧笑語白鬚風動彩衣裳送雋侍者還永樂寺寄闡大猷尊師記乘官舫過明州永樂寺中曽一遊繞􅏙凉雲修竹曉滿池香露小荷秋松花酒貯山瓶送雀舌茶煩蒻籠收宋雋到家煩問訊舊題還刻在詩棲黃岡寺贈朱質夫貢尚書門生尚書賔客唯豫在門下諸生獨爾存終有黃鐘求賈鐸肯于清廟少牲尊茶瓜留客岡頭寺風雨題詩海上村莫問幾時回馬首也須迎候出衡門環隱有序龍翔宫實宋理宗潜邸有十齊環隱其一也後賜為道館髙士毛起宗居環隱就以自號瞻仰畫像賦詩一首大化循環不可窮至哉樞始得環中􅃮園化蝶有今日柱史猶龍非此翁齊館前朝存舊制丹青遺像仰髙風百年文獻凋零盡川上空嗟逝水東夢梅花處帳底梅花覺有香不由鐡石作肝腸宫粧何處紅綃女春色誰家白玉堂枕上翠禽栖正穩夢中胡蝶引須長城樓畫角復吹覺任有文章惱宋郎看劔亭為曺將軍賦此劔名家已數傳為曽與國淨風烟聞雞起舞非今日對酒間看憶􅉨年三尺神光遺電影一函寶氣閟星躔章江日夜東流去亭下題詩重惘然𥿄𬒳閒眠受用剡藤香不比行雲惱宋郎月裏楊花終夜落雲中蝴蝶過春狂象床繡枕知難稱道館僧房或可當還是夢中風景别東華塵土久相忘贈醫士潘氏中和齊心天一氣貫中和孺子膏肓若我何內景金花今證道上池玉液不生波獻方龍每乘雲至收杏人曽侍虎䭾十世醫傳方脉在門前無奈杏花多寄謝伯昭伯理二昆仲話别南堂二十年江湖魚鴈兩茫然車書叱日同天下濠泗而今是日邉架上遺書宜教子老來樂事是歸田謝家子姪應相念每到池塘憶惠連過林和靜墓西湖隱士林和靜兩句梅詩直到今此事豈容同末俗當時還亦有知音髙車大斾知何往剩水殘山尚可吟三尺孤墳埋宿莾過君誰不願抽簮尚絅齊為洞霄郎可道賦衣錦能懷尚絅心暗然師道重山林玉因韞櫝知無價琴到希聲是大音蝶化夢魂髙枕後鶴鳴秋水萬山深青苔黃葉空岩畔俗駕何由得一尋瓊花幾枝雪艷向風斜未許吹香上鬢鴉誰取根來廣陵郡却留春在后皇家懿公滅衛雖云鶴煬帝亡隋豈獨花自是錦帆迷故國恨連芳草滿天涯寄題清暉樓謝公履迹遍岩扉似覺髙情與世違昔日文章歸麗句至今山水發清暉神仙滅跡虛金露塵俗何緣别翠微尚憶詠詩同水部山林有待薜蘿衣寄梁太醫髯翁邂逅海西邉風采何曽異往年談客過門從取醉貧家問疾不論錢送方龍每乘雲去種杏人曽見虎眠此寺希竒何足怪古來醫術盡通仙移居夀安里二仙巷移居所藉應官期奈此黃梅五月時墻竹翻風搖鳯翥堂萱臥雨帶羅披夏隂正盛衣還濕日晷無移事可知此景自憐張仲蔚蓬蒿三􅏙共栖遲王敬仲知府自臨江回九鼎勳勞一羽輕幾何歲月漢河清吕生覺後唯空枕丁令歸來有故城宛馬老懷沙苑闊賓鴻春憶塞雲平天恩既許投間後莫向除書問姓名鄞孟文經歷留别詩次韻總是邯鄲夢裏身區區鞍馬九衢塵賢才俱進唯新命幕府從交舊日人天上星辰光覺近寒岩松柏色還新從來氣候關時事鴻鴈來賓已過春又暮府深居得所親好看車馬動行塵身歸絳縣將遺老詩忝河梁别故人行李往來誰不舊疏林折贈意能新都城路有襄陵使欲托微波寄洛神夢梅花處丹青庭院欲黃昏蝴蝶􅕋蘧化夢魂姑射肌膚如處子兒家消息在重門香熏繍𬒳過殘臘影落畫䦨連大尊可是玉川無覔處思前春色勝張琨秋水軒鏡水當軒景最新翔鷗棲鷺總比鄰風驚幃箔螢流扇露濕闌干月近人深院暑收聞搗帛前溪波小見垂綸莫言蕭瑟秋光裏還見文章賦楚臣次韻慈利縣王孝亷過洞庭思親之作洞庭波浪接青天渺渺帆檣上計船萬里客程何日盡一宵江月向人圓橋題駟馬名先至風遇鴻毛勢沛然之子澧蘭歌最好有人雲夢澤南邉次韻奉天門早朝千官趍謁武樓間盡是洪鐘帝鑄顔咫尺天威臨御座太平風景出朝班握蘭鳯閣舍人貴視草鑾坡學士間騎馬共談雙闕下祈將萬夀祝南山次韻偶成雜然異味出賓盤老覺尊前更有歡清夜可人歌板倦小樓細雨燭花寒狂情肯為諸公吝酒量方知到處寬醉後玉山從倒却試將時果擲潘安又程家兄弟合親情霽月風光滿座生樂事笙簫相問發酒懷江海欲同傾自憐緑鬢朱顔改尚覺千金一笑輕夜半酒醒孤枕上不將歸思憶江城梅鶴軒梅福髙軒得所親皎然潔白離風塵九臯唳徹雲間聽萬玉香先天下春門外自應回俗駕尊前猶得伴吟身緑隂忩户研朱者莫是清溪㸃易人讀府教授徐大章為岐陽王客白以中賦西塘八景詠夜卧有懷不寐若使蔡雍今日讀應題八字刻西塘大音如奏古琴瑟衆羽不瞻孤鳯凰百世可傳惟𫐠作一辭難措是文章老夫為此喜無寐臥誦不知秋夜長壬戌朔旦試筆斯文天與樂餘年中有黃金耴酒錢絳老又添新甲子王家唯守舊青氈將春梅蘂茱萸小過雪萱芽翡翠鮮賔客到門無别話履端相慶畫堂前題梧桐宫六逸堂龍化青林水滿溪昔人曽此寄幽棲髙情不負杯中物爛醉何妨日似泥富貴到頭蕉下鹿光隂過眼甕巾雞當時不盡風流興付與山鶯儘意啼題夢蕉軒道人內視已超然一息薰香遍大千駭鹿始知身是夢覆蕉曽悟佛中禪袈裟萬朵天花裏世界千重梵網邉重見毗那峯頂上手開樓閣說因緣姑蘇懷舊十里湖堤踏暖塵老懷忽憶故鄉春泥金孔雀裁歌扇刻玉麒麟壓舞䄄翠䄂錦筝邀上客畫船銀燭照歸人而今白髮東風裏疑是前身與後身題諸葛孔明身為中山漢子孫西南别立舊乾坤君材十倍曹丕上位列三分蜀相尊布陳有啚靈尚在出師遺表恨猶存休將巾幗羞司馬五大原頭日已昏題嚴子陵赤啚神運復炎劉白水真人憶舊逰一代位尊眠鳯榻千年名重著羊裘山林孰謂無伊尹廊廟何曽棄許由惟有冨春山下月清光常繞石灘流題張天爵父通守公張矦之墓平生好友念張矦紫峽雲深墓木稠赤紱既能承世澤黃金更用為孫謀衣冠南郡成前輩風月西湖總舊逰過此豈勝存殁感解鞍一奠古墳頭附伏承員外先生奉楊公之命函香浦陀洛迦山瑞相示現使莭今還輒成長律四章少寓餞忱南陽乃賢上瀛洲東望海茫茫紫竹林中殿閣􅋽夜半潮來紅日上巖頭雨過白花香褰裳珮玦聮珠網束髻冠纓涌寶光大士神通天廣博盡將願力固封彊江左長城有鐡星赤心憂國禱滄溟經翻海藏函尤濕兵洗天河刃不腥屢出賜金分將帥終圖全璧奉朝廷幕中司馬才無敵執筆磨崖蚤勒銘北史楊津鎮定州威望赫然軍中謡曰不怕利槊堅城但怕楊公鐡星天上張公玉雪妡競傳官府有神仙功名早建平南䇿詩句今隨過海船夜汲澄潭瓶貯月曉登磐石珮凌烟知君喜得禎祥兆一目髙懸古樹邉宋史弥逺禱海上見一目掛樹邉後果拜相狎鷗亭上望吳山春水無邉壓畫欄一樹飛花羅幕靜滿湖明月玉簫寒往時亰國交逰舊今日江城執馭難後夜西湘鳴鴈過好將書信寄平安
