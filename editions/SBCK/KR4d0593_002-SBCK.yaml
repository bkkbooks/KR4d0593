front:
  text: 張光弼詩集卷之二
  hash: sha256:2eaea0c55d98db1727cc63f23017320b2e25f85c3815d84f3d57948dfc292fba
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_002-1a}
body:
  text: 古風七言河漢篇河漢亘天㡬萬里鶉火西行入箕尾金􅂔浮空􅃞白波任是雄風吹不起一河之水皆空青徃還唯此烏鵲翎太史不識漢使者却奏張騫為客星載回織女支機石牽牛隔河来不及二十八宿有常􅀴七夕胡能㑹靈匹西牛東女長相望女則織絍牛服箱人間兒女謾愁思河影不滅秋夜長唐太宗駿馬圖昭陵石刻今無有絹素乃能存不朽當時竒骨濟時艱駕馭盡入天人手隋家􅂯世俱凡庸不知肘腋生英雄晋陽􅁬起六駿馬蹴踏人海波濤紅帝王一出萬􅀖定干戈四􅃌羣小空凌烟勲臣盡圖􅀞一旦肯遺汗血功嗚呼何從得此様䂓模却與石刻同乃知帝王􅀁駿乃龍種豈可求之凡馬中唐家開基三百載展卷尚􅁴来英風張建封撃毬圖唐家風流尚毬馬中外靡然為之化徐州莭度張建封坐領東藩示閑暇長簫短吹行相随以此慢逰為日夜玉山滿馬扶醉歸正及樓頭望春罷孔雀屏帷次苐開黄金買得春無價不教白日向西馳只許黄河向東㵼使君死後誰登臨燕子不来風雨深緑珠甘守􅃢瑚􅀣文君獨宿鴛鴦衾當其意氣傾朝野肯信人無百年者萬言猶在從事書一幅空遺後人􅀞五王行春圖開元天子逹四聪羽旌管籥行相從當時從駕驪山者宰相猶是璟與崇華蕚樓中雲氣裏兄弟同眠復同起玉環一旦入深宫大枕長衾冷如水興慶池頭花􅀣􅁁梨園小部俱婵娟楊家姊妹夜㳺䖏銀燭萬條生紫烟寧知樂極哀方始羯鼓未終鼙鼓起褒斜西幸雨霖鈴囬首長安㡬千里贈河南衛畢􅀅軍􅁔壮哉􅀅軍八尺軀陣前奪􅀐生馬駒有力每􅁿弓兩石㩀鞍手横丈二殳小敵如怯大敵勇生平氣與忠義俱逢時受命從大􅀅執合風雲興海隅奉辭東下尉陀國囬兵北撃無单于望風襁􅀒至者衆􅀅軍為駐南征車歸来九重賜顔色蹈舞恩光生步趋團花􅀾􅂁出内府大官羊膳来公厨洛陽􅀜東古重鎮授以斧􅃏專城居緑槐髙暎使者莭黄金新鑄兵家符握手􅀒㸔走壮士擁盖吹笳喧道塗盡知勲名在忠義千􅀐萬􅀐先傳呼祈連亦有霍去病細栁豈無周亞夫只今􅀅軍與之並人馬相輝古迹無君㤙廣大法天地􅀅軍報荅􅀅何如丹青或接萬億載忠義莫虞無􅀞圖送程希道回河南銀鞍白馬􅀰自是平䑓客海木桒田不自知朅来二紀異南北他郷忽然頋我􅀏有如清風洒蘭雪開心冩意慰離居别時童孺今有􅂡知從馬援在軍旅不謂陳琳工􅊾書我扵程家最知舊大宅􅁱椽曽置酒玉攅紫笙吹鳯凰羅䄂春衫舞楊栁因之感念二紀前躍馬射麛江水􅁁煌煌賔從散秋葉疊疊樓䑓成野􅃄程生程生既㑹面􅂼麻瑶華莫持贈但存此日㑹面情地北天南有相見丈夫有志豈陸沉使者不惮巖穴深他時或有公車召嗣我雲間金玉音贈製筆生許文珤許生精藝誰可及材用剛柔以製筆水盆洗出紫兎毫便􅁴文章生羽翼䝉恬􅀅軍為動色為是秦王舊時物丞相斯曽從駕行載此􅂐書封禅碣從秦至今㡬千載兎尚存皮竹可採利濟天下功不有入手千人萬人愛我昔為􅀰居粉署用筆唯扵許生取􅁿衫日對紫􅅔花冩遍江淹夢中句夢雲樓為佑聖道士王景舟賦阿母妊娠曽夢雲道人見雲如母存髙天悠悠不可聞虎豹守􅀜深九門丹青樓舘雲中起翠幙銀屏接雲氣縹緲時聞子晋笙蹉跎日集王喬􅂂蟠桃千年花又開雲中不見阿母廻丁令白鶴有􅂯至漢宫青鳥無復来但願無風亦無雨桃花開遍夢雲䖏花􅂔騰空結紫雲㧞宅乗雲上昇去玉局生引龍翔住持毛起宗􅂙随鶴駕謁九重冲虚教主器許之名以玉局髙其風贈言五十有六字盡説大羅天上事老君出現成都時地神湧局亦如此空􅁔􅀺羅還上清􅂯三祝付玉局生吾徒􅀍服老君教母忝玉局之所名名非可名局非局心田種熟藍田玉入水不濡火不焚一氣孔神無㫁續况聞古有毛仙翁是身雖異性則同華表白鶴猶未歸凾􅀜青牛今則逢道家宫植連雲起日食仙曹千萬指誰其主者玉局生宴坐無為􅀚太始白翎雀􅁔烏桓城下白翎雀雄鳴雌隨求飲啄有時扶起天上飛告訴生來毛羽弱西河伶人火倪赤能以絲聲代禽臆象牙指撥十三絃宛轉繁音哀且急女真䖏子舞進觴團衫鞶􅅁分兩傍玉纎羅䄂柘枝體要與雀聲相頡頏朝弹暮弹白翎雀貴人聴之以為樂變化春光指頋間萬蘂千花動絃索只今蕭條河水􅁁宫庭毁盡沙依然傷哉不聞白翎雀但見落日生寒烟捕虎行碧油幢下曹司兵見義有勇身為􅁿平生每得貴人喜有似花卿知姓名一朝共聴􅀅軍令鎮市臨平虎尤甚汝司其兵徃捕之食肉􅃦皮湏要盡司兵受令即出城怒􅂔填膺風火生揚言大明聖人既御世爾虎何物猶縱横大刀長㦸屯村堡前期釘牌為㫁道村堡喜得司兵来萬夫鼓勇千夫譟半月捕􅀗十三枚大檻小車推載囬自言此乃􅀅軍令是豈小人之力哉􅀅軍索酒指其虎此虎不死司兵死在官食禄忘其軀亦是人間好男子資夀堂為之醫藥以資壽古人存心子能有治生􅀂然天必與衣禄何憂不豊厚潘彛世籍富豪家金珠斗量錢載車百年風雨換門户甘守儉薄為生涯法依本草為炮削􅁱合肯教違矩矱日月回旋碾上輪虎龍交媾爐中藥服之一劑神􅂔全百齡夀等金石堅洪範五福壽居首有金無壽真徒然彛也性禀芝蘭秀湖海香名喧衆口修文坊南當大街如斗之字出髙牌貴人長者共祗重每日門前鞍馬来望雲詩為翼城常盤賦風吹白雲天上来㳺子望雲心眼開小時見雲在親側安淂親同雲徃回世家翼城桐葉里雲自徃回親在彼昔年捧檄為榮親淂官拜親雲亦喜􅀁憐得禄逺莫分委質為臣命在君青􅂁駿奔各有事斑衣児啼更勿云我知爾家廣田宅小弟朝朝縱圍獵暮歸雉兎滿馬鞍不使髙堂甘㫖缺望中有使頻􅀉書夫人堂上泣羅􅃭願尔長辭楊震金願尔長懸羊續魚親之念子無不至子思其親雲即是紅顔早受縣君封莫計同飡太倉米桐葉之里非一家如尔兄弟誰不誇墙頭風吹紫荆􅀣堂前露浥萱草花莫言親逺翼城縣萬里􅀜河如對面一官九考今八年指日雲中又相見雲林􅁔李侯雲林心􅀁仰既見雲林副心賞欣然為我出圖􅀞索我題詩􅀞圖上我自别侯二紀餘不得半􅁓廬江書乃知已膺廟堂聘梁棟之材寕不如雲林乃是􅀂􅀁植雨露蟠根同鉄石直􅆬慿凌御火霜青雲照耀􅀰官茟即今英發當盛年上林玉􅀣幕府蓮東閣梅花時自詠南郡官曹誰更賢從知侯家積隂徳鳯雛七枚毛五色覧輝已出丹穴中来儀㝎集虞廷側安棲不用求梧桐雲林氣接扶桒紅結巢日􅁁長羽翼好音惠我􅀟飛鴻玉簫引為沈仲徳賦洞簫宫前有狂客􅀟眼直嫌天地窄甕中釀熟葡萄􅄴飬得身輕好顔色興来為我吹玉簫縹緲一聲生泬寥驚鸞跱鵠不自㝎㳺絲落絮随風飄髙情逺思逰碧海此豈肯受王門招咲言學簫二十載家業凋零心不悔要湏吹上鳯凰􅄗白日羽儀生五彩王無偽仙翁見訪為賦此詩神仙之術本無作當面無縁尋不著但能寡欲自長年愚者昧之求海嶽此術不許凢俗知道成由来非大藥仙翁髙風何所喻天垣月暎王喬鶴等閑瓦礫變黄金候尔相從步寥廓􅀉河南衛鎮撫趙克家叙舊程生河南来始得河南信雨散雲飛二十年萍蹤梗跡今􅅻㝎却思小􅀌洲渚􅁁大江大浪拍􅀾船􅀅軍􅂡髯劲如㦸白日酣􅁔便醉眠我從别来賛􅀞省夫容幕與風塵逺洪武􅀄年自日􅁁詔許還家老貧賤池舘盡付當時人唯存筆硯伴閑身劉伶斗内蒲萄酒西子湖頭楊栁春見人斵輪只䄂手聴人論天只箝口年過七十􅄠未斑路途不辭牛馬走知尔出鎮在洛陽宫􅂁徤馬日煌煌前􅀐大旗􅀞熊虎後􅀐長㦸横雪霜我扵此亊别已久冨貴浮雲更何有鴻鴈得便時附書但問老人平安否題醉墨堂為桐江俞子中賦世稱草聖唯張旭氣主神光從所欲醉来提筆走風雷電掣長雲夜相逐徤扵大野􅀾蛟龍媚似􅁿波浴鴻鵠由唐至今㡬百年筆法竟尔失其傳芝翁乃􅀂神所授亦以醉墨題堂前晴絲􅇢空王逸老生蛇絆􅀣黄庭堅筆法不必問髙閑法不必詢懷素縱横遲疾心自知曽見公孫大娘舞雲門山房為青州曹伯起賦雲門山房何所指知尔不忘桑梓意山在城南百里間沃衍膏腴宜􅀣中有一村俱姓曹列㦸髙門是郷里青州舊入齊封彊相國猶傳漢家世曹彬為宋下江南史冊能書共門地四世之祖在元􅀄遭際風雲致爵位赤􅂙丞相下豫章腰挿金符位元帥但知報國守忠貞不肯随人事軒輊用也綽有乃祖風一簣不止山可崇碧梧枝老自棲鳯緑竹根深湏化龍昔時未到山房裏每望雲門候佳氣却縁亦是豫章人客舎并州如有喜雲門之山青接天鴻􅄥既判知何年山房去天不咫尺名與雲門當共傳贈秋鳴善捧􅊾迎母往金蘭州就飬人子能不念其母嗚嗚啞啞猶返哺十月褱娠乳抱勞亦期仰事慰遲暮那知中道母子分南望親舎唯白雲伯也執殳在軍旅堂上消息空傳聞􅀅軍命許迎就飬拜捧檄文喜無量蘭州萬里到杭州母見子如堕天上􅂰間乍見歡復悲天河水流有合時宜男草是别時草老莱衣是别時衣只今四海車書一人間萬事真難必十年戎馬行陣間子母團圎有今日題湖州何生售書飬母詩卷衙散到家無與適領客壺觴以終日何生忽從湖州来當筵不語惟長揖古貌存心行孝道䄂出舊書三兩帙進言售此􅊀甘㫖有母行年􅀅八十吾聞此語為太息傷哉貧乎乏朝夕龍蛇蟄蔵天地閉宜尔之賢身不立莫􅀃家無田可耕縱有田耕那得食不如歸掉湖州船有魚可釣鳬可弋君不見賣刀與賣㦸朝持出門莫得直文章本是太平具以此干人復何益軍中或有錫􅁼人傾産酬書吾可必東圃詩為道士王景舟賦東圃軒在玄武宫海日欲上烟霏紅􅀂人飡之百體充飬得面貌如嬰童上清有法授有宗靈章祕呪存心􅅐一氣孔神天與通右衛白虎左青龍擲火萬里行老翁欲雨即雨風即風爕理造化代天上事親則孝事君忠神人執鞭湏相從題王朋梅界畫大都池舘圖様元朝人國􅀄以来好時莭冶緑妖紅盖阡陌樂㳺盡是勲貴家人閙馬嘶聴不得細􅃮䦨干輦子車同載女子如蕣花車中馬上目相許胡蝶夢滿東西家牡丹䑓畔夜如晝花照銀燈大扵斗正月飲到三月終樂地􅂬天古無有一朝花謝春復歸門鎖池園空緑苔簾前塵覆􅃢瑚􅀣案上蝶棲鸚鵡杯豪華盡逐東流徃百年丹青化草莾當時命酒徴􅁔人此日題詩圖􅀞上題畨使進呈三馬殿中得名􅀞畨馬筆力不在陳閎下方其畨使引進時詔許當軒對描冩近前一疋白鼻騧咫尺天威生懼怕苐二疋馬青連錢矯首嘶鳴意閑暇向後赭白馬最雄霧鬣風鬃勞握把三馬既出瀚海空天廐真龍此其亞􅀞師貌此良苦心􅆭淡精神入夷复冥􅄀雷雨晦大河漠漠風沙連鉅野諸畨服飾本華靡不獨丹青侈圖􅀞百年絹素霜雪新拂拭徒為發悲咤莫言世有真乗黄只此按圖誰識者天馬􅁔天暦間貢天馬来自茀􅀰國足下風雲生倐忽司天上奏失房星海􅁁産得蛟龍骨軒然卓立八尺髙衆馬俛首羞徒勞色應北方鍾水徳滿身日彩烏翎黒縱行不受羲和轡肯使王良馭輗軏黄絲絡頭両馬牽金􅌱􅀟垂玉作鞭寵榮日賜三品禄不比衛鶴空乗軒大國懐柔小國貢君王一顧􅁿為重學士前陳天馬歌詞人逺獻河清頌鑾旂属車相後先受之却之俱可傳普天率􅁟盡臣妾聖主同符千萬年贈楊彦臣使還宋楊通寅􅀕酒十四世孫元武岡緫管外孫使莭何煌煌􅀐從造我門自陳世有通家舊武岡太守之外孫佼哉舒侯賢宅相執禮愈恭辭愈降老夫已是􅐬􅀜人甚厭傳呼到閭巷湏㬰驚㝎還復悲挽生近床為抱持尔外大父強徤否此来殊慰我所思黔陽到浙七千里相問相㸔疑夢􅄰祥符年貶􅀕酒公安江之陽無乃是自從隔却蒼梧雲􅃗字片言無得聞車書既同四海一逄人每問舊􅂙軍立談知生具才羙金鍾大鏞莫與比池上曽聞咏鳯毛詩中又見􅁔麟趾當今聖徳乃海隅龍馬出圖􅀛􅀒書直言治安容賈􅁩喻蜀父老煩相如心存忠孝在年少縣官􅂆駕能應詔得時舉歩即青雲瑚璉從來在宗廟織錦詞行家織錦成染别牡丹花紅杏花白作􅀟紫燕對銜春一疋錦成過半月持来􅀞堂捲復開佳人細意為剪裁銀燈連夜照針指平明設宴章華䑓為君著衣舞垂手㸔得風光滿楊栁蝶使􅉕媒無㝎栖萬蕋千花動衣䄂回回舞罷換新衣新衣未􅒌錦下機憐新棄舊人􅀁悲百年歡樂唯片時贈趙希哲還河南仍􅀉其父太醫趙生㓜小辭郷里長成却自河南至風流籍甚芝蘭室文彩粲然瑚璉器懋遷不惮萬里遥魚塩歳逐啇人利杭州舊是繁華地輕薄相逢增意氣愛生不登酒家樓重生不逰花栁市秋風八月栁葉黄束装别我還洛陽樓船大㠶髙十丈順風一日到髙堂髙堂􅀟親應有喜寳貨既豊児亦至㝎呼斗酒出屏帷􅂰下相歡復相慰自来隂隲富人家廬山董奉非徒誇拜罷而翁煩問訊好種門前仙杏花蓮塘曲青蘋風起蓮塘水波聲夜聒鴛鴦睡一􅀧芳心不自持露荷又作􅛔珠碎藕絲織錦香滿機裁成衣裳􅀅遺誰只愁賤妾夢魂短不恨蕩子歸来遲花間鶗鴂依芳草等閑緑遍邯郸道還應憶念盪舟人滿架芙蓉鏡中老過􅁔風䑓世間快意寕有此亭長還郷作天子沛宫不樂復何為諸母父兄知舊事酒酣起舞和児􅁔眼中盡是漢山河韓彭受誅黥布戮且喜壮士今無多縱酒極歡留十日感慨傷懐涕沾臆萬乗旌旗不自尊魂魄猶為故郷惜從来樂極自生哀泗水東流不􅂯囬萬􅀊千秋誰不念古之帝王安在哉莓苔石刻今如許㡬度秋風㶚陵雨漢家社禝四百年荒臺猶是開基䖏讀易䖏為俞文輔賦易經四聖人之事㓗静精㣲惟此書夫子五十以學易尔今讀易年何如易之為書廣大而悉偹不以一言一事拘君子􅀚象玩辭䖏近取諸身而論諸按文責義而有得斯乃萬方之二隅履徳之基謙徳之柄復徳之本恒徳之固損徳之􅁱益徳之􅁉困徳之辨井徳之地巽徳之制扵此九卦能體騐可無大過為徳符讀易扵斯而自勉仰􅀚俯察非吾徒羲文周孔雖既􅃿天人其不在兹乎風木􅁔為禇本中賦并􅀉徐一䕫記禇孝子感風木􅀣猶如此親安在􅀊月去人何迅速陟岵陟屺望不及入室升堂成􅀫昔劬勞未報棄諸􅀌號泣旻天涕沾臆走獸聞之失其羣飛鳥聞之堕其翼物之感也有如此冝尔諸孤哀罔極始豊先生辭餘力文章今擅歐蘓茟記成不忍再三讀未及終天語嗚咽乃知人皆有父母天性油然非染習孝思不匱永錫􅁼草偃風移而俗易三復始豊記撃莭為太息往求二本之所在果然㧞地俱千尺孝子之父見手植造物扵斯有隂隲君不見東坡所記三槐堂魏公徳符在他日送馮以清知事赴成都右衛幕府李白苦􅁔行路難以喻世途之難有如是莫言難上扵青天時至青天是平地五等之爵國所司萬鍾之禄人所兾為臣忠實而不欺􅀞像式接咸可至石樓先生舊簮纓出宰三綬􅀰官貴即今任政成都幕萬事只應咨伯起葵藿常存向日心鯤鵬㑹展垂雲翅玉陛承恩咫尺天官船給驛八千里三峡盤渦轉殷雷萬壑啼􅆐響空翠相如擁􅀓喻蜀時縣官􅀒弩争趋避况尔旌旗出入間丈夫足展平生志讀杜拾遺百憂集行有感余生行年􅀅八十不知何者為憂戚冨貴不驕貧賤安以此存心度朝夕徃年承乏佐中書大官羊膳供堂食只今賜老作編氓衣食信天無固必陋巷簞瓢如素居不管茅茨春雨濕門前載酒求賦詩錦軸牙籖日堆積在官不置􅀒郭田既老翻得稽古力毀譽都忘月旦評姓名不上春秋筆朝米不煩隣僧送暮米不煩太倉糴我亦一飯不忘君文人相輕􅀁不及傷哉白首杜拾遺入蜀還秦劳轍迹文章盖世亦何為妻子相㸔百憂集西溪栁送人赴京西溪栁自是風流􅀣受用春風好媚嫵長條折盡還復生如何免得人来去千􅀣萬􅀣接郵亭到官五見楊栁青百年行路有離别三月飛花惟送迎知君母留彭澤縣門前五栁都㘽遍密葉能蔵返哺烏柔條不碍􅀟飛燕􅂰下長懷萬里心風光滿眼瞻上林請􅅅遺母應有賜咫尺龍墀恩露深題華光梅墨梅之作盛衡湘始作俑者惟華光此僧平生千萬􅁓茟力􅀁到花爲香是誰好亊憐清苦三二百年存絹素和靖多情縱有詩廣平得意還能賦東坡先生昔倅杭萬松嶺見一枝長我今見􅀞如昨夢都在君家白玉堂題劉松年􅀞張志和辭聘圖長安城中晨鼓響馬後紅塵髙十丈吴儂爲尔去烟波卧聴樵青閑盪槳醉来即唱滄浪􅁔平生志願今無多鷦鷯不巢上林􅀣鸒斯不啄玉山禾是身眇焉寓天地何殊太倉之稊米野人本乏濟時策孰爲要君徴不起所以漢光武不強嚴子陵放歸江湖從所志千年萬年呼客星聖人在位麟鳯在野洛既出圖河復出馬普天率土遂其生四靈咸集依至化唐尭垂拱而在上禹稷憂勤而在下當時天下􅀁不臣亦有臨流棄瓢者題三友圖劉文學如冠玉平生􅀁性在擇友友此梅花與松竹後凋莫問􅀊寒心眼中且得無塵俗頋兹欎欎在徂徠瞻彼猗猗在淇澳更有江南萬玉妃暗香吹遍湖山曲三友地逺莫致之􅀵拾畫圖歸一幅竹為君子松大夫梅則佳人在空谷從他坐客寒無氊只此可以伴幽獨君不見玄都􅀚裏千􅀣桃盡是人間閑草木貞婦詩諸暨縣有呉氏女十五嫁作蔡家婦十六生児夫即亡日抱呱呱為乳哺情知身是未亡人善事尊章猶父母盡抛粧具洗鉛華盡棄羅􅃭服荆布􅅾首􅁵居八十年􅀌子有孫孫作父采蘋采藻共祭祀嗃嗃家人無間語婦人言行止閨門懿徳何由出庭户憐哉弱孫蔡光祖再拜請求郷曲譽魯恭沼縣車馴雉劉昆作郡河渡虎承流宣化物為感况乃􅀚風行繍斧母今行年九十六人夀百年餘㡬許門前滄海變成田屋後白楊堪作柱寒鴉猶帯昭陽日銅人亦霑未央露古傳生女作門楣貞莭之褒誰不慕聖恩浩浩如江河母息厭厭迫朝暮早􅀅封事謁天閽為母一撃登聞皷送蔡孝亷回侍母暨陽有蔡宗盟府能以力耕亊其母懐橘之名早已傳分椹之心壮如故我嘗使驛至其家有花有栁當門户雖非郭㤗可榆栁且有茆容具鷄􅁰暨陽之邑隣上虞大舜遺風尚千古蔡乎蔡乎清川既東不在西白日過時不再午楊雄愛日著新訓甘㫖温清不厭斁人皆有母我獨無西望同安心更苦汝歸何以獻髙堂遺汝瑶華慰遲暮軍中樂送征南􅁺史張毅赴京我嘗軍中行從知軍中樂髙牙大纛啟征途風雲随護軍中幕千乗萬􅀐指頋間環而居之廼城郭五更觱篥吹一聲旄頭驚向天邉落捷書日夜報天子親筆􅃙書加寵渥刲羊宰牛餉壮士萬􅀊􅂬呼震天嶽大斾悠揚錦萬重從伶窈窕花千蕚男児堕地志四方􅅾矢桑弧為有託風順鴻毛易寥廓只今沿􅊾登大府鷙鳥之中瞻一鶚渭城且莫唱陽􅀜舉杯為賦軍中樂李龍眠􅀞飲中八仙􅁔龍眠白描誰不賞􅅐次含空生萬象茟下猶存小象文落􅁓烏絲㡬千丈小時讀􅁔心愈竒此日按圖神始壮浣花草堂老拾遺詠彼八仙􅀅自放天寳年来萬亊非得醉如逃三面網鳯鳥鳴岐縱徳輝麒麟見魯辭覊鞅丈夫骯髒迹每同孰謂龍眠成技痒眼中未見􅍦醒人未免開凾爲撫掌義株行廬陵江西古名郡四忠一莭之故郷豈唯英賢間世鍾造化亦有義株連理呈禎祥豊塘三山两株􅀣托生離立不数歩髙逕擎天一盖張深根走地羣蛟怒曽氏世居株􅀣􅁁詩禮傳家三百年尚書既爲連理詠丞相復入郡志編二公真跡今猶在文光照耀無年載李囦諸孫尚有傳桒田誰謂成滄海五世孫亦一老翁欲以此事徴盲聾豊塘之株母乃豐成劔變化偃蹇􅀟蛟龍不然安得保風雨專與三山為始終懐逺亭詩為東甌鎮撫譚濟翁作譚世􅞾之後宋史有傳譚􅀅軍勇而禮宋之端明學士七世孫早年身逐兵塵起鼻尖出火耳生風馬上飛塵虎添翅出門志願㝎逺侯果然持莭鎮東甌上宣徳意化海俗鯨鯢㓕迹波為􅀵古来鎮􅀅還如此緩帯􅁿裘接賢士襄陽沉却峴山碑水底魚龍猶識字國家承平千萬年軍中之樂何可言大牢五􅂦飡壮士從伶百戯陳廣筵山川不随人事改端明丘壠今猶在亭名懷逺乃在兹地下幽䰟有光采普天之下皆皇家故郷何必懐長沙人臣受命無逺近河源曽泛張騫槎食君之禄治軍旅咫尺轅門誰敢去私情丘壠豈不懷日夜沅湘水東注學仙曲二八女人貌婵娟杏花隂裏競秋千同心錦􅅁刺石蓮逄人學繋剪刀錢却妬鴛鴦沙上眠
