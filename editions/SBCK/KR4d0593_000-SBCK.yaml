body:
  text: 張光弼詩序廬陵張光弼先生少事虞文靖公集得詩法文靖才髙識廣其詩浩􅀶而不肆變化而不窮而一宿扵正先生之詩氣宇閎壯節制老成而從容雅則􅁛其傳焉張潞公翥最先知之而一時學者皆傾慕之其平生之作散亡多矣予近從給事中夏時得其五七言古近體一帙以授其外孫浮梁縣丞時昌俾刻之鄒孟氏有言誦其詩讀其書不知其人可乎先生名昱仕元至江浙行省負外􅀰嘗賛忠謨扵戎幕元末政壊遂棄官不仕張士誠㩀有浙西禮致之不屈而與周伯温楊亷夫交㳺相得號一咲居士我太祖皇帝混一天下訪求前元故臣之賢者嘗􅀍徴至京􅅧見温接已而憫其老曰可間矣厚賜遣㱕遂採天語更號可閒老人倘伴浙西湖山之間詩酒自適春秋七十有三而終噫觀其詩而考其出䖏可以知其為人焉正統元年夏四月既望榮禄大夫少傅兵部尚書兼華盖殿大學士同郡楊士竒序張光弼詩集序庚子之冬予始識張光弼于杭光弼廬陵人也蚤㳺湖海間以詩名嘗􅀒劍挟䇿從軍入幕府佐主帥􅀴􅀞籌畧以功累遷至杭省左右司貟外郎行樞宻院判官杭為山水勝地而光弼能詩善􅁔詠是時天下方用兵藩府􅀁在不一而光弼獨能周旋其間以詩酒自娯不侵官不怙􅀔以取撓敗故一時公卿大夫士咸􅁛之求詩者日走其門予時每數詣光弼光弼誦所作未嘗不為之撃莭然猶未能盡閲其編其後予去杭與光弼益逺丙辰之春予復至焉光弼手其詩二編過予寓舎且言曰吾平生􅀁作多矣今其藁皆不存獨此在巾衍中與吾周旋者殆二十年幸不失墜而得古律絶句凡若干篇而凡志意之所感發欣憂哀樂扵是乎在其可以自見于世者獨此而已子其為我序之予受而讀之愛其意婉而辭麗情閑而調逸有詩人之風不能去手者累日因切自念向之􅀁聞扵光弼者雖乆而未浃廼今始得其詳焉盖言者心之聲也時者事之㑹也時異則言異扵是有正變焉兵革之秋殆雅亡之日也光弼以詩人之才而遭時板蕩汩汩戎馬間其應酬交接盖無非衰世末俗之事雖欲正言而不可得故其辭多變使光弼當盛時一鳴則鏗鍧炳耀之辭自可匹休扵前人惜其遭逄不偶而其言止扵是也雖然杭之山水猶昔而光弼年未耄猶可肆其餘力扵詩矧今聖化之隆天下頌聲方作光弼雖在田野其能自已扵言者乎尚當􅁔詠太平而傳之無斁也洪武九年夏四月八日錢塘陳彦愽序
