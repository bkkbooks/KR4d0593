front:
  text: 張光弼詩集卷之六
  hash: sha256:d9744e89935c528813cbb32994535bf7c06c946212e5b0405b82a19696a506e8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_006-1a}
body:
  text: 七言律詩投贈潞國公承㫖學士張仲舉漢家舊徳有桓榮赤舄登朝羽翼成三晋鳯鳴千載㑹兩河龍見五雲迎獨扵社稷多艱日復使君臣大義明自念昔曽親几杖頌􅁔慙後魯諸生投上巾書右丞相履舄從容自九重相王忠孝更誰同千年帶礪猶初誓萬國臣鄰盡下風星貫紫垣朝佩劔月臨黄道夜傳弓漢家若論安劉策四皓難書苐一功五府驛代楊左丞留題後有楊維禎次韻免冑日趋丞相府觧鞍夜宿五侯家玉盃行酒聴春兩銀燭照人如晚霞受命敢忘軍旅事撫時又過掖垣花漢家未可輕韓信尚要生擒李左車東髪從戎十五年􅀾囬平地血成川英雄生世有如此忠孝報君當慨然俶擾弄兵俱赤子中興有道自皇天猖狂暫假姑蘓息繫􅖪終湏拜馬前湖山堂宴贈天使還亰畫旗風􅇆繡筵開竟日􅁔鐘樂未回栁拂玉鞍秋繫馬酒淹羅䄂􅋨傳盃杭城近自月前復使者適從天上来歸對大廷真得實眼中諸􅀅盡竒才岳鄂王墳上作朔雪炎風共此年中原父老亦堪憐竪儒屡遣祈求使大􅀅空持殺伐􅁠忠􅁩有碑書大莭奸邪無靣見重泉至今宰木猶南拱遺憾西陵是墓田陪宴相府得芍藥花有賦􅋨吐車茵愧不才馬前胡蝶趂花回玉瓶盛露扶春起錦帳圍燈照夜開垂白敢思溱洧贈欹紅還是廟廊栽楊州何遜空才思誰對髙寒詠閤梅退居湖上投贈楊左丞四首樓外湖光白􅄅茫樓中少婦試新粧行年􅀅近半百􅀊大醉豈能千萬場織繡舞裙飛蛱蝶白描􅁔扇睡鴛鴦垂楊滿院無人到芍藥花開日正長信馬蘓公堤上行水邉鷗鷺不曽驚春波滿眼湖光細花片飛来兩㸃輕天上碧雲如有詠樓中紅䄂謾多情牧之老去狂心歇總把風流付後生宿酒猶多睡未忺好風何䖏散香奩可教春日閑瑶瑟而使楊花撲繡􅄕削迹不煩三顧重息機􅀅廢六壬占今朝畫省無公事又得從容少避嫌且􅀚神女為行兩莫問􅀰官應列星芳草到門無俗駕好山終日在湖亭白鷗共戯荷葉小黄鳥亂啼楊栁青肯信曲欄干外立晚􅈵吹得酒都醒宴犒􅀅士酒酣命徤児舞劔為樂浙省平章泣下不禁感事有賦平陸龍蛇起殺機旄頭又自照金微兩階干羽知何似二典君臣豈盡非劍舞尊前囬夜電燭明帳下接晨輝可憐司馬江州淚濕盡團花舊􅀾衣陪宴後堂􅀚牡丹回有作風光偏惱掖垣人銀甕連車載酒頻寒食􅃄新萬家􅀣洛陽花擅一年春揀好任從天女散近前不嫌丞相嗔壓㡌紅香歸路晚幾多瞻望馬前塵至浦陀洛迦山寺作佛事七晝夜祈見海岸􅀚世音及善財岩七日之間随心應見大衆瞻仰無不慶讚丞相凾香致此誠願深海水救群生􅄌悲謂可消諸􅁖征伐容􅀅息大兵金色圓光開寳髻玉毫妙相珞珠瓔手巾示現楊枝露􅂅洗干戈作太平戊戍題海上作華表仙人舊姓丁羽毛今日惜飄零海巾又見􅅾莱淺門外空憐楊栁青暮雨朝雲翻覆手落花飛絮短長亭如何未熟黄粱飯説道英雄夢已醒楊忠愍公墓上作夢􅁴邯郸萬有空􅀖人猶自説英雄道家論􅀅忌三世臣子報君唯一忠淺􅁟何堪封馬鬛迷魂猶自恨秋風死綏固是􅀅軍事國史旂常盡雋功惆悵六首交逰蚤􅀊在幽燕費用黄金買少年􅆣下朝囬瞻馬首酒間俊發抱龍泉􅇵談寕頋日西落倒載不知天左旋惆悵近来􅅻觧事先生五栁種門前三山夢㫁綵雲空幾把長箋賦惱公畫閣小杯鸚鵡緑玉盤纎手荔枝紅春衫汗裛薔薇露夜帳香回茉莉風惆悵近来江海上却􅀅鞍馬學從戎畫船湖上載春行日日花香扇底生蘓小樓前㸔洗馬水仙祠畔坐聞鸎碧桃紅杏渾相識紫燕黄􅉕俱有情惆悵繁華成逝水盡歸江海作潮聲惆悵當年使酒来娼樓紅粉夜相催可憐明月二分在不見璚花半朶開誰復醉翁堂下栁更堪從事閤中梅楊州一片青青草誰信春来無鴈回惆悵雄藩海上逰武昌佳氣接神州東風歸思王孫草北渚愁生帝子洲椘國江山真可惜劉家豚犬亦何羞不湏更問中原事官栁新栽過㦸樓至今惆悵在東城結伴㸔花取次行輦道駐車招飲妓宫􅉹囬馬聴流鸎星河織女從離别海水􅅾莱見淺清不有酒船三萬斛此生懐抱向誰傾過楊忠愍公軍府留題縂是田家門下客誰扵軍府若為情林花滿􅀣鸎都散雨水平池草自生街上相逄驚故吏馬前迎拜泣殘兵能言樓上題詩䖏猶有􅀅軍舊姓名睡􅁴滿院楊花風力􅁿牡丹時月好晴明􅄕垂不知白日晚睡􅁴忽聞黄鳥鳴萬斛春光金盞酒百年心事玉人筝劉伶未到忘形䖏枉自閑􅀅畚鍤行湖亭納涼奈尔湖光月色何不知此境為誰多忽驚墜露翻荷葉想見微風生水波炎景只消清夜飲老懐都付小鬟􅁔家中未必凉如此且待樓西轉絳河燈前有賦雨夜湖樓錦帳垂有人為尔故眠遅春衫照影㸔教舞寳合熏􅃄學畫眉何䖏絶纓憐椘客為誰掩􅃑泣樊􅁎思量暗室無窮事留到天明不忍欺湖船􅂆曺徳照僉院酒倩得名􅁎唱慢􅁔梁塵直欲下􅁿波西風八月芰荷老落日滿湖鳧鴈多到手莫辭􅀟盞飲轉頭又是一年過光隂只在槐柯上奈此浮生樂事何宿中書左司呈上太尉丞相天上誰開白玉堂東垣列宿共輝光􅀞屏雪暎􅅾山鶴錦帳雲凝漢署香嚴尹世交憐杜老楊州詩興属何􅀰連雲􅀐省乗風露月過秋河夜色凉别春次楊州成廷圭韻燕語鶯啼畫可哀更無馬跡到青苔自從玉􅀣成􅁔後曽見銅仙下淚来為晋為秦花幾度行雲行雨日千廽若教蝴蝶知春夢儘把黄金付酒杯省垣梅花官梅過臘花開遍何遜楊州興未闌踈映粉闈疑是􅀞香飄羅䄂欲生寒公餘不厭廵簷咲夜後還思把酒㸔只恐明朝零落盡枉教人恨角聲殘安慶南城􅀉賀守帥余廷心郡守韓公􅅷余家留是郡故句巾及之壮哉淮邑冠荆舒新築堅城鐡不如完羙皆吾大夫力奠安與尔庻民居歸来江漢朝宗水滯迹周南太史書莫説鬂毛成種種近来吾亦愛吾廬丞相委入姑蘇索各官俸米留别幕府諸公不比常年載酒逰杏花時莭出杭州粉圍未􅁴為􅀰貴萱草難忘此日憂沙漠帛書空見鴈江湖春水莫容鷗何湏折盡垂楊栁留取他年繫别愁至姑蘇呈太尉相君求米若求雨負外得船如得仙聀忝下僚班可耻情通隣好亦堪憐山中棊局迷樵客溪上桃花誤釣船醉把玉盃無所計不勝惆悵晚春前城南武威樓成守帥余廷心自安慶使人索詩自来名􅀅出名儒暫駐䄡帷向上居城遶朱䦨連百雉門排􅀞㦸壮群雲開五老招何及秋對九􅄘清有餘樓上記成鐫琬琰廬陵湏得蔡襄書辭荅張太尉見招中年頓􅁴壮心去渉世頗知前事非若使范増能少用肯教劉表失相依風雲天上渾無定麟鳯人間不受鞿殘夢已随舟楫逺五湖春水一鷗飛秋興一夜涼風便􅁴秋楚人多感易生愁金盤露水何曽見紈扇恩情末肻休零落梧桐宫井上稀踈楊桞御街頭近来􅀵得麻姑信説道􅅾莱更可憂夜登天童寺􅀚海日登臨何事獨􅀜情北斗闌干對面横漢使猶空河畔影霓裳如在月中聲魚龍水闊星辰動鴻鴈風髙鈴鐸鳴不待下方鷄唱罷衲僧東指海雲平桃花園招兀顔亷訪使飲桃花好是未全開人世花間醉幾囬一片嬌随􅁔䄂去滿園紅待使君来尊罍有興皆清事風雨明朝又緑苔誰見朔児千􅀊實衘巾青鳥莫相猜武夷山南郡名山説武夷幔亭尚想是秦時空巾簫管何曽絶洞裏曽孫自不知石室尚遺仙蛻骨棹􅁔俱唱宋人辭山前毛竹知龍籜咲與壺公作杖􅀐冷泉亭􅀚猿舊從巫峡㸔猿掛此日山巾復見之􅃛與樵蘓争墜果捷扵風雨下髙枝月沉夜澗魂先㫁風攪霜空呌轉悲應記徃年梅嶺事玉環付與老僧持觀潮次貝廷琚韻世代銷沉在此聲幾囬東下復西傾翻騰日月迷朝夕簸蕩魚龍㝎死生㗸石毎憐精衛小􅄬􅑟未見濁河清眼前波浪猶如此莫説􅅾山頂上行題後堂壁兵權去手志何伸耻是随班入省頻亰國蹉跎空在夢􅅾莱清淺已生塵繞朝謾贈秦人策孔子􅀅書魯國麟散􅀐得辭丞相後五湖安徃不閑人春閨詞白日髙堂欲暮難鳴鳩乳燕静相干銀瓶行酒􅀟環緑玉琯調笙十指寒胡蝶毎因飛過見牡丹多是折来㸔明朝為遣安西使錦字紅燈織夜䦨春懐幾涴先生漉酒巾眼中猶自落花頻春来秪與醉為伴睡起翻疑夢是真翠羽棲香秦隴鳥玉􅁫墜鬢雒陽人風光已逐流年去此事那容更問津湖上漫興百鎰黄金一咲􅁿少年買得是狂名尊中酒醸湖波緑席上人􅁔鳯語清蛺蝶畫羅官様扇􅃢瑚小柱教坊筝南朝舊俗憐輕薄毎到花時别有情爛熳風光在酒家狂􅉕冶蝶趂繁華人来人徃如趋市樓上樓前盡属花波面畫舡雙盪漿堤邉黄犢一逰車目成眉語知何限銷盡柔䰟在狹斜湖上新􅅺雪漸融門前溝水暗相通裙欺萱草􅁿􅄹緑粉學櫻桃淺淡紅暮雨欲来銀燭上春寒猶在酒尊空青綾􅀍薄不成夢又是一畨花信風樂事杭州奈尔何人間冨貴易銷磨畫船湖水年年在紅粉娼樓䖏䖏多􅁔引行雲來綺席舞畨廽雪下春波東坡徃日留詩後更有何人載酒過聞鶯風花時莭又清明迸泪何緑聴曉鶯咫尺故鄉天近逺幾家春草路縱横英雄轉眼俱為􅀑造物扵人豈絶情自是晚生堯舜世不􅀜天地不昇平同趙􅀰竹園夜飲塵土無由得見侵粉墻髙護碧雲深日行南陸暑不到月過天河龍自吟沉飲何妨同阮籍幽情亦或過山隂夜凉庭院羅衣薄吹徹参差思不禁逰雲門寺同寶林别􅄘尊師賦東逰好是雲門寺况是若耶溪水邉茶㑹詩傳唐舊刻松壇名重晋諸賢行雲欲傍支􅀰馬垂栁能維賀老舡也當一場風月夢為題名姓法堂前凝香閣聴雪陡然寒重紫貂輕便􅁴髙簷瓦有聲欹枕欲同蝉殻蜕開門唯恐鶴巢傾數杯酒力春容轉滿盞茶香夜思清小玉迫床推不醒䄂籠檀板失天明桐栢宫留題甚慕天台馬子微後千年始到幽棲江湖􅀊月憐新夢泉石烟霞感舊題阿母信傳青鳥後玉笙人逺絳河低當時不盡風流興付與山鸎儘自啼綉毬花次兀顔亷使韻綉􅄕春晚欲生寒滿􅀣玲瓏雪未乾落遍楊花渾不􅁴飛来蝴蝶忽成團􅁫頭􅂴戴應嫌重手裏閑抛却好㸔天女夜凉乗月到羽車偷駐碧䦨干竹居為張行中題南渡循王之子孫文采風流今獨存既有緑筠為别業何湏畫㦸在髙門小堂翡翠横􅁫影曲􅈳莓苔散􅄚㾗侍婢牽蘿相􅀘葺幾囬風雨送黄昏菊􅀮齋為金子才賦蒔菊家園作􅀮淪要扵晚莭伴閒身從来東晋多名士豈獨南陽有老人色綻黄花知應候香浮緑酒不過旬蘇躭橘井桐君録從古良醫盡佚民􅀄月薄暮蛾眉臨水出照人猶自未分明􅀄升逺岫如無意欲下西樓却有情離别幾多長在望團圓三五未能成豈知少婦堦前拜羅䄂􅅻揎恨已􅄹瑚樓樓前芳􅀣碧􅄹􅄹付與幽禽自在鳴堤上馬䭾紅粉過湖中人載􅀞船行日長燕子語徧好風暖楊花軆更􅁿何限才情􅀍春惱獨教書記得狂名碧梧軒為賈彥仁彦徳二貢士賦賈家種玉能成􅀣上有結巢􅀟鳯凰隂連深井暮雲碧花落大尊春酒香孔崔羽毛􅁔扇小石㨨顔色舞裙長莫教擊墜軒前緑留與吹笙共晚凉東堂梨花為尔東堂雪滿株花時長是憶吾廬風前恐化荘周蝶月下還迷衛玠車老至逄春成感慨興来把酒為躊蹰尋常一様清明莭􅀃似當年緫不如問月亭衮衮流年逐逝波試􅀅此意問姮娥到頭白􅄠幾人在愛此清光今夜多直欲仰天援北斗便湏儘量酌天河此懐此䖏不傾倒禁得宋郎秋思何題清心堂詩卷後為相院判賦曽把桐郷作故郷衙回繫馬入斯堂竇家五子榮丹桂謝氏諸􅀰焚紫囊乞得異花曽見種釀成名酒許先嘗澘然掩卷垂殘淚不獨題詩愧老蒼贈謝肅東還風塵如此送君行莫惜離觴與再傾執手且聴楊栁曲過江便是越州城龍駒堕地即千里鳯鳥及時􅅻一鳴年少有才終大用賈生曽擅洛陽名春暉堂為謝肅題謝傅風流在越郷至今文采見諸􅀰百年喬木慈烏聚幾日東風萱草長江上鯉魚朝入饌枕前紈扇晚生􅈵詩成便欲煩青鳥㗸置君家白玉堂次林叔大都事韻四首春来長是誤佳期鴆鳥雄鳩不可私錯信櫻桃懸蟢子悔􅀅衫䄂染鵝児燒殘蠟燭渾成淚折㫁蓮莖却是􅁝辜􅀒緑䆫閑􅀊月只教楊栁妬腰枝何䖏銀鞍白鼻騧忘􅀅錦瑟数年華渡頭水急憐桃葉陌上春狂信栁花那得芳心到鸚鵡泣􅀅殘泪付琵琶一身已自成惆悵况似平陽十萬家莫謾題情在粉墻藕􅁝終日繫柔腸不知漢主黄金屋何似盧家白玉堂好夢自抛桃葉後閑愁過似栁條長無端􅀵得畨羅帕徹夜薔薇露水香陳王當日賦􅓸波冩淂風流也太多掌上玉鸞㸔教舞雲中青鳥使傳􅁔情緘尺素魚中字恨織回文錦上梭休信雙星是牛女年年波浪隔天河白菊雪羽毵然欲滿樷秋香吹遍畫䦨東今宵白露今宵月昨夜清霜昨夜風朝灌尚扵青蕋見夕飡􅀅與素霞同數莖白髪閑相對誰識柴桑畤苧翁驚秋城上髙風散鼓鼙樓頭獨客不勝悲老嬰世故嗟流落病念郷􅀜厭别離仰面絳霄猶昨日驚心黄葉又當時所悲􅀐省空名累不是潘􅀰愛賦詩昔逰春到名園縂是花都城無䖏不繁華冠翹鶡尾朱􅂁盛馬頓金覊白面斜􅀐吏去忙官索酒侯門晚散妓留車党家賤妾麤豪慣輕易銀瓶雪水茶小王孫貂㡌貂裘羙少年圓牌通籍内門前新分草地緑㳺牝舊賜􅊮􅃓未控弦銀甕葡萄春共載玉鞍驕馬日隨牽穹廬一夜迷􅅧雪忘却朝天是醉眠漢未央宫榱題硯雕墻峻宇幾浮雲金石雖堅亦鮮存秦宫三月已􅁅燼漢瓦千年猶􅀠文改用尚能為硯噐得名何異在君門咸陽土盡英雄骨誰似榱題記主恩匏􅀲道人為徐子貞賦吾豈匏􅀲繫此生道人玩世以為名百年雨露司榮悴一日江湖見老成􅇴落情懐荘子􅉚浮沉蹤跡楚江萍壺公借與龍為杖抛著青蚨到䖏行水竹佳䖏為壺金子賦夏盖魚龍舊兩都風濤千頃與之俱鳯毛終日在池上雲氣有時生座隅茶竈晚烟連翡翠釣竿春雨拂􅃢瑚豈同六逸清狂者沈湎徂徠作酒徒謝張彦恭金注傳来九世醫提携襁􅀒滿門楣自來南渡稱髙手豈獨咸陽愛小児漢史河源知共􅂀田家荆􅀣是連枝木桃猶望瓊瑶報誰謂酬醫不費詩朱家園海棠天機人事毎相催誰到花前不舉盃車馬園林春半後丹青樓舘燕􅀟廽錦幃睡足晨粧在銀燭燒殘莫雨来昨夜綵雲頻入夢米家今見海棠開過王􅀰中草堂賦藥欄春暖牡丹香胡蝶􅀟飛不過墻萬彚天機何䖏静一年春事此時忙篇詩未􅁴為時重尊酒能留共日長豈是輞川無作者直邀裴廸賦山堂適軒為致仕浙東宣慰使楊元誠賦道義相忘樂有餘貴施行與待何如閑身已付􅕋蘧蝶暇日何妨小小車􅉕戀酒香留几席花随日影到琴書軒巾㝎有何人到弟子時常閒起居聴鸎軒何䖏春来好聴鸎謝家池舘越州城緑楊垂地露烟重紅杏映􅄕風日清醉把玉盃如有待咲停錦瑟謾多情却思舊過宫懎畔著意馬頭啼数聲過鑑湖風流數得賀家湖􅀚裏黄冠是酒徒咲出市壚留劍當醉臨秋水索花扶當時未免呼狂客後世猶堪勵鄙夫落日無從訪陳迹啇聲為我起菰蒲秌聲自從大火西流後漸􅁴凉風到竹林李白已無當世想宋􅀰又動少年心群隂淂􅀔夜聲合萬物􅀅窮殺氣沉謾索雅琴弹一曲徽絃繞指是商音七夕天上何因有别離人間謾自指佳期果如女嫁男婚事何限風清月白時銀漢幾曽横鵲影花盤空復􅇢蛛􅁝今朝少婦心中事只有回文錦字知􅀉淮安夏掖齋為感風花懶出門每扵時事觧知聞江湖信逺春空鴈僚佐情深日暮雲詩句好扵何水部官資髙過杜司勲海波不隔淮陽路遥指􅅾莱憶使君有餘清堂連雲􅀐省與之鄰可是髙堂􅂂舄頻湖雨過雲天似玉山風吹酒月留人紅綃貼肉扶􅁔板翠羽粧頭出舞茵禮法豈為吾軰設直須樂死百年身柬示二姪女連宵骨肉夢相牽二女洪都有信傳聞􅀃長成渾屋喜􅀉来針線得人憐阿婆近日身差徤老嬸今年病未痊尔叔治兵淮水上使囬懷抱􅁴凄然􅀉内䑓侍御史韓克荘雜花猶記兩諸天共禮旃檀古佛前塔院施僧猶昨日齋房聴雨憶當年抄書不許支官􅁓買酒從教用俸錢老盡尚書舊賓客至今慙愧杜樊川夜泊牛渚磯同韓克荘僉事李五􅄘先軰登蛾眉亭牛渚磯頭青雀舫蛾眉亭上紫鸞笙月中只可賦秋興酒後不冝留歩兵萬里長河何䖏盡百年遺恨此中生大波緫是英雄淚剗却青山􅂔未平浙省感恩榮言懐述事仰拜宣黄萃一門更煩使者枉南轅寵榮已過愚民分存殁俱􅀩聖主恩列爵稱男分五等封君有縣亦通尊區區戎馬驅馳後日月餘光照覆盆明皇妃子擊丸圗畫柱相當馳道開黄旗風裏試龍媒天廽日取戎衣起電繞星樞綵棒催供奉嬪嬙俱令色近前便佞是于思九齡猶是開元目何事都無諫䟽来重過育王寺明月堂同照大千尊師賦又携二客過斯堂慙愧當年塔院香染習未除塵土念奔馳猶作馬牛忙慚添白􅄠頭顱上轉􅁴青雲道路長儘醉堂前舊時月莫􅀅閑話及齊梁贈士人軍中售筆古来文字用鉛槧筆至􅀩恬始得名毎日諸軍傳檄到何人横槊賦詩成管裁鳴鳯巢邉莭毫運飢蚕葉上聲莫鄙毛錐無所用要知韓范盡書生亷都事海道失風自丹羅至浙右還閩省指南針下失風㠶雪浪連天不見山唯尔不懷和氏璧彼蒼竟錫大夫環皇天未厭生戎馬國歩何能㫁阻艱此去驛程三百里海棠花底度閩􅀜侍御周伯温以行䑓羈留姑蘓柬􅀉之白頭􅀊月付流波何物虚名在諫坡属國莫嫌持節久子陽猶謂見天多強梁不見圖銷印䟦扈如聞欲倒戈一􅀣紅梨春事晚宣文閣下欲如何殘牡丹繞䦨莫惜酒行頻開到姚家已暮春瓊􅀣今朝􅁔正好彩雲昨夜夢非真園林雖不異前日車馬可憐非舊人欲倩東風問蝴蝶花前誰是百年身贈胡世顯宣使代張氏捧謝表請命朝廷􅀉仲舉此去風波萬里長使人指日覲清光雲開雉扇當霄漢龍抱金凾出表章羗服從来尊正朔包茅次苐貢明堂浯溪有石髙千丈謾叟重煩頌大唐題御史孟昉野服􅀞像好似當年賀季真乞身歸老鏡湖春銅章不綰御史印練布能裁䖏士巾麟閣雲􅄗千載後鳥啼花落幾回新浮雲過眼㝷常事且作齊東一野人王自牧汵起敬諸文士逰西湖南山記題其後近聞甚得湖山樂惜不與之同一逰莫問石城來艇子却思簫管在楊州枕邉蝴蝶髙樓夢扇底芙蓉小院秋今􅁴司勲非往日酒間無復舊風流得編􅁱朱恒海道之音命酒徴􅁔記徃年玉堂遂有夢相牽魚緘尺素雖云宻事載空言始可憐季世人材思管樂盛時戎馬􅀃幽燕張騫慣識天河路俯仰乾坤一慨然髙房山􅀞廬山圖貢雲林待制有詩在上為其子户部尚書貢師㤗賦盖其家物也萬壑匡廬􅁓滿張好詩好畫兩相當十年物色偶然得二老風流何可忘還見虹光生静夜却驚雲氣濕髙堂尚書座上多逰客獨有張翰思故郷謝左丞自軍中至同宴周得新員外别業坐来清聴滿風泉頓􅁴煩􅁭為洒然馬上功名真是夢盃巾􅀊月豈非仙浮雲對嶺張圖畫鳴鳥蔵花􅄂管絃莫訝周􅀰賓客盛雄姿英發正當年两山亭留題馬頭曽為使君囬北望新亭道路開扵越地形縁海盡勾吴山色過江来英雄有恨餘湖水天地忘懷入酒盃珍重謝家林下客玉山何待倩人推三月三日湖上作二首此日誰人肯在家傾城滿意事繁華時非上已不為節春到牡丹􅅻是花霧鬂風鬟湖上女􅀞輪繡轂道傍卓児童儘唱銅鞮曲未􅁴人間日易斜此日西湖似曲江湔裙流水碧淙淙誰家婦女不紅粉是䖏水亭皆緑䆫白􅄠㸔花春可数盡舡扶醉玉成􅀟􅀖人何哂狂居士老至閑心尚未降汴河懐古家國承平厭萬機輕乗黄屋出亰畿三年廵狩前王有千里㸔花亘古稀河畔桞條春自長􅁐中螢火夜還飛當時九廟躬辭日肯信龍舟更不歸􅆂虚閣舘娃宫今靈岩寺靈岩寺是舘娃宫霸國風流夢巳空楚客智窮三諫後越師戍合五湖中佳人已化朝雲白髙閣猶􅆂乆照紅誰料後千年過此却慿䦨檻數飛鴻樷玉軒在浄􅄌寺方丈後有塩運使李員嶠􅀞墨竹一林儒學提舉趙松雪題名樷玉参政姚江村作記憲副鄧善之書板刻在軒楣河東使君竹成癖落墨滿林烟雨新雪壁自期留後日碧紗誰與䕶輕塵百年聚散同殘夢一代風流不數人頼是主僧知敬客不辭􅀐馬到来頻遊天台山回别省院諸公明時無日不從容三月清逰在醉中晚岫逺當雲際碧野花事近馬前紅雖非奉使河源上猶及題詩浙水東甚覺淹留煩從者靦顔何以荅諸公送馬編􅁱還明州當年文采動亰城盡説江南馬長卿青史可憐成絶筆白頭相見重􅀜情内湖栁色春仍好小院斜陽晚更明門外􅀞舡堪載酒玉盃儘向故人傾題張叔芳参謀南磵草堂狂客搆堂南澗濱澗巾濯足任魚嗔日容二仲共三􅏙家與萬松為四鄰石角鉤衣歸􅀐晚花枝妨㡌小園春此来不敢􅁔樷桂知是淮王座上人歳除日同廖如川至太尉丞相府留坐説周易因賜酒拜官暦賦此上謝􅀊晚謬為趍府客深慙欵接異他人說經毎嘆匡衡老賜酒何容畢卓貞明日千官瞻魏􅆣幾時萬國共陽春家郷似􅁴無歸䖏准擬酬恩致此身贈太火子玄還閩中子玄侍其師貢秘卿由海道遂赴京師至浙西祕卿死險甚蛟龍又則那只縁有路接天河少年謾動乗桴興中道俄聞曵杖􅁔司馬壮逰空歳月杜陵歸夢隔天河慿君莫下窮途淚何䖏深山無薜蘿岩阿右丞周伯温出示前為宣文閣授􅀴􅀰代祀孔子廟次韻萬世斯文有耿光端然龍衮閟宫墻春秋不獨尊周室金石如聞奏廟堂碑􅀣丹楹皇帝詔盒封黄帕内庭香至今仰頼遺􅀴在師表前王惠後王送徐大章建寧路學教授􅀴籍傳家二百年河汾今在路西偏文雄虎豹豈徒作名動京師非偶然領教七閩勝作郡受知八座合稱賢竚㸔召入承明署禮樂遺書在簡編􅀉我軒為唐主敬貢士賦人世有生皆我寄㸔来造物亦児戯身為蝴蝶何􅀜夢飯熟黄梁自有時形影不煩相贈荅死生同是一希夷濁醪到手能成􅋨此􅃐陶潜或可知送貢師㤗尚書入閩發塩粮供北軍尚書奉詔趋閩省天子深為餉運憂使者頻来大明殿親軍猶駐武安州浮烟壓地朝添竈明月籠沙夜唱籌驛路海棠迎馬首春光難為使君留送杜時中副使南方風土要相冝小盒檳榔好自随蜑户􅀒魚朝入市囝娘把燭夜題詩三年舊俗猶前日八郡良家異昔時若問蒼生蘓息否使車除是一驅馳夜潮禁得錢塘江上潮惱人偏在可憐宵頭顱如許更能白魂魄幾何仍欲消濁浪漸髙河影沒雄風未到雪山遥西流力盡還東下月滿空江共寂寥自遣毎每樽前惜􅀊華牡丹開後似無花山中謾説秦為晋海上難逄棗似􅀲妄想既空無淂夢神仙所至即為家不湏更問升沉事㸔取西樓月又斜秋閨詞一曲哀筝感素秋梧桐落盡碧溪頭御溝葉上誰題怨錦字機中自織愁紈扇恩情空望望鯉魚書信更悠悠雙星不到銀河近風浪過扵隔十洲無題及時無物不倀倀燕語鶯啼緫㫁膓洛浦􅁿塵憐故歩揚州舊夢惜餘香玉和􅆩髄寧無藥絃續鸞􅑟信有方便把漢江都作酒飲時猶恐􅀒春光辨謗詩宣徽院司議李榮貴以使亊至明州飛語獲謗拘留二年乞詩白其事司徒方公命還亰師司議因乗海上槎河源歸路未應賖市巾徒尔疑成虎盃内何曽影似蛇官事吉凶占鵲語閨房消息卜燈花南風乞得樓船便六月中旬便到家縱飲外湖裏湖花正􅄏風情滿意看花来白銀大甕貯名酒翠羽小􅁎歌落梅身外功名真土苴古来賢聖盡塵埃韶光如此不一醉百􅀊好懐能幾囬松筠軒為湖州沈叔方賦軒居好在松筠裏門外清溪繞屋廬文物曽陪諸老後故家似是百年餘客来與酌茯苓酒月出共㸔科斗書若見漁􅀰煩借問桃花清思近何如謝吴宗起寫神紫綬空慙老在身毎扵時事與􅀴綸不呼賀􅁥為狂客却謂張良如婦人潦倒形容何用似荒唐言語半非真凌烟􅀞像今誰在更與丹青冩此神送劉庸道侍老父入閩就飬此别為生一悵然福州逺在海南邉白頭病叟年八十紅􅀣寒山路幾千􅀒米既供為子職賃車不仰故人錢起居莫與檳榔逺風土他郷氣候偏栖霞嶺訪姚子章買得湖船為訪君望中都是北山雲風前楊桞驚秋晚波上芰荷愁日曛青火縱能傳後世白頭休更説從軍棲霞有酒能留客縱飲何妨到夜分送張伯雅架閣入閩省聞道連年瘴氣􅀵城中風景稱清逰􅂙天榕􅀣快人意似雪梅花當馬頭海客朝盤送珧柱囝娘春詠冩銀鈎母嫌習俗閩中利儘勝吴船唱莫愁題貫酸齋芦花􅀍詩後學士才名半滑稽滄浪􅁔裏得新知静思金馬門前直那佀蘆花􅀍底時夢與朝雲行䖏近醉從江月到来遲風流滿􅁓龍蛇字傳遍梁山是此詩劉生侍貢尚書入閩卒業藉甚劉生尚古文師資貢禹卒前聞從公未􅁴山程逺到日湏知土俗分紅嚼檳榔霞滿口白飛鸚鵡雪成群七閩自惜稱文物莫説三山盡瘴雲感事雨過湖樓作晚寒此心時暫酒邉寛􅂎人唯恐青天墜精衛難期碧海乹鴻鴈信從天上過山河影在月中㸔洛陽橋上聞䳌䖏誰識當時獨􅀝闌老至翻遭世慮牽何曽一􅁴淂安眠家郷尚逺潯陽郡世事有如天寳年朝報唯瞻遼海上羽書不㫁省門前長星正在天西北白水寒沙盡可憐雨香堂為晦岡李介夫賦雷電􅁳􅁳起晦岡百年虚氣㑹断堂友人李愿在盤谷髙士嚴􅁜是故郷薄有貲囊供一老盡􅀅文采付諸􅀰酒坊新斫松杉架毎日風来兩氣香蓆㡌山人王達見貽詩附録畫省委蛇退食遲倒衣相見即相知風流不減張亰兆心迹無慙栁士師枕上燕鶯鳴署日道傍花蘂􅇢逰絲天機人事都觀遍有約山中賸採之題桃源州知州李尚志母暨陽縣君􅃽氏墓誌銘後承㫖學士榮禄大夫晋寧張翥撰小龍岡上有髙墳石表新題􅃽院君五品官榮清代爵一封誥織紫鸞紋生児何媿孫征虜作誌可無楊子雲歸去焚香人事畢大夫元是舊􅀅軍題原善張府吏具慶堂張子搆堂題具慶此生捧檄為榮親府中年少固可數幕下英才惟此人尚褧錦衣加􅁻服忘憂諼草共陽春移忠錫類從兹起何患風雲不要津題推官贈行卷聖主搜賢及海隅王褒歘起應時須澧蘭䖏䖏􅁔公子楚國人人誦大夫藉甚姓名登制命霈然霖雨下雲衢力田孝悌興岩穴何異福王遺􅀞圗西湖漫興玉局當年為冩真西施冝咲復冝顰朝雲暮雨空前夢桃葉栁枝如故人露電光隂千刼外魚龍波浪一畨新傷心最是林逋宅半畆殘梅共晚春清㮣􅀮居門向東吴好䖏開栁花風裏白鷗来青山對榻容欹枕黄鳥啼春索舉盃賓客偶携紅䄂至庖厨新得素鱗囬滿前清㮣誰能領消得曺公八年才贈仙都生栝蒼仙都十二城中有異人毛骨清淩風振珮片霞舉乗月吹笙雙鳯鳴山上羊眠如石化洞中桃熟驗丹成長鑱採藥或能見不識此生真姓名聴雪軒化機潜運本無聲學士情多睡未成􅀮儿欲同蝉殻蛻開門唯􅂲鶴巢傾花飛翠䄂寒光動茶煑銀瓶夜氣清小閣下􅄕人似玉舞衣製得五銖􅁿慧具庵自灤東回慧師新自上亰囬壊色袈裟染刼􅁅河漢路遥難載石􅅾莱水淺不勝盃已知道骨鶴同瘦無復機心鷗可猜去把西江都吸盡却從馬祖問如来仙姑泉次劉􅀰巾韻誰把丹厓手擘開巨灵還到此中来青􅁳風露銀河近白日雷霆碣石摧神女有時成暮雨胡麻何䖏是天台劉􅀰舊不通仙籍能得題詩在紫苔江浙省理問朱文選為妻兾縣若求挽詩鏡鸞莫更惜􅀌眠白玉䑓前幾抱孫兾縣君今題鳯誥婦人貴已載魚軒何湏出涕悲同穴政可長􅁔為鼔盆夫婿白頭無􅀁憾只求文采賦招魂湖山堂觀牡丹儂香偏惹宦逰人銀甕連車載酒頻乍雨乍晴三月莭傾城傾國一年春却勝飛燕為皇后謾把驚鴻比洛神若問風流誰可賦只因宋玉是東鄰和三脚雞士壁上賦河上仙翁有洞房几􅅾雖小勝舟航徑花妨㡌青霞近楹竹侵衣白露香盤内釣魚供過客床頭剪月照抄方平生飬得鷄三脚幾向人間唱曉光素居詩為山隂王思敬賦飬素衡門􅀊已深坐㸔喬木㡬成隂青雲不到幽人夢白􅄠能知閲世心附郭無田遺稚子傳家有集是黄金絳霞盈頰先生􅋨詠徧堯夫擊壤吟送宋倬還南康及此青春還故郷順風幾日到南康􅈐連五老出空闊水接二􅀌来􅄅茫徐福樓船能共載劉安鷄犬亦相􅀅山桃子落都成􅀣花裏應迷舊草堂荅仁一􅀄禅師次韻冨春江頭風浪稀冨春山裏薜蘿垂滿前明月為誰好中有髙僧勞我思意適定同魚躍䖏神清多在鶴鳴時仰承山偈難酬荅不是張衡嬾賦詩過峽石山張同知墓上作平生好友􅀃張侯紫峡雲􅅧墓木稠朱􅌧尚能光世澤黄金元不為孫謀夜冠南郡成前軰風月西湖捴舊逰過此豈勝存殁感恨無􅀌劔掛山頭題若水臨周昉畫用虞先生韻一片行雲出畫簷東風吹恨滿眉尖􅓸波鵠峙塵生歩舞鏡鸞廽月照奩楊栁緑肥羞裊娜櫻桃紅熟昈香甜風流更有驚人䖏呼下丹青語未淹贈王法師祈雨感應名衘知久逹天􅀜可是風雷指頋間禹歩㕨香纔一息雷聲送雨已千山公私盡有倉箱望壠畒都􅁯稼穡艱下土不知􅀩帝力滿城簫鼔送龍還蘭􅆤圗為戴椽賦舊家文獻石屏翁楚國髙情世所工捐佩憶曽過澧上浩􅁔今望在雲中色欺翡翠滋清露香淡薔薇送好風可意􅀰君玉􅆤裏肯􅀅幽興出蘭樷謾興浮世浮名一羽􅁿百年何用較衰榮滿壺好酒供春酌幾尺㳺􅁝共晚晴明月半􅃒盧女扇飛鴻斜引謝家筝揚州杜牧無拘束每到花時最有情送戴檢校入閩叨忝明時已自分徃還唯是舊斯文西􅆤夜雨同聴䖏左掖官曹獨有君茉莉䘖香騰玉氣荔芰顏色染羅紋風流東閣應多咏肯與幽蘭􅀉暮雲􅀟清舘蔡􅂙政立名廬陵兩生来作椽虀甕長年氷雪寒中書八座共相許華衮一字誠為難風神左右暎白壁文彩上下翔青鵉况聞客舘更清爽秋色南山相對㸔送湯僉書還亰天上城開白玉京仙曺列聀侍金庭行天半是從龍氣載筆都慿躡鳯翎鳷鵲西飛雲渺渺􅅾萊東望海􅁳􅁳道家自古無離别唯誦空􅁔送使星園􅀮為方員外賦省􅀰别業苕溪上抱甕日逰溪水邉花徑春晴胡蝶到菜畦雨過桔橰懸児童慣識題詩客鷗鳥長随載酒船更􅀃陳琳工筆札獨􅀅文彩從戎旃佑客不用雄盖世勲不湏考證六經文孰為詩火杜工部誰是玄􅀴楊子雲馬上牛頭髙一尺酒邉豪氣壓三軍塩錢買得娼樓􅀫鴉鵲鴛鴦醉莫分題前後赤壁賦圗黄州故事今何在漢水東流尚未窮一世英雄爭赤壁百年風月属坡翁吹簫俊發龍吟後作賦才豪鶴夢中二客從逰雪堂夜丹青猶與昔時同題曹伯起雲門小房相國傳来幾世孫山房随䖏見雲門矦家􅀞㦸固無有舊物青氈俱尚存清譽在人瑚璉噐髙情終日鳯凰群芝蘭玉􅀣階庭秀已是新承雨露恩送布政司周照磨赴京聴除沿􅊾囬京喜可知青雲母謂著鞭遲供為臣聀乃常事簡在帝心唯所司宗廟豈遺瑚璉噐羽儀當會鳯凰池仙􅀰戀􅆣情應切不為河梁住少時忠飬堂為張府掾賦張氏搆堂情已著毛生棒檄事方新府中才俊固多士幕下孝亷唯此人返哺老烏憐白首冝男芳草擅青春莫論日用三牲飬一面􅂬顔足奉親筠􅆤圗為荆南曺以章賦豫章徐文珍􅀞此君何可一日無徐君為繪筠􅆤圗深居碧雲憐日暮展卷清風生坐隅漆簡舊来銷翡翠漁竿釣罷拂􅃢瑚荆王不近周王獵晚節猶能宿鳯雏秋水軒為陳惟真鏡湖一曲越城邉溢岸秋波若可憐雪㸃荷塘㸔鷺下烟消沙渚見鷗眠賦成􅀐省從班鬂酒在稽山信􅀞船何在望洋奔海若軒中自足管流年題大􅀮菴開士殊無别逺翠樓坐来未􅁴西山逺紫翠千重隔􅀞䦨此䖏豈容携酒到任誰只許捲􅄕㸔佛爐香供朝雲散客碗茶分雪乳寒一自得陪清論後此心不用倩師安醉漁為錢思服賦江湖猶自有狂夫白髪蕭然􅀒壮圖睡著任船随月走醉歸臨水索花扶要知吕望真漁者可惜酈生非酒徒澤畔獨醒誠可詠春風能到雪肌膚次韻䖏士和壎上人詩毎到爐頭憶􅈸殘十年戎馬雪􅆤寒亂来亦為功名易老去纔知世路難醉把茱萸應自感狂題鸚鵡欲誰看相逄白髪秌風裏何惜銀燈照夜闌司馬温公九世孫碏持公自書獨樂圖并東城詩到今􅀅二百餘年􅁓不盈數尺手澤猶存感而賦詩浮雲聚散豈堪論富貴何如道徳尊幾見􅅾萊成淺水可堪風雨換髙門􅁓圖價匪千金重手澤傳能九世存眼見寝園成茂草却知司馬有兒孫留别寳林同别􅄘講主􅅧酒船謾尔到山隂頼有髙僧在寳林不信􅀌鸞臨寶鏡更無流水入瑶琴閑吟蝴蝶過鄰近􅋨擊􅃢瑚坐竹林此去浙江􅅻百里興来命駕即相尋留題滴翠軒城中買地論黄金種得琅玕欲千尺月臨閑砌白􅃄生霧入空林翠光滴長房杖􅀐龍一枝子晋笙吹鳯􅀟翼曽過門前廽酒舡洞房清􅁔逺山碧贈李學䆒裒然􅒌掖更垂紳見客何曽有怒嗔講道誰為木鐸者摛詞真似玉堂人舊書幾帙俱先集􅁱竹千尋是切隣毎向百花時莭到長裙自醉小園春重陽日􅀉洞霄宫賈道士天官侍􅀰曽􅀉音因循秋晚始相尋張良中􅀊頗好道賈島一生成苦吟敢學㳺山随猛虎要聴搗藥試微禽丹泉况説紅如酒好與茱茰一䖏斟田園居早歳歸田古所稀豈同􅕋瑗晚知非臈醅儘醉顱鷀杓春服仍加薜荔衣一畒園廬皆樂土百年冨貴盡危機沙頭幾動鱸魚興每到花時與願違明州􅌼師園觀猿捷扵風雨過喬枝乍鎖名園亦自疑㡬萬里来都是恨苐三聲後最堪悲月沉夜磵䰟先去露滴春稍淚對垂冨貴豈能長汝役緑珠還有墜樓時晚歸左掖歸時日未斜小園檢校舊生涯染裙萱草􅅻抽葉破雪櫻桃又着花玉斚試斟官給酒銀煎重瀹貢餘茶西湖水色春來好􅀃道風光似謝家雪溪船為李勛賦玉山自倒雪溪舡何似長安酒肆眠良夜竹聲偏到耳舊時月色不論錢佳児出見詩能誦好客来頻榻􅂴懸更有落梅歌小妾儘堪陶冩盡餘年􅈳山興聖萬夀禅寺之廣福菴乃曇芳忠公道塲其徒統上人居焉菴前舊有海棠􅀣洪武三年結實大如木􅀲五色有香嘗謂海棠春一夢却成因果結天葩有同仙客誇桃實不待詩人賦木􅀲龍頷珠今歸汝手錦衣囊合在誰家明年燕子来時候更與維摩作散花鄰園海棠自家池舘久荒涼却過鄰園㸔海棠日色未嫣紅錦􅀍露華猶􅊜紫絲囊掌巾飛燕還能舞夢裏朝雲自有香銀燭莫辭􅅧夜照幾多佳麗􅀒春光題王維賢東里草堂周遭都是及肩墻馬過猶知舊草堂苔􅏙兩晴蝴蝶亂藥欄風暖牡丹香萹詩未􅁴為時重杯酒能留共日長豈是輞川無作者却同裴廸賦山庄慕雲菴此菴長與此雲期大孝終身有慕之杯圏更無重飲日板輿還有再乗時行天雨絶皆爲淚落日烏啼捴是悲誰刻㑹稽山下石悠悠千載白雲詞題秋江送别圗故人冩出陽關意都付丹青半幅中霄漢正當鳴鳯日帆檣好趂大鵬風酒期鸚鵡偏能緑花贈芙蓉可奈紅對此題詩無所嘱百年􅀘報是深衷􅀉戴山人近水齋房自掩扉若􅁘溪路客来稀浮沉里閈時􅀅􅀮俯仰人生事已非小妾謾􅁔楊栁曲髙年渾稱薜蘿衣誰能冨與封君等千畒湖西紫芋肥醉題二月鶯聲最好聴風光終日在湖亭清宵酒壓楊花夢細雨燈深孔雀屏情在綢繆􅁔白苧心同慷慨贈青萍方平自得麻姑信從此人間見客星贈朝元宫道士邢本􅀄朝元宫裏邢道士神采照人如玉山壺中日月付談􅀏天上風雲從徃還虎守杏林丹已熟龍眠秌水劔長閑共傳紫氣如車盖徃徃相随出近􅀜觀雪銀燭髙燒錦瑟停酒盃如對六花傾清寒未􅁴貂裘重小舞偏怜翠䄂􅁿金谷緑珠紛有態鴻門玉斗碎無聲九天散漫随風䖏莫是天人咳唾成筠深軒幽居只在平湖上萬竹􅁳􅁳不可尋龍化毎因春雨過鳯巢多在碧雲深人皆到此失炎暑風忽過之如瑟琴能有此君相晤對故家何用積黄金晏居有懐徐一䕫教授逝者如斯継者誰遺􅀴獨抱可勝悲心忘爵禄身方逸道載文章老始知乳燕試飛華屋静桐隂􅀄合􅀞􅄕垂古音最愛朱絃瑟弹向髙堂念别􅄐題孝義詩卷可􅀅言行以書紳淮海維揚見若人慷慨分金存乃叔艱難返骨葬其親刺詩杖杜於今廢髙塜麒麟自此新俯仰即今無愧怍平生張􅁺厚􅉓倫􅀘賦征雲南椽史凱還詩大矦秉鈇行天討戎幕論兵聀匪􅁿􅀔若摧枯狂虜滅文無加􅀧捷書成日陪赤舄紆髙歩身附青雲致盛名入奏㝎功應賜爵班超元是魯諸生水竹居為諸􅁑伯安賦諸􅁑南陽有草廬何如扵越此幽居門前􅁱竹􅀞不就湖上好山清有餘日暮碧雲生悵望天寒翠䄂若愁予鯉魚遺我平安信盡向琅玕莭内書七夕七夕佳期自古今􅀟眉有爛夜沉沉可憐乞巧樓前月曽照長生殿裏心鵲引凡情瞻繡户蝶随秋夢入羅衾斜河已沒東方白雲濕幽蘭思不禁
