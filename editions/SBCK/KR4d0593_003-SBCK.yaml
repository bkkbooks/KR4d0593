未消床上一壺堪獨酌風流不减覇陵橋閑居春盡㡬日春殘不在家堦前開遍粉團花􅂯㸔又是明年亊酒滴東風惜􅀊華題淵明像典午功石䓁羽毛區區州縣亦徒劳折腰五斗無人識只有歸来最是髙升仙壇壇上春風長紫苔當時仙駕此徘􅆦山中老盡千年􅀣化鶴何因一再来題王􅀂水􅀞翎毛喔喔雄鳴趂暁光豈同雌雉在山梁雲中鷹隼無虚爪羽翼低飛好自防東風吹水碧漪漪不放桃花自在飛莫怪野鳬驚不㝎溪頭弋者未忘機題道士王東甫圖􅀞金銀樓閣在三山東甫何妨屢徃還信是神仙在平地鸐飛元不離人間􅀉報國寺渭清逺上人時張氏築城誰􅀃􅃊􅀜一両重直教隔㫁白雲蹤城中何限蕭家寺不把三間事逺公桂花仙子圖秋雲㡬片剪衣裳吹盡西風骨更香明月不應生洛浦又添情思惱陳王船過臨平湖船過臨平欲住難藕花紅白水雲間只因一霎溟􅄥雨不得分明㸔好山􅀉三塔寺寛虚海望見寺前三塔近老夫指擬駐行舟無端一陣東風雨吹過湖南不自由凌霄花天女天花一様嬌凌霄挽下最長條生愁化作空山雨滿臉春紅恨未銷題新亭壁為愛亭前金鳯花風吹滿地散殘霞清樽􅇛扇能相伴飲到海天秋日斜題􅁱竹士女圖䄂卷香羅日又曛寸心都作錦囬文莫教吹動􅂙差玉驚㫁陽䑓一叚雲題左司壁春􅀣團團日未斜東風滿地散青霞曉鶯啼過落花雨獨立淮南宰相家題王􅀂水􅀞萱草花開日又西太湖石畔鷓鴣啼竹枝不是江南曲唱得樽前思欲迷題唐十八學士圖尭舜之道載方冊人存政舉又何疑肅容歛手慚色者知是當年封徳彛題趙子昻浴馬圖真是房星夜降精􅀟瞳下照水波明浴囬有翼應飛去萬里風雲是一程風馬時清天地息烟塵騰躍乗㸔自有神逰牝委龍求作種任渠風合向天津嘉禾湖上為謝􅂙軍題扇鸚鵡盃中紅麯酒鴛鴦湖上黒油船南風吹入荷花蕩借與閑人一醉眠明皇對奕圖漏盡宫壺日晷移君王猶自戀殘棋馬嵬一著無人筭只有楊妃自得知題楊妃横玉圖天寳年間好太平華清小殿稱人情如何玉笛􅅻拈起便作風吹别調聲春日㳺湖神仙不死今何在冨貴能全古亦難賸買蘓公堤上酒莫教容易度春寒題白玉蟾像白玉如蟾俱是妄青天指月亦非真武夷洞裏曽相見却是尋常劈􅑪人詠何立事宋押衙官何立秦太師差徃東南第一􅄘恍惚引至隂司見太師對岳飛亊令歸告夫人東􅆤事犯矣復命後即棄官學道蛻骨今在蘓州玄妙􅀚為蓑衣仙舊作衙官身姓何隂司歸後記仙魔視身已是閑軀殻一領蓑衣也是多謝太傅謝安徳望重南朝妓女東山未􅄫􅋁􅀂論漢家勲業事何如笳鼓霍嫖姚四菓􅀞照眼紅綃未十旬西風又拆錦苞新石家金谷如長在儘有明珠換美人石榴漢帝求仙不自知祗慿青鳥使瑶池矮人不見東方朔肯信三偷是此児桃實葉底纍纍黄漸深暖風四月熟幽林記曽摘遍西園􅀣好似文君取酒金枇杷廊廟嘗新内厨酪粉賜金盤白頭見􅀞成惆悵滿朶春紅不厭㸔櫻桃效唐僧無則詠物詩四首巧作春禽百様聲似矜觜舌有餘輕若為賸有閑心性何不雲中學鳯鳴百舌禽褵褷羽翼作羣飛殘害溪魚欲自肥滿膆腥涎吞不下爲人長忍一生飢鸕鷀鳥木茟花含暁露濃似􅀅才思擬春風若還開在江淹宅夜夜題詩入夢中木茟花小小紅絲疊絳霞􅁫頭玉燕共年華果然買得青春在儘把名園種此花金錢花紫菊應爲揚州舊使君鷄冠顔色染􅁔裙陶翁每日東籬下誰肻花前問紫雲唐太宗遣御史蕭賺禊帖圖君臣詭遇一獃僧禊帖雖来事可懲誰料萬年歸殉後却􅀅繭􅁓累昭陵宫廊雪霽圖馬逺􅀞􅀞在丹青事亦非碧山猶自繞朱旗分明黄屋宸㳺䖏千歩宫廊雪霽時東坡笠屐圖從来泾渭不同波得貶􅀺中幸已多莫把丹青論笠屐文章千載一東坡杜宵􅀞圍棊圖何事今朝􅂴􅀞眉深宫又是日長時閑愁不用量紅線㸔取新添㡬着棋雨晴薔􅅔正開雨弄晴狂􅉕觸䖏亂紅英韓朋莫作雙飛蝶泊在其間􅀞不成暁起杏子花開桃蕚紅夜来踈雨過􅄕櫳風光雖是好時莭春在誰家絃管中松瀑圖石間􅈭浪雪無迹松下瀑流雷有聲百折狂瀾非是險人心方寸最難平寒食錢塘江上逄寒食逺客今朝轉念鄉㡬􅀣落花春寂寂數行囬鴈草茫茫孫鍾設瓜圖三士慿空化鶴羣已􅀅旗盖兆三分劉家門外樓桒􅀣豈是荒唐䜟所云岳林寺題兠率内院為玘石心上人賦兠率天宫内院開錦衣彌勒咲盈腮因縁未了児孫債此是重来苐㡬回聞夜潮潮到江樓月到遲百年心事有誰知床頭尋得劉琨劍舞向秋風惜舊時張横塘􅀞竹枝萱草㡬宵明月竹枝好一夜東風萱草長悵望羙人烟水闊不勝清思繞横塘荔枝􅀞為福建張惟逺僉憲題濟南人尊前人出玉芙蓉纎手親分荔子紅歸到大明湖上宴也應㸔􅀞説閩中茜羅􅁿褁玉肌寒吹盡南風露未乾一寸丹心無與􅀉為慿圖􅀞入長安紅塵一􅀐露華香不管盧龍道路長誰信御前供玉食不呈妃子不先嘗六月南風荔子丹皺紅小碧滿銀盤水晶細嚼甜扵􅁡滿口生香玉露􅄎剪花士女咫尺芳樷艶色深􅉕情蝶思兩難禁㸔来莫用閑惆悵剪下春風一寸心趙仲穆人馬圖廐吏牽呈御苑廽開元毬馬盡龍材趙家富有曹韓様摹出承平氣象来劉曜卿􅀞折花宫女栁風草露欲霑衣又是宫中上直時好把􅊝花都折盡免教吹作落紅飛錢舜舉􅀞芙蓉木末芙蓉㝡耐寒䓁閑不許世人㸔蛾眉淡掃朝天去自採花頭製道冠梅花水月仙子􅀞㳺䰟非􅀑亦非仙慿附梅花度􅀊年欲向姮娥訴􅀌另浪中亦自少團圎招周徳新貟外􅀚菊明朝莫問晴和雨􅀐馬能来㸔菊花豈是省􅀰無酒對不如此䖏似陶家題扇士女轉深文字轉多情侍女常􅀅筆硯行恐淂玉臺新様句為題團扇贈卿卿湖中即事湖栁湖波盡可憐不知春在阿誰􅁁滿頭翡翠􅀟鬟女細雨吴􅁔濕􅀞船挟弹㳺􅀐圖趙仲穆􅀞玉臂􅀟揎㩀綺鞍渾身俊氣要人㸔􅀂知稼穑艱難事肯把黄金鑄弹丸李白應制圖明主憐才赦酒狂不知力士賤文章當其醉草清平調肯信長安是夜郎杜甫上謁圖出當天寳艱難日歸拜拾遺行在時入蜀還秦底心性一篇長拜杜䳌詩􅀉逺詞夢裏􅀜山􅁴後非憂深别淚在羅衣堂前種得冝男草正及春香人未歸臨安訪古十首石鏡臨安山中古石鏡曽照錢王冕服来天遣紫苔封褁後等閑不許别人開婆留井錢王􅀄生時􅀅棄井中婆奮留之故乳名婆留既貴以鏐代留字舊日婆留井未堙石䦨苔蘚上龍文而今率土俱臣妾莫願皇天産異人功臣塔􅄘頭石塔表功臣五百年前是佛身莫問􅅾莱水清淺野藤猶蔓刼餘春錦溪錢王功業與天齊百里旌旗照此溪從自波中鋪錦後至今光景浄無泥化成寺錢王苐十九子出家為僧賜號普照大師王子能以身施佛何異生居浄梵宫弊屣視他閑冨貴男児到此是英雄衣錦山令縣治主山是王故居即九龍堂還郷滿山都覆錦冨貴應湏白晝歸設宴九龍堂上日沛中􅁔後似王稀􅀅軍􅀣王平時率羣隊狂戯此􅀣還郷以錦幪之號錦􅀣􅀅軍􅀅軍官重執金吾不比秦朝列大夫王為錦衣歸故里遂令老􅀣有稱呼環翠閣今為寺謝安逰䖏東山尚存環翠閣謝傳逰来經㡬年可是舊曽携妓到粉香猶在􅀞欄􅁁浄土寺東坡作杭倅行部過扵潜回祥符額賜海㑹寺四百年来弹指過試問竹林橋上路往還曽見㡬東坡九仙山王謝舊㳺東坡有詩仙子何年化鶴羣至今名姓只空存我来欲訪前朝亊悵望九山唯白雲鴻溝天命何曽分椘漢自􅀅南北限鴻溝當時應恨烏江水不與君王照白頭李白小像承制摛毫玉殿頭清平樂府擅風流名花傾國能相妬得寵翻貽失􅃂憂桃源圖㡬􅀣桃花認未真又何分晋與分秦漁􅀰不悟避秦者便把興亡説與人蘇卜小墳上作在嘉興縣前晋名妓錢塘人有詞行扵世今為人家占矣香骨沉埋縣治前西陵䰟夢隔風烟好花好月年年在潮落潮生更可憐宋賛善以笻竹一支并詩贈玘太朴次其韻庸蜀之西一竹笻年来帨首已如龍扶登春殿談經後風雨時生掌握中題蔵祥卿􅀞露􅊝風栁两依依􅀞在丹青亦自竒􅀂在墙頭并驛畔過春都是折殘枝問蕳夷道索冬筍僧家嗜笋如嗜肉滿腹生香貯寒玉肯信湖州太守饞飢来煮遍千林竹徐一䕫以自已小影代送壎上人囬龍門寺為題其上縂是三生夢幻身又何分别假和真縦饒送到龍門寺也只丹青􅀞裏人邵庵虞先生為張伯雨賦四詩開元宫道士章心逺求追次其韻伯雨􅀞像號勾曲外史此􅀞茅山苐㡬真翛然白氅鶴翎新百年最在歸􅁔詠一代交㳺在縉紳懐舊憶誦清江空舊魚流光如赴隙中駒雲沉華盖星沉海思絶狂張與老虞丹井今在佑聖觀東圃張仙扵此煉丹砂夜夜丹光照井華猶有石欄遺刻在􅀅軍移置羽人家磵阿碑邵庵文字在堅珉摹刻中􅀰茟畫真在日得錢除買酒餘貲都付打碑人贈人逰湖南世途無䖏不通津惟爾棲棲志未伸莫過沅湘唾江水此中曽有汨羅人趙子昻􅀞花鳥綺紈舊習信難移得意青春正好時直下玉廬無所亊試臨花鳥學徐熈
