front:
  text: 張光弼詩集􅃃之四
  hash: sha256:606e1ed6035cfa762e0ddb841d63ad449e95a8ea2a51b2093ffeae904f1b1724
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_004-1a}
body:
  text: 五言絶句古辭歡樂自歡樂苦辛長苦辛城中十萬户誰是種田人風雨牧牛圖牧牛值風雨牧具㡬脫手不自風雨前不自風雨後石友蒼然柱石姿風雨莓苔久幸同貞固心相㸔即吾友竹君百年駒過隙萬事成鞅掌自顧非此君誰與共清賞花􅏙繁花作髙􅀣狹逕不數曲醉来扶杖行幽興亦自足蕉林愁懐長把酒愛此滿林玉風廽舞䄂翻欲近紗􅆤緑芳屏衆芳結為屏左右暎紅藥問訊園中人何如金孔雀􅂼畦學圃􅅻两畦佳􅂼欲㡬品露葵不厭烹及我春酒醒梨花折枝已過清明莭猶依玉鏡䑓一枝如折得㡬誤蝶飛来水殿納涼圖别殿紅綃女無風亦自凉欄􅁁是湖水夜夜􅀫鴛鴦七夕乞與人間巧全慿此夜秋如何針線月容易下西樓别劉愽士秪為情如雨從教醉似泥免㸔楊栁色相送出城西王昭君漢地非無雪胡中不見花琵琶一萬里馬上盡風沙巾幗猶知辱裙􅁫可即戎單于如有問教妾若為容銅雀䑓自古誰無死英雄豈不知望陵􅁔舞歇還有夢来時􅁁思萬里盡風沙征人念􅀊華角聲悲自語誰見落梅花赤壁赤壁不改色漢江依舊流二龍争􅀾後風月属扁舟峽川石與青天近浮雲向客低自然堪下淚不是有猿啼題楊州史左丞􅀞扇后土祠前路金鞍憶舊㳺春風􅀟燕子渾似在楊州塞上朔風西北来驚沙對面起人馬暗相失咫尺異千里題啇山􅀚奕圖縱横十九路一著一回新如此􅅧山許傍􅀚亦有人題村廟禍福慿誰降雞豚合有災年年當社日簫鼓賽神来飛来􅄘􅄘在西天竺青蓮千葉開佛人無妄􅀃或恐是飛來呼猿洞洞閟􅃄霞古岩廽藤蔓叢誰能􅀅劔術往問白猿公題名石東坡龍井囬題名塔磚上豈期後百年過者為瞻仰合澗橋两澗何年合一橋終日閒桃花逐流水未􅁴是人間龍公洞龍或蔵其用跡與蛇何異慚愧耕稼人猶来􅀱雲氣飯猿䑓僧既非昔年猿亦異徃日唯有飯猿䑓猶是當時石連岩棧連岩有棧道重疊架古木勿輕縱歩險平地折車軸客児亭客兒謝家子明師夢相待斯人骨已朽斯亭尚千載坐禅石法師禅定時萬象付冝漠至今岩前石每每天花落隣墻梅花臘後春􅅻到寒香襲素􅂁梅花如有意不在粉墻髙聞鍾朝撞亦匆匆暮撞亦匆匆銷磨浮世事都在數聲中􅇘萱草種得冝男草忘憂度􅀊華􅇘池憐照影朶朶鳯頭花􅁑仙溪􅁑仙浴丹溪飲溪骨自蛻試問㱕来鶴何人壽千􅀊濟川圖平地有摧輈慎者或不免奈何千金軀涉此風濤險菊花萬夫起銅盤㧞地一千丈寧知白露華暗滿菊花上臧祥卿􅀞竹枝白頭禽扇面片月出幽林閑情欲不禁天寒憐翠䄂為賦白頭吟西施館娃宫前洞西施舊来徃自載扁舟後􅀊􅀊春蘿長履迹西施徃行䖏好事作履迹㡬寸莓苔􅅧見者為憐惜問梅一種隴頭􅀣東風都合吹未應造物者偏在向南枝嘉新晴五色雲間鵲今朝忽放聲繞簷飛不去亦是喜新晴泉月軒為開元宫張道士題為貪真境好每到即忘歸扣齒漱明月清光生羽衣題飡霞洞愚者昧其􅁴貪生還一夢不見飡霞人唯見古時洞李息齋平章􅀞生色竹一代風流盡丹青付此君忍􅀅湘浦淚更洒九疑雲題牧溪飛鳴鴈二􅀞秋風㡬萬里一色是青雲誰信天山路無書可􅀉君倦飛憐羽翼引􅖪一長鳴紫塞秋何佀今宵月正明新宫訪􅀽真人知已羽化留題仙客已塵土桃花依舊春後来㸔花者不是種􅊝人惜花昨夜一花開今朝一花落春事能㡬何奈此風雨􅁖僧華光􅀞梅誰與一毫端示此無垢相迦葉不可招始悟色空􅄭栁荘種栁連荘屋春来色更嬌不同殘臘見封雪落長條桂林不􅁔樷桂誰能更出山􅀂無忘世事来共此中閑蘭渚幽蘭滿洲渚紉之可為佩欲遺心所親涔陽何䖏在竹坡城中寸金地種竹不可多風前植杖㸔奈此緑隂何瓜田仲夏生意繁延蔓􅀂野􅁑結實田畆中庻慰行者渇荷港門前東西道下是荷花港越女不避人唱􅁔来盪槳鶴亭有時命童子亭前按舞鶴雖無賓客懽對此亦云樂魚池放魚池中央池水丈尺許勿謂江湖逺時来足風雨題市學堂喧聒從終日跳梁欲上街要令心目静除是掩空齋贈歐陽尚禮還播州人生豈無别咫尺異言咲况復萬里遥風烟接蠻徼觀拆白塔有賦白塔誰所營又復為平地猶有百年人閑来説興廢題章叔厚所􅀞投竿圖大魚不可得小魚釣何益不如投竿坐臨流以終日上清方方壺作墨􅀞贈毛起宗提􅀧風火鍊仙骨雲雷鑄􅂦文壺公探造化圖􅀉大毛君趙清獻小像當時仰望公􅀞筆開生面之官唯琴鶴千載趙清獻别故人未别欲千言臨别無一語唯此舊時心随君渡江去别郷友共是他郷客從㳺又隔年老人偏惜别把臂一茫然贈縣令任滿一勺清泉水三年共此心不堪弹别鵠唯是邑中琴磐石吹簫圖宰相五更朝金鞍拂栁條何如磐石上散􅄠㘴吹簫落梅花含章人正卧㡬片下空墙春雪調鉛粉相和一䖏香題宋子障太守􅀞老􅀣含青雨平林淡白烟隔溪茅屋在好泊米家船題趙子昻􅀞梨花􅀞眉圖鳴春如有意誰與􅀞眉長􅀂訴梨園事開元夢一塲髙房山􅀞扇結屋清溪上仙凡此路分終朝㸔不厭唯是滿山雲惱啼鴉朝啼人盡睡暮啼人厭聞非􅀜毛羽􅁖不入鳯凰羣代毛延夀褒姒故事豈謂黄金少除哀君未知古来因好色㓕國是龍􅄔捕魚圖􅀞出溪􅁁景渾家在捕魚筆頭餘興在㡬􅀧暮鴉踈晚望東村開門見東村晨光尚䝉昧白雲何䖏来適興予心㑹題王大年􅀞舟楫爲生計沙鷗識此情百年浮世事九􅂦一絲􅁿林子山􅀞爲鄭宗表題尊前可忘世綸竿􅂓伴身樂然溪水上魚鳥與相親􅀟蝶相逐䨥飛蝶風前不自持有生皆有感微物豈無知白練􅅁禽一􅀟白練􅅁繞􅀣效于飛冝爾閨房喜圖形上綉衣秋棠喚思圖兩雀晚相依棠梨葉漸稀連枝有深思未可便辭飛梅詩十絶種梅如昨日􅀣已過人長粉白東隣女争窺出院墻小玉探春囬褰􅄕咲語来今朝庭􅀣上忽有數花開黄鍾􅅻應律英蕚已舒芽不咲黄金栁先開白玉花漢主黄金屋盧家白玉堂暗香浮動䖏愁思月昏黄一枝憐似玉日暮正愁新寂寞真珠佩天寒翠䄂人數􅀧飄香雪非􅀜􅀞角吹驚心調􅂦事細雨緑隂時雪落窓紗外寒梅正著花不同桃李􅀣争艶五侯家新月囬宫簷梅粧艶扵雪誰謂五出花能加天下白姑射有䖏子雪色而内視肌粟寒不生香篝熏素􅀍􅀣老苔衣厚花稀春事遲為縁生驛路都是拆殘枝題􅀞筆墨生幽思山居春日長獨謡橋上路亦自惜年芳夜坐夜長春酒醒欹枕何曽睡時見燭花中餘光吐金穗題竹落􅇘生幽思風来自有香九天皆雨露容易拂雲長題西湖大佛頭寺佛身滿法界金色從地􅁸􅀂人加粧嚴其福亦如是題枯木石圖石氏􅃢瑚􅀣楊家翡翠鈎千年風雨後遺影海中洲青山白雲圖俗駕是難到滿山都是雲雲中有樓觀鸞鶴日相親題􅀞山水溪逥岸影深山逈溪聲響獨有溪上人扁舟自来徃題諸􅁑孔明像一􅀏出􅂭中黄星掩日紅妖氛不敢作白羽起西風詠鷄鳯凰有五色鷄亦有五徳鼓翼不妄啼一聲天下白
