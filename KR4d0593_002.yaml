front:
  text: 張光弼詩集卷之二
  hash: sha256:2eaea0c55d98db1727cc63f23017320b2e25f85c3815d84f3d57948dfc292fba
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_002-1a}
body:
  text: 古風七言河漢篇河漢亘天幾萬里鶉火西行入箕尾金氣浮空漾白波任是雄風吹不起一河之水皆空青往還唯此烏鵲翎太史不識漢使者却奏張騫為客星載回織女支機石牽牛隔河來不及二十八宿有常經七夕胡能㑹靈匹西牛東女長相望女則織絍牛服箱人間兒女謾愁思河影不滅秋夜長唐太宗駿馬圖昭陵石刻今無有絹素乃能存不朽當時竒骨濟時艱駕馭盡入天人手隋家再世俱凡庸不知肘腋生英雄晋陽奮起六駿馬蹴踏人海波濤紅帝王一出萬邦定干戈四指羣小空凌烟勳臣盡圖畫一旦肯遺汗血功嗚呼何從得此樣規模却與石刻同乃知帝王所駿乃龍種豈可求之凡馬中唐家開基三百載展卷尚覺來英風張建封擊毬圖唐家風流尚毬馬中外靡然為之化徐州莭度張建封坐領東藩示間暇長簫短吹行相隨以此慢逰為日夜玉山滿馬扶醉歸正及樓頭望春罷孔雀屏帷次苐開黃金買得春無價不教白日向西馳只許黃河向東㵼使君死後誰登臨燕子不來風雨深緑珠甘守珊瑚樹文君獨宿鴛鴦衾當其意氣傾朝野肯信人無百年者萬言猶在從事書一幅空遺後人畫五王行春圖開元天子逹四聰羽旌管籥行相從當時從駕驪山者宰相猶是璟與崇華蕚樓中雲氣裏兄弟同眠復同起玉環一旦入深宫大枕長衾冷如水興慶池頭花樹邊梨園小部俱嬋娟楊家姊妹夜遊處銀燭萬條生紫烟寧知樂極哀方始羯鼓未終鼙鼓起褒斜西幸雨霖鈴回首長安幾千里贈河南衛畢將軍歌壯哉將軍八尺軀陳前奪騎生馬駒有力每輕弓兩石據鞍手橫丈二殳小敵如怯大敵勇生平氣與忠義俱逢時受命從大將執合風雲興海隅奉辭東下尉陀國回兵北擊無單于望風襁負至者衆將軍為駐南征車歸來九重賜顔色蹈舞恩光生步趨團花戰𫀆出內府大官羊膳來公厨洛陽關東古重鎮授以斧鉞專城居緑槐髙映使者莭黃金新鑄兵家符握手負看走壯士擁蓋吹笳喧道塗盡知勳名在忠義千騎萬騎先傳呼祈連亦有霍去病細栁豈無周亞夫只今將軍與之並人馬相輝古迹無君恩廣大法天地將軍報答將何如丹青或接萬億載忠義莫虞無畫圖送程希道回河南銀鞍白馬郎自是平臺客海木桑田不自知朅來二紀異南北他鄉忽然顧我笑有如清風灑蘭雪開心寫意慰離居别時童孺今有鬚知從馬援在軍旅不謂陳琳工􅊾書我于程家最知舊大宅修椽曽置酒玉攢紫笙吹鳯凰羅䄂春衫舞楊栁因之感念二紀前躍馬射麛江水邊煌煌賔從散秋葉疊疊樓臺成野烟程生程生既㑹面𬞞麻瑶華莫持贈但存此日㑹面情地北天南有相見丈夫有志豈陸沉使者不憚巖穴深他時或有公車召嗣我雲間金玉音贈製筆生許文珤許生精藝誰可及材用剛柔以製筆水盆洗出紫兔毫便覺文章生羽翼䝉恬將軍為動色為是秦王舊時物丞相斯曽從駕行載此篆書封禪碣從秦至今幾千載兔尚存皮竹可採利濟天下功不有入手千人萬人愛我昔為郎居粉署用筆唯于許生取輕衫日對紫薇花寫遍江淹夢中句夢雲樓為佑聖道士王景舟賦阿母妊娠曽夢雲道人見雲如母存髙天悠悠不可聞虎豹守關深九門丹青樓館雲中起翠幕銀屏接雲氣縹眇時聞子晋笙蹉跎日集王喬履蟠桃千年花又開雲中不見阿母回丁令白鶴有再至漢宫青鳥無復來但願無風亦無雨桃花開遍夢雲處花氣騰空結紫雲拔宅乘雲上升去玉局生引龍翔住持毛起宗參隨鶴駕謁九重冲虛教主器許之名以玉局髙其風贈言五十有六字盡說大羅天上事老君出現成都時地神湧局亦如此空歌黎羅還上清再三祝付玉局生吾徒𬒳服老君教母忝玉局之所名名非可名局非局心田種熟藍田玉入水不濡火不焚一氣孔神無斷續况聞古有毛仙翁是身雖異性則同華表白鶴猶未歸函關青牛今則逢道家宫植連雲起日食仙曹千萬指誰其主者玉局生宴坐無為觀太始白翎雀歌烏桓城下白翎雀雄鳴雌隨求飲啄有時扶起天上飛告訴生來毛羽弱西河伶人火倪赤能以絲聲代禽臆象牙指撥十三絃宛轉繁音哀且急女真處子舞進觴團衫鞶帶分兩傍玉纎羅䄂柘枝體要與雀聲相頡頏朝彈暮彈白翎雀貴人聽之以為樂變化春光指顧間萬蘂千花動絃索只今蕭條河水邊宫庭毁盡沙依然傷哉不聞白翎雀但見落日生寒烟捕虎行碧油幢下曹司兵見義有勇身為輕平生每得貴人喜有似花卿知姓名一朝共聽將軍令鎮市臨平虎尤甚汝司其兵往捕之食肉寢皮須要盡司兵受令即出城怒氣填膺風火生揚言大明聖人既御世爾虎何物猶縱橫大刀長㦸屯村堡前期釘牌為斷道村堡喜得司兵來萬夫鼓勇千夫譟半月捕獲十三枚大檻小車推載回自言此乃將軍令是豈小人之力哉將軍索酒指其虎此虎不死司兵死在官食祿忘其軀亦是人間好男子資夀堂為之醫藥以資壽古人存心子能有治生若然天必與衣祿何憂不豐厚潘彛世籍富豪家金珠斗量錢載車百年風雨換門户甘守儉薄為生涯法依本草為炮削修合肯教違矩矱日月回旋碾上輪虎龍交媾爐中藥服之一劑神氣全百齡夀等金石堅洪範五福壽居首有金無壽真徒然彛也性禀芝蘭秀湖海香名喧衆口修文坊南當大街如斗之字出髙牌貴人長者共祗重每日門前鞍馬來望雲詩為翼城常盤賦風吹白雲天上來遊子望雲心眼開小時見雲在親側安淂親同雲往回世家翼城桐葉里雲自往回親在彼昔年捧檄為榮親淂官拜親雲亦喜所憐得祿逺莫分委質為臣命在君青𫀆駿奔各有事斑衣兒啼更勿云我知爾家廣田宅小弟朝朝縱圍獵暮歸雉兔滿馬鞍不使髙堂甘㫖缺望中有使頻寄書夫人堂上泣羅𥜗願爾長辭楊震金願爾長懸羊續魚親之念子無不至子思其親雲即是紅顔早受縣君封莫計同餐太倉米桐葉之里非一家如爾兄弟誰不誇墻頭風吹紫荆樹堂前露浥萱草花莫言親逺翼城縣萬里關河如對面一官九考今八年指日雲中又相見雲林歌李侯雲林心所仰既見雲林副心賞欣然為我出圖畫索我題詩畫圖上我自别侯二紀餘不得半𥿄廬江書乃知已膺廟堂聘梁棟之材寧不如雲林乃是若所植雨露蟠根同鐵石直幹慿凌御火霜青雲照耀郎官茟即今英發當盛年上林玉樹幕府蓮東閣梅花時自詠南郡官曹誰更賢從知侯家積隂德鳯雛七枚毛五色覽輝已出丹穴中來儀㝎集虞廷側安棲不用求梧桐雲林氣接扶桑紅結巢日邊長羽翼好音惠我雙飛鴻玉簫引為沈仲德賦洞簫宫前有狂客雙眼直嫌天地窄甕中釀熟葡萄漿飬得身輕好顔色興來為我吹玉簫縹眇一聲生泬寥驚鸞跱鵠不自㝎遊絲落絮隨風飄髙情逺思逰碧海此豈肯受王門招笑言學簫二十載家業凋零心不悔要須吹上鳯凰臺白日羽儀生五彩王無僞仙翁見訪為賦此詩神仙之術本無作當面無緣尋不著但能寡欲自長年愚者昧之求海嶽此術不許凡俗知道成由來非大藥仙翁髙風何所喻天垣月映王喬鶴等間瓦礫變黃金候爾相從步寥廓寄河南衛鎮撫趙克家叙舊程生河南來始得河南信雨散雲飛二十年萍蹤梗跡今才㝎却思小孤洲渚邊大江大浪拍戰船將軍鬚髯勁如㦸白日酣歌便醉眠我從别來贊畫省夫容幕與風塵逺洪武𥘉年自日邊詔許還家老貧賤池館盡付當時人唯存筆硯伴間身劉伶斗內蒲萄酒西子湖頭楊栁春見人斫輪只䄂手聽人論天只箝口年過七十髮未斑路途不辭牛馬走知爾出鎮在洛陽宫𫀆健馬日煌煌前騎大旗畫熊虎後騎長㦸橫雪霜我于此事别已久冨貴浮雲更何有鴻鴈得便時附書但問老人平安否題醉墨堂為桐江俞子中賦世稱草聖唯張旭氣主神光從所欲醉來提筆走風雷電掣長雲夜相逐健于大野戰蛟龍媚似輕波浴鴻鵠由唐至今幾百年筆法竟爾失其傳芝翁乃若神所授亦以醉墨題堂前晴絲罥空王逸老生蛇絆樹黃庭堅筆法不必問髙間法不必詢懷素縱橫遲疾心自知曽見公孫大娘舞雲門山房為青州曹伯起賦雲門山房何所指知爾不忘桑梓意山在城南百里間沃衍膏腴宜樹中有一村俱姓曹列㦸髙門是鄉里青州舊入齊封彊相國猶傳漢家世曹彬為宋下江南史冊能書共門地四世之祖在元𥘉遭際風雲致爵位赤參丞相下豫章腰插金符位元帥但知報國守忠貞不肯隨人事軒輊用也綽有乃祖風一簣不止山可崇碧梧枝老自棲鳯緑竹根深須化龍昔時未到山房裏每望雲門候佳氣却緣亦是豫章人客舍并州如有喜雲門之山青接天鴻𪷟既判知何年山房去天不咫尺名與雲門當共傳贈秋鳴善捧􅊾迎母往金蘭州就飬人子能不念其母嗚嗚啞啞猶返哺十月褱娠乳抱勞亦期仰事慰遲暮那知中道母子分南望親舍唯白雲伯也執殳在軍旅堂上消息空傳聞將軍命許迎就飬拜捧檄文喜無量蘭州萬里到杭州母見子如墮天上膝間乍見歡復悲天河水流有合時宜男草是别時草老萊衣是别時衣只今四海車書一人間萬事真難必十年戎馬行陳間子母團圎有今日題湖州何生售書飬母詩卷衙散到家無與適領客壺觴以終日何生忽從湖州來當筵不語惟長揖古貌存心行孝道䄂出舊書三兩帙進言售此􅊀甘㫖有母行年將八十吾聞此語為太息傷哉貧乎乏朝夕龍蛇蟄藏天地閉宜爾之賢身不立莫說家無田可耕縱有田耕那得食不如歸掉湖州船有魚可釣鳬可弋君不見賣刀與賣㦸朝持出門莫得直文章本是太平具以此干人復何益軍中或有錫類人傾産酬書吾可必東圃詩為道士王景舟賦東圃軒在玄武宫海日欲上烟霏紅若人餐之百體充飬得面貌如嬰童上清有法授有宗靈章祕呪存心胸一氣孔神天與通右衛白虎左青龍擲火萬里行老翁欲雨即雨風即風燮理造化代天上事親則孝事君忠神人執鞭須相從題王朋梅界畫大都池館圖樣元朝人國𥘉以來好時莭冶緑妖紅蓋阡陌樂遊盡是勳貴家人閙馬嘶聽不得細􅃮䦨干輦子車同載女子如蕣花車中馬上目相許胡蝶夢滿東西家牡丹臺畔夜如晝花照銀燈大于斗正月飲到三月終樂地歡天古無有一朝花謝春復歸門鎖池園空緑苔簾前塵覆珊瑚樹案上蝶棲鸚鵡杯豪華盡逐東流往百年丹青化草莾當時命酒徴歌人此日題詩圖畫上題畨使進呈三馬殿中得名畫畨馬筆力不在陳閎下方其畨使引進時詔許當軒對描寫近前一匹白鼻騧咫尺天威生懼怕苐二匹馬青連錢矯首嘶鳴意間暇向後赭白馬最雄霧鬣風鬃勞握把三馬既出瀚海空天廄真龍此其亞畫師貌此良苦心慘淡精神入夷復冥冥雷雨晦大河漠漠風沙連巨野諸畨服飾本華靡不獨丹青侈圖畫百年絹素霜雪新拂拭徒為發悲咤莫言世有真乘黃只此按圖誰識者天馬歌天曆間貢天馬來自茀郎國足下風雲生倐忽司天上奏失房星海邊産得蛟龍骨軒然卓立八尺髙衆馬俯首羞徒勞色應北方鍾水德滿身日彩烏翎黑縱行不受羲和轡肯使王良馭輗軏黃絲絡頭兩馬牽金鐙雙垂玉作鞭寵榮日賜三品祿不比衛鶴空乘軒大國懷柔小國貢君王一顧輕為重學士前陳天馬歌詞人逺獻河清頌鑾旗屬車相後先受之却之俱可傳普天率土盡臣妾聖主同符千萬年贈楊彥臣使還宋楊通寅祭酒十四世孫元武岡總管外孫使莭何煌煌騎從造我門自陳世有通家舊武岡太守之外孫佼哉舒侯賢宅相執禮愈恭辭愈降老夫已是閉關人甚厭傳呼到閭巷須㬰驚㝎還復悲挽生近床為抱持爾外大父強健否此來殊慰我所思黔陽到浙七千里相問相看疑夢寐祥符年貶祭酒公安江之陽無乃是自從隔却蒼梧雲隻字片言無得聞車書既同四海一逄人每問舊參軍立談知生具才美金鍾大鏞莫與比池上曽聞咏鳯毛詩中又見歌麟趾當今聖德乃海隅龍馬出圖龜負書直言治安容賈誼喻蜀父老煩相如心存忠孝在年少縣官勸駕能應詔得時舉步即青雲瑚璉從來在宗廟織錦詞行家織錦成染别牡丹花紅杏花白作雙紫燕對銜春一匹錦成過半月持來畫堂捲復開佳人細意為剪裁銀燈連夜照針指平明設宴章華臺為君著衣舞垂手看得風光滿楊栁蝶使蜂媒無㝎栖萬蕊千花動衣䄂回回舞罷換新衣新衣未縫錦下機憐新棄舊人所悲百年歡樂唯片時贈趙希哲還河南仍寄其父太醫趙生幼小辭鄉里長成却自河南至風流籍甚芝蘭室文彩粲然瑚璉器懋遷不憚萬里遙魚鹽歲逐啇人利杭州舊是繁華地輕薄相逢增意氣愛生不登酒家樓重生不逰花栁市秋風八月栁葉黃束裝别我還洛陽樓船大帆髙十丈順風一日到髙堂髙堂雙親應有喜寶貨既豐兒亦至㝎呼斗酒出屏帷膝下相歡復相慰自來隂隲富人家廬山董奉非徒誇拜罷而翁煩問訊好種門前仙杏花蓮塘曲青蘋風起蓮塘水波聲夜聒鴛鴦睡一點芳心不自持露荷又作􅛔珠碎藕絲織錦香滿機裁成衣裳將遺誰只愁賤妾夢魂短不恨蕩子歸來遲花間鶗鴂依芳草等間緑遍邯鄲道還應憶念蕩舟人滿架芙蓉鏡中老過歌風臺世間快意寧有此亭長還鄉作天子沛宫不樂復何為諸母父兄知舊事酒酣起舞和兒歌眼中盡是漢山河韓彭受誅黥布戮且喜壯士今無多縱酒極歡留十日感慨傷懷涕沾臆萬乘旌旗不自尊魂魄猶為故鄉惜從來樂極自生哀泗水東流不再回萬歲千秋誰不念古之帝王安在哉莓苔石刻今如許幾度秋風灞陵雨漢家社禝四百年荒臺猶是開基處讀易處為俞文輔賦易經四聖人之事潔靜精微惟此書夫子五十以學易爾今讀易年何如易之為書廣大而悉偹不以一言一事拘君子觀象玩辭處近取諸身而論諸按文責義而有得斯乃萬方之二隅履德之基謙德之柄復德之本恆德之固損德之修益德之𥙿困德之辨井德之地巽德之制于此九卦能體驗可無大過為德符讀易于斯而自勉仰觀俯察非吾徒羲文周孔雖既沒天人其不在兹乎風木歌為禇本中賦并寄徐一䕫記禇孝子感風木樹猶如此親安在歲月去人何迅速陟岵陟屺望不及入室升堂成宿昔劬勞未報棄諸孤號泣旻天涕沾臆走獸聞之失其羣飛鳥聞之墮其翼物之感也有如此冝爾諸孤哀罔極始豐先生辭餘力文章今擅歐蘇茟記成不忍再三讀未及終天語嗚咽乃知人皆有父母天性油然非染習孝思不匱永錫類草偃風移而俗易三復始豐記擊莭為太息往求二本之所在果然拔地俱千尺孝子之父見手植造物于斯有隂隲君不見東坡所記三槐堂魏公德符在他日送馮以清知事赴成都右衛幕府李白苦歌行路難以喻世途之難有如是莫言難上于青天時至青天是平地五等之爵國所司萬鍾之祿人所兾為臣忠實而不欺畫像式接咸可至石樓先生舊簮纓出宰三綬郎官貴即今任政成都幕萬事只應咨伯起葵藿常存向日心鯤鵬㑹展垂雲翅玉陛承恩咫尺天官船給驛八千里三峽盤渦轉殷雷萬壑啼猿響空翠相如擁傳喻蜀時縣官負弩爭趨避况爾旌旗出入間丈夫足展平生志讀杜拾遺百憂集行有感余生行年將八十不知何者為憂戚冨貴不驕貧賤安以此存心度朝夕往年承乏佐中書大官羊膳供堂食只今賜老作編氓衣食信天無固必陋巷簞瓢如素居不管茅茨春雨濕門前載酒求賦詩錦軸牙籖日堆積在官不置負郭田既老翻得稽古力毀譽都忘月旦評姓名不上春秋筆朝米不煩鄰僧送暮米不煩太倉糴我亦一飯不忘君文人相輕所不及傷哉白首杜拾遺入蜀還秦勞轍迹文章蓋世亦何為妻子相看百憂集西溪栁送人赴京西溪栁自是風流樹受用春風好媚嫵長條折盡還復生如何免得人來去千樹萬樹接郵亭到官五見楊栁青百年行路有離别三月飛花惟送迎知君母留彭澤縣門前五栁都栽遍密葉能藏返哺烏柔條不礙雙飛燕膝下長懷萬里心風光滿眼瞻上林請羔遺母應有賜咫尺龍墀恩露深題華光梅墨梅之作盛衡湘始作俑者惟華光此僧平生千萬𥿄茟力所到花為香是誰好事憐清苦三二百年存絹素和靖多情縱有詩廣平得意還能賦東坡先生昔倅杭萬松嶺見一枝長我今見畫如昨夢都在君家白玉堂題劉松年畫張志和辭聘圖長安城中晨鼓響馬後紅塵髙十丈吳儂為爾去烟波卧聽樵青間蕩槳醉來即唱滄浪歌平生志願今無多鷦鷯不巢上林樹鸒斯不啄玉山禾是身眇焉寓天地何殊太倉之稊米野人本乏濟時策孰為要君徴不起所以漢光武不強嚴子陵放歸江湖從所志千年萬年呼客星聖人在位麟鳯在野洛既出圖河復出馬普天率土遂其生四靈咸集依至化唐堯垂拱而在上禹稷憂勤而在下當時天下所不臣亦有臨流棄瓢者題三友圖劉文學如冠玉平生所性在擇友友此梅花與松竹後凋莫問歲寒心眼中且得無塵俗顧兹欎欎在徂徠瞻彼猗猗在淇澳更有江南萬玉妃暗香吹遍湖山曲三友地逺莫致之收拾畫圖歸一幅竹為君子松大夫梅則佳人在空谷從他坐客寒無氊只此可以伴幽獨君不見玄都觀裏千樹桃盡是人間間草木貞婦詩諸暨縣有吳氏女十五嫁作蔡家婦十六生兒夫即亡日抱呱呱為乳哺情知身是未亡人善事尊章猶父母盡拋粧具洗鉛華盡棄羅𥜗服荆布蓬首釐居八十年孤子有孫孫作父采蘋采藻共祭祀嗃嗃家人無間語婦人言行止閨門懿德何由出庭户憐哉弱孫蔡光祖再拜請求鄉曲譽魯恭沼縣車馴雉劉昆作郡河渡虎承流宣化物為感况乃觀風行繍斧母今行年九十六人夀百年餘幾許門前滄海變成田屋後白楊堪作柱寒鴉猶帶昭陽日銅人亦霑未央露古傳生女作門楣貞莭之褒誰不慕聖恩浩浩如江河母息厭厭迫朝暮早將封事謁天閽為母一擊登聞鼓送蔡孝亷回侍母暨陽有蔡宗盟府能以力耕事其母懷橘之名早已傳分椹之心壯如故我嘗使驛至其家有花有栁當門户雖非郭泰可榆栁且有茆容具雞黍暨陽之邑鄰上虞大舜遺風尚千古蔡乎蔡乎清川既東不在西白日過時不再午楊雄愛日著新訓甘㫖溫清不厭斁人皆有母我獨無西望同安心更苦汝歸何以獻髙堂遺汝瑶華慰遲暮軍中樂送征南掾史張毅赴京我嘗軍中行從知軍中樂髙牙大纛啓征途風雲隨護軍中幕千乘萬騎指顧間環而居之乃城郭五更觱篥吹一聲旄頭驚向天邉落捷書日夜報天子親筆敕書加寵渥刲羊宰牛餉壯士萬歲歡呼震天嶽大斾悠揚錦萬重從伶窈窕花千蕚男兒墮地志四方蓬矢桑弧為有託風順鴻毛易寥廓只今沿􅊾登大府鷙鳥之中瞻一鶚渭城且莫唱陽關舉杯為賦軍中樂李龍眠畫飲中八仙歌龍眠白描誰不賞胸次含空生萬象茟下猶存小象文落𥿄烏絲幾千丈小時讀歌心愈竒此日按圖神始壯浣花草堂老拾遺詠彼八仙將自放天寶年來萬事非得醉如逃三面網鳯鳥鳴岐縱德輝麒麟見魯辭羈鞅丈夫骯髒迹每同孰謂龍眠成技癢眼中未見􅍦醒人未免開函為撫掌義株行廬陵江西古名郡四忠一莭之故鄉豈唯英賢間世鍾造化亦有義株連理呈禎祥豐塘三山兩株樹托生離立不數步髙徑擎天一蓋張深根走地羣蛟怒曽氏世居株樹邊詩禮傳家三百年尚書既為連理詠丞相復入郡志編二公真跡今猶在文光照耀無年載李囦諸孫尚有傳桑田誰謂成滄海五世孫亦一老翁欲以此事徴盲聾豐塘之株母乃豐成劔變化偃蹇雙蛟龍不然安得保風雨專與三山為始終懷逺亭詩為東甌鎮撫談濟翁作談世𦣱之後宋史有傳談將軍勇而禮宋之端明學士七世孫早年身逐兵塵起鼻尖出火耳生風馬上飛塵虎添翅出門志願㝎逺侯果然持莭鎮東甌上宣德意化海俗鯨鯢滅迹波為收古來鎮將還如此緩帶輕裘接賢士襄陽沉却峴山碑水底魚龍猶識字國家承平千萬年軍中之樂何可言大牢五鼎餐壯士從伶百戲陳廣筵山川不隨人事改端明丘壠今猶在亭名懷逺乃在兹地下幽魂有光采普天之下皆皇家故鄉何必懷長沙人臣受命無逺近河源曽泛張騫槎食君之祿治軍旅咫尺轅門誰敢去私情丘壠豈不懷日夜沅湘水東注學仙曲二八女人貌嬋娟杏花隂裏競秋千同心錦帶刺石蓮逄人學繫剪刀錢却妬鴛鴦沙上眠
