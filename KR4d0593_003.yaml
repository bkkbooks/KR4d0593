未消床上一壺堪獨酌風流不减霸陵橋間居春盡幾日春殘不在家階前開遍粉團花再看又是明年事酒滴東風惜歲華題淵明像典午功石等羽毛區區州縣亦徒勞折腰五斗無人識只有歸來最是髙升仙壇壇上春風長紫苔當時仙駕此徘徊山中老盡千年樹化鶴何因一再來題王若水畫翎毛喔喔雄鳴趂曉光豈同雌雉在山梁雲中鷹隼無虛爪羽翼低飛好自防東風吹水碧漪漪不放桃花自在飛莫怪野鳬驚不㝎溪頭弋者未忘機題道士王東甫圖畫金銀樓閣在三山東甫何妨屢往還信是神仙在平地鸐飛元不離人間寄報國寺渭清逺上人時張氏築城誰說嚴關一兩重直教隔斷白雲蹤城中何限蕭家寺不把三間事逺公桂花仙子圖秋雲幾片剪衣裳吹盡西風骨更香明月不應生洛浦又添情思惱陳王船過臨平湖船過臨平欲住難藕花紅白水雲間只因一霎溟𪷟雨不得分明看好山寄三塔寺寬虛海望見寺前三塔近老夫指擬駐行舟無端一陳東風雨吹過湖南不自由凌霄花天女天花一樣嬌凌霄挽下最長條生愁化作空山雨滿臉春紅恨未銷題新亭壁為愛亭前金鳯花風吹滿地散殘霞清樽團扇能相伴飲到海天秋日斜題修竹士女圖䄂卷香羅日又曛寸心都作錦回文莫教吹動參差玉驚斷陽臺一假雲題左司壁春樹團團日未斜東風滿地散青霞曉鶯啼過落花雨獨立淮南宰相家題王若水畫萱草花開日又西太湖石畔鷓鴣啼竹枝不是江南曲唱得樽前思欲迷題唐十八學士圖堯舜之道載方冊人存政舉又何疑肅容斂手慚色者知是當年封德彛題趙子昻浴馬圖真是房星夜降精雙瞳下照水波明浴回有翼應飛去萬里風雲是一程風馬時清天地息烟塵騰躍乘看自有神逰牝委龍求作種任渠風合向天津嘉禾湖上為謝參軍題扇鸚鵡杯中紅麯酒鴛鴦湖上黑油船南風吹入荷花蕩借與間人一醉眠明皇對奕圖漏盡宫壺日晷移君王猶自戀殘棋馬嵬一著無人算只有楊妃自得知題楊妃橫玉圖天寶年間好太平華清小殿稱人情如何玉笛才拈起便作風吹别調聲春日遊湖神仙不死今何在冨貴能全古亦難賸買蘇公堤上酒莫教容易度春寒題白玉蟾像白玉如蟾俱是妄青天指月亦非真武夷洞裏曽相見却是尋常劈篾人詠何立事宋押衙官何立秦太師差往東南第一峯恍惚引至隂司見太師對嶽飛事令歸告夫人東窗事犯矣復命後即棄官學道蛻骨今在蘇州玄妙觀為蓑衣仙舊作衙官身姓何隂司歸後記仙魔視身已是間軀殼一領蓑衣也是多謝太傅謝安德望重南朝妓女東山未寂寥若論漢家勳業事何如笳鼓霍嫖姚四果畫照眼紅綃未十旬西風又拆錦苞新石家金谷如長在儘有明珠換美人石榴漢帝求仙不自知祗慿青鳥使瑶池矮人不見東方朔肯信三偷是此兒桃實葉底纍纍黃漸深暖風四月熟幽林記曽摘遍西園樹好似文君取酒金枇杷廊廟嘗新內厨酪粉賜金盤白頭見畫成惆悵滿朵春紅不厭看櫻桃效唐僧無則詠物詩四首巧作春禽百樣聲似矜觜舌有餘輕若為賸有間心性何不雲中學鳯鳴百舌禽褵褷羽翼作羣飛殘害溪魚欲自肥滿膆腥涎吞不下為人長忍一生飢鸕鷀鳥木茟花含曉露濃似將才思擬春風若還開在江淹宅夜夜題詩入夢中木茟花小小紅絲疊絳霞叉頭玉燕共年華果然買得青春在儘把名園種此花金錢花紫菊應為揚州舊使君雞冠顔色染歌裙陶翁每日東籬下誰肻花前問紫雲唐太宗遣御史蕭賺禊帖圖君臣詭遇一呆僧禊帖雖來事可懲誰料萬年歸殉後却將繭𥿄纍昭陵宫廊雪霽圖馬逺畫畫在丹青事亦非碧山猶自繞朱旗分明黃屋宸遊處千步宫廊雪霽時東坡笠屐圖從來涇渭不同波得貶黎中幸已多莫把丹青論笠屐文章千載一東坡杜宵畫圍棊圖何事今朝懶畫眉深宫又是日長時間愁不用量紅線看取新添幾著棋雨晴薔薇正開雨弄晴狂蜂觸處亂紅英韓朋莫作雙飛蝶泊在其間畫不成曉起杏子花開桃蕚紅夜來踈雨過簾櫳風光雖是好時莭春在誰家絃管中松瀑圖石間激浪雪無迹松下瀑流雷有聲百折狂瀾非是險人心方寸最難平寒食錢塘江上逄寒食逺客今朝轉念鄉幾樹落花春寂寂數行回鴈草茫茫孫鍾設瓜圖三士慿空化鶴羣已將旗蓋兆三分劉家門外樓桑樹豈是荒唐䜟所云嶽林寺題兜率內院為玘石心上人賦兜率天宫內院開錦衣彌勒笑盈腮因緣未了兒孫債此是重來苐幾回聞夜潮潮到江樓月到遲百年心事有誰知床頭尋得劉琨劍舞向秋風惜舊時張橫塘畫竹枝萱草幾宵明月竹枝好一夜東風萱草長悵望美人烟水闊不勝清思繞橫塘荔枝畫為福建張惟逺僉憲題濟南人尊前人出玉芙蓉纎手親分荔子紅歸到大明湖上宴也應看畫說閩中茜羅輕褁玉肌寒吹盡南風露未乾一寸丹心無與寄為慿圖畫入長安紅塵一騎露華香不管盧龍道路長誰信御前供玉食不呈妃子不先嘗六月南風荔子丹皺紅小碧滿銀盤水晶細嚼甜于蜜滿口生香玉露溥剪花士女咫尺芳叢艷色深蜂情蝶思兩難禁看來莫用間惆悵剪下春風一寸心趙仲穆人馬圖廄吏牽呈御苑廽開元毬馬盡龍材趙家富有曹韓樣摹出承平氣象來劉曜卿畫折花宫女栁風草露欲霑衣又是宫中上直時好把桃花都折盡免教吹作落紅飛錢舜舉畫芙蓉木末芙蓉最耐寒等間不許世人看蛾眉淡掃朝天去自採花頭製道冠梅花水月仙子畫遊魂非鬼亦非仙慿附梅花度歲年欲向姮娥訴孤另浪中亦自少團圎招周德新貟外觀菊明朝莫問晴和雨騎馬能來看菊花豈是省郎無酒對不如此處似陶家題扇士女轉深文字轉多情侍女常將筆硯行恐淂玉臺新樣句為題團扇贈卿卿湖中即事湖栁湖波盡可憐不知春在阿誰邊滿頭翡翠雙鬟女細雨吳歌濕畫船挾彈遊騎圖趙仲穆畫玉臂雙揎據綺鞍渾身俊氣要人看若知稼穡艱難事肯把黃金鑄彈丸李白應制圖明主憐才赦酒狂不知力士賤文章當其醉草清平調肯信長安是夜郎杜甫上謁圖出當天寶艱難日歸拜拾遺行在時入蜀還秦底心性一篇長拜杜䳌詩寄逺詞夢裏關山覺後非憂深别淚在羅衣堂前種得冝男草正及春香人未歸臨安訪古十首石鏡臨安山中古石鏡曽照錢王冕服來天遣紫苔封褁後等間不許别人開婆留井錢王𥘉生時將棄井中婆奮留之故乳名婆留既貴以鏐代留字舊日婆留井未堙石䦨苔蘚上龍文而今率土俱臣妾莫願皇天産異人功臣塔峯頭石塔表功臣五百年前是佛身莫問蓬萊水清淺野藤猶蔓劫餘春錦溪錢王功業與天齊百里旌旗照此溪從自波中鋪錦後至今光景淨無泥化成寺錢王苐十九子出家為僧賜號普照大師王子能以身施佛何異生居淨梵宫弊屣視他間冨貴男兒到此是英雄衣錦山令縣治主山是王故居即九龍堂還鄉滿山都覆錦冨貴應須白晝歸設宴九龍堂上日沛中歌後似王稀將軍樹王平時率羣隊狂戲此樹還鄉以錦幪之號錦樹將軍將軍官重執金吾不比秦朝列大夫王為錦衣歸故里遂令老樹有稱呼環翠閣今為寺謝安逰處東山尚存環翠閣謝傳逰來經幾年可是舊曽携妓到粉香猶在畫欄邊淨土寺東坡作杭倅行部過于潜回祥符額賜海㑹寺四百年來彈指過試問竹林橋上路往還曽見幾東坡九仙山王謝舊遊東坡有詩仙子何年化鶴羣至今名姓只空存我來欲訪前朝事悵望九山唯白雲鴻溝天命何曽分椘漢自將南北限鴻溝當時應恨烏江水不與君王照白頭李白小像承制摛毫玉殿頭清平樂府擅風流名花傾國能相妬得寵翻貽失寵憂桃源圖幾樹桃花認未真又何分晋與分秦漁郎不悟避秦者便把興亡說與人蘇卜小墳上作在嘉興縣前晋名妓錢塘人有詞行于世今為人家占矣香骨沉埋縣治前西陵魂夢隔風烟好花好月年年在潮落潮生更可憐宋贊善以笻竹一支并詩贈玘太朴次其韻庸蜀之西一竹笻年來帨首已如龍扶登春殿談經後風雨時生掌握中題藏祥卿畫露桃風栁兩依依畫在丹青亦自竒若在墻頭并驛畔過春都是折殘枝問蕳夷道索冬筍僧家嗜笋如嗜肉滿腹生香貯寒玉肯信湖州太守饞飢來煮遍千林竹徐一䕫以自已小影代送塤上人回龍門寺為題其上總是三生夢幻身又何分别假和真縱饒送到龍門寺也只丹青畫裏人邵庵虞先生為張伯雨賦四詩開元宫道士章心逺求追次其韻伯雨畫像號勾曲外史此畫茅山苐幾真翛然白氅鶴翎新百年最在歸歌詠一代交遊在縉紳懷舊憶誦清江空舊魚流光如赴隙中駒雲沉華蓋星沉海思絶狂張與老虞丹井今在佑聖觀東圃張仙于此煉丹砂夜夜丹光照井華猶有石欄遺刻在將軍移置羽人家澗阿碑邵庵文字在堅珉摹刻中郎茟畫真在日得錢除買酒餘資都付打碑人贈人逰湖南世途無處不通津惟爾棲棲志未伸莫過沅湘唾江水此中曽有汨羅人趙子昻畫花鳥綺紈舊習信難移得意青春正好時直下玉廬無所事試臨花鳥學徐熙
