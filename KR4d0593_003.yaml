front:
  text: 張光弼詩集卷之三
  hash: sha256:d5b30859be4a2bf00c10f0b7b200f69d466d3195573e25980ef5e0d3cb62c247
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_003-1a}
body:
  text: 七言絶句題孔明抱膝圖抱膝長吟彼一時卧龍消息有誰知能聴天下三分計頼有劉家大耳児題羲之寫扇圖蒲扇新題墨未乾也應技癢要人㸔阿婆莫謾提籃去明日街頭冩便難訪舊三竺次泐禅師雜興韻但教懐抱能傾倒莫向尊罍計有無不為訪僧三竺寺肯乘烟艇過西湖酒舘湖船盡有名玉杯時得律閑情至今人說張貟外不是㸔花不出城為同峰講主題風烟梅二畫長林春早玉烟新未許風光殿後塵留得維摩方丈在碧紗遮護散花人髙坐天人白玉床袈裟都是素毫光東風也自知消息故故吹香入道塲題墨梅一點嬌飛傍鏡䑓曽随咲靨貼宫腮如今莫説顔如玉何限風烟馬上来白描杏花小樓春雨賣花時盡説京城好女児有茟何應描不就况兼紅粉不曽施白描水仙花月下歸来㸔未真烏絲㡬縷欲生春莫教縞帶随風逺留綰明珠贈洛神荔枝畫一勺瓊漿貯絳霞好招鸚鵡過西家若爲觧得相如渇免向金莖乞露華題十八學士奕棋圖瀛洲風景最清真一代人材盡鳯麟莫道㴱山更㴱䖏傍觀都是下棊人五陵逰俠圖白雪肌膚白玉鞍渾身俊氣許人㸔若知稼穑艱難䖏肯把黄金鑄弹丸題桂花仙子黄金碎搗作㣲塵露染秋和色未匀回首瓊樓休悵望素娥元是月中人秌雲㡬片作衣裳吹盡西風骨亦香明月若教生洛浦可勝才思惱陳王題徽廟螃蠏圖閱盡蟲魚爾雅萹閑将藤素染蒼烟不知畫得招潮後艮嶽從教變海田長白山前謾㧞都清華小殿試操觚含毫應咲滕王拙不冩秋沙郭索圖題畫梅年年長與栁争春数點風前更可人待得緑隂成子後暗香踈影縂随身題明皇擊毬圖管籥聲随萬乗逰開元毬馬最風流九齡老去無人諫不破中原不肯休題黄花白蝶扇面一枝秋露染𥘉匀曽伴渊明漉酒巾若道夢中能化蝶飛来應是白衣人題大慈寺僧房老禅相見具袈裟旋汲新泉自煑茶咲問世間春㡬許東風開遍石巖花題紙瓶留别育王寺長老照大千朝市山林自一家要知縫掖即袈裟青蘋波上凉風起㝎到禅房㸔蕙花題剡漢夜雪圖雪月相􅌽過剡川芙蓉逺近玉生烟戴家亭舘多風致只好到門回酒錢題二馬圖缷却銀鞍得自由偶因鬃癢一囬頭青絲㡬尺無拘束曽控風雲遍九州春明仰首一塲嘶莫說河冰迸玉蹄曽與将軍同患難䓁閑平歩過檀溪江南曲阿姊却從何䖏来芙蓉有露濕香腮相呼相應棹船去知是鄰家闘鴨囬一束蓮莖學細腰塗金艇子木蘭橈東家姊妹西家去更約明朝去㸔潮贈琴士萬樹流鶯御苑西朝回騎馬醉如泥如今都向山堂宿聴得琴中烏夜啼小逰仙次韻四首漢武求仙未絶情枉将心力事金莖靈王太子因無欲吹得琅玕作鳯吟桂閣金銀不甚髙仙山㡬許隔波濤信囬青鳥無尋䖏一色春風是絳桃小娃莫説臉如蓮自牧羊龍向對田笑指清泠橋下水此中元是碧瑶天青蛇昨夜付書囬只許麻姑自拆開説道蓬萊山下路莫因清淺不歸来題鸚鵡士女圖長門㡬日㫁羊車閑得工夫坐日斜唯有舊時鸚鵡見春衫曽染石榴花題露荷風栁扇面猶恐丹砂染未匀波中影是鏡中身長眉盡向東風裏不許人間更効顰此扇當年定賜誰淚㾗猶自舊胭脂班姬莫用閑相詠次第凉風到汝吹秋夕紫藤滿架月華明一片凉風絡緯聲猶有西江未歸客倚樓因爾動離情過􅍩湖􅍩湖有路接天津萬頃銀花小浪匀安得滿船都是酒船中更載浣紗人過金粟寺看東坡竹東坡仙去三百載海上猶存丹鳯巢醉裏自将衫䄂下拂開塵碧㸔烟梢題凝思士女萱草花開一両枝薫風更是㫁腸時自家團扇無心把想得回文織錦詩題盧媪家誰似禇庄盧媪家開門繞屋是荷花收来麥把雲成垜繰動蚕絲雪滿車舡坊小小栁依依田舎人家儘自肥溪水受隂魚出躍薫風吹暑燕交飛過蕭山縣原野蕭條井邑虚居人都是刼灰餘橋邉猶有江淹寺不為題詩駐使車題呉綵鸞寫韻圖小點紅鸞欲下遲逺山渾似畫来眉如何一念人間事上界仙曹便得知同徐大章溪上㸔芙蓉日暮歸来雨濕衣涼風千樹彩雲飛渚宫只在秋江上何事襄王夢到稀宫詞次韻周貟外時様宫眉不甚長再三笑語問同房内園有約㸔花去稱得春衫繍鳯凰題左司壁省中莫説文書簡開遍杏花渾不知今日樹邊騎馬過滿衣春雨立多時題毛女一钁長随玉雪身女中還有爛柯人相逄好向麻姑説東海千年人化塵題東坡竹三百餘年屈指過猶扵餘墨見東坡雖然数尺黄州竹冩出平生直莭多題蘇小小像湖上行雲逐步移手携團扇欲何之鬢邊莫咲閑花草也是當時第一枝題蜻蜓蛺蝶畫扇點水穿花不自疑輕盈滿扇欲何之秋塘一覺風流夢又是秋香欲老時觀奕圖為楊左丞題局中勝負㡬回新盡在丹青亦損神莫把䓁閑銷歲月傍觀都是下棊人求仙辭漢皇承露鑄金莖别道雲間有玉亰萬乗旌旗不随去此身何用獨長生不見王喬馭鶴還祗應憔悴老空山何如脩取金仙法滅盡空花出世間荷花辭次韻周伯温參政朝霞染得好衣裳吹徧湖頭風露香身分可憐年紀小纎腰一束欎金黄少年慣服白硃砂飬得容顔過似霞生長六橋楊栁岸不知湖水是儂家莫訝呉儂説靚粧紅銷貼體肉生香夜来相伴縁荷葉受用滿湖風露涼一種西湖與若耶鴛鴦宿䖏便為家秋房結得新蓮子便是當時藕上花上元夫人辭阿母親曽與製衣手攀雲錦下天機自從宴罷茅君後寂寞龜壇㑹更稀瘦馬少盡其力老棄之此豈有意埋弊惟不如汗血陣前死以革就裹将軍屍栁枝詞尊前不奈小腰身争得攙先上舞茵多謝東風好擡舉盡情分付畫眉人春光領畧不勝嬌揺蕩東風千萬條悔盡江州白司馬一生空詠小蠻腰折栁枝愁向尊前唱渭城栁枝折盡贈行人蚤知世路多離别移在郵亭逺䖏生唐天寳宫詞十五首壽王妃子在青春賜與黄冠號太真不是白頭髙力士翠華那得逺䝉塵徹夜宫中按羽衣明朝冊拜太真妃鳯凰園裏承恩後從此君王出内稀興慶池頭芍藥開貴妃歩輦㸔花来可憐三首清平調不慱西涼酒一盃清源小殿合􅋽州羯鼓琵琶響未休為是阿瞞供樂籍八姨多費錦纒頭蓬莱前殿摘黄柑一色金盤賜内官㨂得枝頭合歡實畫圖傳與大家㸔玉笛當年是賜誰可教妃子得偷吹還家剪下青絲髮持謝君王意可知天子樓前百戯呈大娘竿舞㝡驚人貴妃獨賞劉郎詠牙笏羅𫀆色色新舁上児綳滿翠容黄裙髙髻一樷樷君王入内聞歡咲賜與金錢滿六宫四海承平倦萬機只将彩戯悦真妃不平㝡是弹雙六骰子公然得賜緋小部梨園出教坊曲名新賜荔枝香霓裳按舞長生殿撃碎梧桐夜未央共指雙星出殿遲並肩私語有誰知君王未出長安日肯信人間有别離香嚢遺下佛堂堦不使君王不愴懐想著當年雪衣女羽衣猶得苑中埋勤政樓中夜正長上皇西望轉悽凉侍児唯有紅桃在一曲涼州淚萬行龍女殷勤道姓名凌波池上乞新聲周公不入君王夢誰與蒼生致太平天寳年中寵賈昌黄衫年少滿鷄坊絳冠闘罷羅纒項又得君王笑一塲趍府燕子梁間漸有聲碧油窓外未天明長街官樹留殘月滿馬好風吹宿酲小寒花外東風作小寒輕紅淡白滿䦨干春光不與人怜惜留得清明伴牡丹涼思朝来風雨怯輕羅便覺􅋽秋意思多一夜不眠聮翠𬒳餘香銷盡滿池荷覺来好風吹雨覺来遲開遍荼䕷縂不知團扇晚凉人似玉也湏消受暮春時春光湖上偏多楊栁風桃花吹盡雨前紅䓁閑却𬒳東君咲大半春光在醉中栁花詞望窮河水是隋家風落長堤御栁斜春盡花飛留不住白頭啼徧後棲鴉欄馬墙西欲暮春花飛不復過中旬倚天樓閣晴光裏争撲珠簾不避人章華䑓下路西東走馬歸来滿䄂風吹起萬條枝上雪䓁閑迷却細腰宫滿院長條散緑隂誰家門户碧沉沉地衣不許重簾隔雪白花鋪一寸㴱楊州寺前楊栁多栁枝能舞更能歌夜来吹入維摩室化作天花可奈何孟院判宅辭飲病来酒力未能加易覺衰容染絳霞團扇凉風吾欲睡不勞頻㸔石榴花酒名輦下曲有序昱􅊀貟宣政院判官以僧省事簡搜索舊文藁扵嚢中曩在京師時有所聞見輙賦詩有宫中詞塞上謡共若干首合而目曰輦下曲其㩀事直書辭句鄙近雖不足以上繼風雅然一代之典禮存焉黄金大殿萬斯年十二丹楹日月邊傘盖葳𬎼當御榻珠光照曜九重天五垓十陛立朝廷檻首銅鵰一丈翎不待来儀威鳯至日聞韶濩在青冥州橋拜伏两珉龍向下天潢一派通四海仰瞻天子氣日行黄道貫當中方朝猶是未明天玉戚輪竿已儼然百獸蹲威繪旛下萬臣效職内門前東閣緋服唱雞人撃到朱鼙苐㡬聲楠寐奉常先告備駕行三叩紫銷鳴至元典禮當朝㑹宗戚前将祖訓開聖子神孫千萬世俾知文業此中来二九行分正從班盡将牙笏注名間簟鋪獸鎮丹墀内鵠立千官畫閳國戚来朝縂盛容左班翹鶡右王封功臣帶礪河山誓萬歲千秋樂未終静瓜約閙殿西東頒宴宗王禮数隆酋長廵觴宣上㫖儘教滿酌大金鍾萬方表馬賀生辰班首師臣與相臣喝賛禮行天樂動九重宫闕一時新三司侍宴皇情合對御吹螺大禮終寳扇合鞘催放仗馬蹄哄散萬花中授時暦盡當冬至太史舁官近御前御用粉牋題國字帕黄封上榻西邊泥金瀝水順飄揚掌扇香吹殿角涼不是内官親執御太平無用鎮非常只孫官様青紅錦褁肚圎文寳相珠羽仗執金班控鶴千人魚貫振嵩呼全装莭仗冐金錢振竦髙擎玉陛前軃䄂行交太平字回鑾猶自歩蹁躚黄金酒海贏千石龍杓梯聲給大筵殿上千官都取醉君臣胥樂太平年西天法曲曼聲長瓔珞垂衣稱艶粧大宴殿中歌舞上華嚴海㑹慶君王職貢蠻夷通海徼筦衣毳㡌步逡廵翠華閣下頒繒幣聖主曲恩柔逺人竹扛金鑄百尋餘頂板髙鐫萬國書禁得下方雷與電聲光不敢近皇居崇天門下聴宣赦萬姓歡呼萬歲聲豈獨罪人蒙大宥普天率土盡關情户外班齊大禮行小臣鳴賛立朝廷八風不動丹墀静聴得宫𫀆舞蹈聲墀左朱欄草滿業世皇封植意尤濃艱難大業從兹起莫忘龍沙汗馬功國𥘉海運自朱張百萬樓船渡大洋有訓不教忘險阻御厨先飯進黄粮旂常萬乗綴旒旓玉瓘升壇藉白茅前月太常班鹵簿安排法駕事南郊清廟上尊元不罩爵呈三獻禮當終巫臣馬湩望空灑國語辭神妥法宫遼東羞貢入神厨祭鮪專車一丈餘寢廟歲行春薦禮有加鉶臣雜鮮腒禽鳥之肉國俗祠神主中霤氊車氊俑掛宫燈神来鼓盞自飛應妖自人興如有慿狼髖且抛何且况女巫慿此卜妖祥手持撲􅈪揮三祀蠲祓祈神受命長當年大駕幸灤亰象背前䭾幄殿行國老手鑪先引導白頭連騎出都城皇輿清暑駐灤京三日當畨見大臣夜半暗中偷摸箭隂教右姓主朋廵請號關牌趋鼓閣弓刀千騎領兵符例差右姓廵倉庫哄唱穹廬賜大酺祖宗詐馬宴灤都挏酒啍啍載憨車向晚大安髙閣上紅竿雉帚掃珎珠駕起京官聚草棚諸司誰敢不從公官錢例與供堂食馬上風吹酒面紅千門萬户嚴扃鑰留守司官莫自閑仰候秋風駝𬒳䓁郊迎大駕向南還駝装序入日精門銅鼓牙旗作隊喧一聴廵階鈴鈸振滿宫俱喜出迎恩月華門裏西角屋六纛幽蔵神所居大駕起行先戒路皷鉦次第出儲胥華纓孔㡌諸畨隊前導伶官戯竹髙白傘威𬎼憵駞道帝師輦下進葡萄守内畨僧日念吽御厨酒肉按時供組鈴扇鼓諸天樂知在龍宫苐㡬重皇輿行在闢人門羣牧分屯散綵雲習馭每朝供進馬近移毳幕盡宗勲御前親拜中書令恩賜東宫設内筵手署敕黄唯一道任誰祗受付雙遷雞人唱罷内門開千騎前頭丞相来衛士金爪雙引導百司擁醉早朝回端本堂㴱綉榻髙滿前學士盡風騷星河騎士知唯馬慣識金牋玉兎毫旌旗千騎從儲皇詐栁行春出震