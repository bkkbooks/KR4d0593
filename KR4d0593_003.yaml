front:
  text: 張光弼詩集卷之三
  hash: sha256:d5b30859be4a2bf00c10f0b7b200f69d466d3195573e25980ef5e0d3cb62c247
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_003-1a}
body:
  text: 七言絶句題孔明抱膝圖抱膝長吟彼一時卧龍消息有誰知能聽天下三分計賴有劉家大耳兒題羲之寫扇圖蒲扇新題墨未乾也應技癢要人看阿婆莫謾提籃去明日街頭寫便難訪舊三竺次泐禪師雜興韻但教懷抱能傾倒莫向尊罍計有無不為訪僧三竺寺肯乘烟艇過西湖酒館湖船盡有名玉杯時得律間情至今人說張貟外不是看花不出城為同峰講主題風烟梅二畫長林春早玉烟新未許風光殿後塵留得維摩方丈在碧紗遮護散花人髙坐天人白玉床袈裟都是素毫光東風也自知消息故故吹香入道場題墨梅一點嬌飛傍鏡臺曽隨笑靨貼宫腮如今莫說顔如玉何限風烟馬上來白描杏花小樓春雨賣花時盡說京城好女兒有茟何應描不就况兼紅粉不曽施白描水仙花月下歸來看未真烏絲幾縷欲生春莫教縞帶隨風逺留綰明珠贈洛神荔枝畫一勺瓊漿貯絳霞好招鸚鵡過西家若為解得相如渴免向金莖乞露華題十八學士奕棋圖瀛洲風景最清真一代人材盡鳯麟莫道深山更深處傍觀都是下棊人五陵逰俠圖白雪肌膚白玉鞍渾身俊氣許人看若知稼穡艱難處肯把黃金鑄彈丸題桂花仙子黃金碎搗作微塵露染秋和色未勻回首瓊樓休悵望素娥元是月中人秋雲幾片作衣裳吹盡西風骨亦香明月若教生洛浦可勝才思惱陳王題徽廟螃蟹圖閲盡蟲魚爾雅萹間將藤素染蒼烟不知畫得招潮後艮嶽從教變海田長白山前謾拔都清華小殿試操觚含毫應笑滕王拙不寫秋沙郭索圖題畫梅年年長與栁爭春數點風前更可人待得緑隂成子後暗香踈影總隨身題明皇擊毬圖管籥聲隨萬乘逰開元毬馬最風流九齡老去無人諫不破中原不肯休題黃花白蝶扇面一枝秋露染𥘉勻曽伴淵明漉酒巾若道夢中能化蝶飛來應是白衣人題大慈寺僧房老禪相見具袈裟旋汲新泉自煮茶笑問世間春幾許東風開遍石巖花題紙瓶留别育王寺長老照大千朝市山林自一家要知縫掖即袈裟青蘋波上凉風起㝎到禪房看蕙花題剡漢夜雪圖雪月相􅌽過剡川芙蓉逺近玉生烟戴家亭館多風致只好到門回酒錢題二馬圖缷却銀鞍得自由偶因鬃癢一回頭青絲幾尺無拘束曽控風雲遍九州春明仰首一場嘶莫說河冰迸玉蹄曽與將軍同患難等間平步過檀溪江南曲阿姊却從何處來芙蓉有露濕香腮相呼相應棹船去知是鄰家鬪鴨回一束蓮莖學細腰塗金艇子木蘭橈東家姊妹西家去更約明朝去看潮贈琴士萬樹流鶯御苑西朝回騎馬醉如泥如今都向山堂宿聽得琴中烏夜啼小逰仙次韻四首漢武求仙未絶情枉將心力事金莖靈王太子因無欲吹得琅玕作鳯吟桂閣金銀不甚髙仙山幾許隔波濤信回青鳥無尋處一色春風是絳桃小娃莫說臉如蓮自牧羊龍向對田笑指清泠橋下水此中元是碧瑶天青蛇昨夜付書回只許麻姑自拆開說道蓬萊山下路莫因清淺不歸來題鸚鵡士女圖長門幾日斷羊車間得工夫坐日斜唯有舊時鸚鵡見春衫曽染石榴花題露荷風栁扇面猶恐丹砂染未勻波中影是鏡中身長眉盡向東風裏不許人間更效顰此扇當年定賜誰淚㾗猶自舊胭脂班姬莫用間相詠次第凉風到汝吹秋夕紫藤滿架月華明一片凉風絡緯聲猶有西江未歸客倚樓因爾動離情過􅍩湖􅍩湖有路接天津萬頃銀花小浪勻安得滿船都是酒船中更載浣紗人過金粟寺看東坡竹東坡仙去三百載海上猶存丹鳯巢醉裏自將衫䄂下拂開塵碧看烟梢題凝思士女萱草花開一兩枝薰風更是斷腸時自家團扇無心把想得回文織錦詩題盧媪家誰似禇莊盧媪家開門繞屋是荷花收來麥把雲成垜繅動蠶絲雪滿車船坊小小栁依依田舍人家儘自肥溪水受隂魚出躍薰風吹暑燕交飛過蕭山縣原野蕭條井邑虛居人都是劫灰餘橋邉猶有江淹寺不為題詩駐使車題吳綵鸞寫韻圖小點紅鸞欲下遲逺山渾似畫來眉如何一念人間事上界仙曹便得知同徐大章溪上看芙蓉日暮歸來雨濕衣涼風千樹彩雲飛渚宫只在秋江上何事襄王夢到稀宫詞次韻周貟外時樣宫眉不甚長再三笑語問同房內園有約看花去稱得春衫繍鳯凰題左司壁省中莫說文書簡開遍杏花渾不知今日樹邊騎馬過滿衣春雨立多時題毛女一钁長隨玉雪身女中還有爛柯人相逄好向麻姑說東海千年人化塵題東坡竹三百餘年屈指過猶于餘墨見東坡雖然數尺黃州竹寫出平生直莭多題蘇小小像湖上行雲逐步移手携團扇欲何之鬢邊莫笑間花草也是當時第一枝題蜻蜓蛺蝶畫扇點水穿花不自疑輕盈滿扇欲何之秋塘一覺風流夢又是秋香欲老時觀奕圖為楊左丞題局中勝負幾回新盡在丹青亦損神莫把等間銷歲月傍觀都是下棊人求仙辭漢皇承露鑄金莖别道雲間有玉亰萬乘旌旗不隨去此身何用獨長生不見王喬馭鶴還祗應憔悴老空山何如修取金仙法滅盡空花出世間荷花辭次韻周伯溫參政朝霞染得好衣裳吹遍湖頭風露香身分可憐年紀小纎腰一束欎金黃少年慣服白硃砂飬得容顔過似霞生長六橋楊栁岸不知湖水是儂家莫訝吳儂說靚粧紅銷貼體肉生香夜來相伴緣荷葉受用滿湖風露涼一種西湖與若耶鴛鴦宿處便為家秋房結得新蓮子便是當時藕上花上元夫人辭阿母親曽與製衣手攀雲錦下天機自從宴罷茅君後寂寞龜壇㑹更稀瘦馬少盡其力老棄之此豈有意埋弊惟不如汗血陳前死以革就裹將軍尸栁枝詞尊前不奈小腰身爭得攙先上舞茵多謝東風好擡舉盡情分付畫眉人春光領略不勝嬌搖蕩東風千萬條悔盡江州白司馬一生空詠小蠻腰折栁枝愁向尊前唱渭城栁枝折盡贈行人蚤知世路多離别移在郵亭逺處生唐天寶宫詞十五首壽王妃子在青春賜與黃冠號太真不是白頭髙力士翠華那得逺䝉塵徹夜宫中按羽衣明朝冊拜太真妃鳯凰園裏承恩後從此君王出內稀興慶池頭芍藥開貴妃步輦看花來可憐三首清平調不慱西涼酒一杯清源小殿合􅋽州羯鼓琵琶響未休為是阿瞞供樂籍八姨多費錦纒頭蓬萊前殿摘黃柑一色金盤賜內官㨂得枝頭合歡實畫圖傳與大家看玉笛當年是賜誰可教妃子得偷吹還家剪下青絲髮持謝君王意可知天子樓前百戲呈大娘竿舞最驚人貴妃獨賞劉郎詠牙笏羅𫀆色色新舁上兒綳滿翠容黃裙髙髻一叢叢君王入內聞歡笑賜與金錢滿六宫四海承平倦萬機只將彩戲悅真妃不平最是彈雙六骰子公然得賜緋小部梨園出教坊曲名新賜荔枝香霓裳按舞長生殿擊碎梧桐夜未央共指雙星出殿遲並肩私語有誰知君王未出長安日肯信人間有别離香囊遺下佛堂階不使君王不愴懷想著當年雪衣女羽衣猶得苑中埋勤政樓中夜正長上皇西望轉悽凉侍兒唯有紅桃在一曲涼州淚萬行龍女殷勤道姓名凌波池上乞新聲周公不入君王夢誰與蒼生致太平天寶年中寵賈昌黃衫年少滿雞坊絳冠鬪罷羅纒項又得君王笑一場趍府燕子梁間漸有聲碧油窗外未天明長街官樹留殘月滿馬好風吹宿酲小寒花外東風作小寒輕紅淡白滿䦨干春光不與人憐惜留得清明伴牡丹涼思朝來風雨怯輕羅便覺􅋽秋意思多一夜不眠聮翠𬒳餘香銷盡滿池荷覺來好風吹雨覺來遲開遍荼䕷總不知團扇晚凉人似玉也須消受暮春時春光湖上偏多楊栁風桃花吹盡雨前紅等間却𬒳東君笑大半春光在醉中栁花詞望窮河水是隋家風落長堤御栁斜春盡花飛留不住白頭啼遍後棲鴉欄馬墻西欲暮春花飛不復過中旬倚天樓閣晴光裏爭撲珠簾不避人章華臺下路西東走馬歸來滿䄂風吹起萬條枝上雪等間迷却細腰宫滿院長條散緑隂誰家門户碧沉沉地衣不許重簾隔雪白花鋪一寸深楊州寺前楊栁多栁枝能舞更能歌夜來吹入維摩室化作天花可奈何孟院判宅辭飲病來酒力未能加易覺衰容染絳霞團扇凉風吾欲睡不勞頻看石榴花酒名輦下曲有序昱􅊀貟宣政院判官以僧省事簡搜索舊文藁于囊中曩在京師時有所聞見輒賦詩有宫中詞塞上謡共若干首合而目曰輦下曲其據事直書辭句鄙近雖不足以上繼風雅然一代之典禮存焉黃金大殿萬斯年十二丹楹日月邊傘蓋葳𬎼當御榻珠光照曜九重天五垓十陛立朝廷檻首銅鵰一丈翎不待來儀威鳯至日聞韶濩在青冥州橋拜伏兩珉龍向下天潢一派通四海仰瞻天子氣日行黃道貫當中方朝猶是未明天玉戚輪竿已儼然百獸蹲威繪幡下萬臣效職內門前東閣緋服唱雞人擊到朱鼙苐幾聲楠寐奉常先告備駕行三叩紫銷鳴至元典禮當朝㑹宗戚前將祖訓開聖子神孫千萬世俾知文業此中來二九行分正從班盡將牙笏注名間簟鋪獸鎮丹墀內鵠立千官畫閳國戚來朝總盛容左班翹鶡右王封功臣帶礪河山誓萬歲千秋樂未終靜瓜約閙殿西東頒宴宗王禮數隆酋長巡觴宣上㫖儘教滿酌大金鍾萬方表馬賀生辰班首師臣與相臣喝贊禮行天樂動九重宫闕一時新三司侍宴皇情合對御吹螺大禮終寶扇合鞘催放仗馬蹄哄散萬花中授時曆盡當冬至太史舁官近御前御用粉箋題國字帕黃封上榻西邊泥金瀝水順飄揚掌扇香吹殿角涼不是內官親執御太平無用鎮非常只孫官樣青紅錦褁肚圎文寶相珠羽仗執金班控鶴千人魚貫振嵩呼全裝莭仗冒金錢振竦髙擎玉陛前軃䄂行交太平字回鑾猶自步蹁躚黃金酒海贏千石龍杓梯聲給大筵殿上千官都取醉君臣胥樂太平年西天法曲曼聲長瓔珞垂衣稱艷粧大宴殿中歌舞上華嚴海㑹慶君王職貢蠻夷通海徼管衣毳帽步逡巡翠華閣下頒繒幣聖主曲恩柔逺人竹扛金鑄百尋餘頂板髙鐫萬國書禁得下方雷與電聲光不敢近皇居崇天門下聽宣赦萬姓歡呼萬歲聲豈獨罪人蒙大宥普天率土盡關情户外班齊大禮行小臣鳴贊立朝廷八風不動丹墀靜聽得宫𫀆舞蹈聲墀左朱欄草滿業世皇封植意尤濃艱難大業從兹起莫忘龍沙汗馬功國𥘉海運自朱張百萬樓船渡大洋有訓不教忘險阻御厨先飯進黃糧旗常萬乘綴旒旓玉瓘升壇藉白茅前月太常班鹵簿安排法駕事南郊清廟上尊元不罩爵呈三獻禮當終巫臣馬湩望空灑國語辭神妥法宫遼東羞貢入神厨祭鮪專車一丈餘寢廟歲行春薦禮有加鉶臣雜鮮腒禽鳥之肉國俗祠神主中霤氊車氊俑掛宫燈神來鼓盞自飛應妖自人興如有慿狼髖且拋何且况女巫慿此卜妖祥手持撲􅈪揮三祀蠲祓祈神受命長當年大駕幸灤亰象背前䭾幄殿行國老手爐先引導白頭連騎出都城皇輿清暑駐灤京三日當畨見大臣夜半暗中偷摸箭隂教右姓主朋巡請號關牌趨鼓閣弓刀千騎領兵符例差右姓巡倉庫哄唱穹廬賜大酺祖宗詐馬宴灤都挏酒啍啍載憨車向晚大安髙閣上紅竿雉帚掃珍珠駕起京官聚草棚諸司誰敢不從公官錢例與供堂食馬上風吹酒面紅千門萬户嚴扃鑰留守司官莫自間仰候秋風駝𬒳等郊迎大駕向南還駝裝序入日精門銅鼓牙旗作隊喧一聽巡階鈴鈸振滿宫俱喜出迎恩月華門裏西角屋六纛幽藏神所居大駕起行先戒路鼓鉦次第出儲胥華纓孔帽諸畨隊前導伶官戲竹髙白傘威𬎼憵駝道帝師輦下進葡萄守內畨僧日念吽御厨酒肉按時供組鈴扇鼓諸天樂知在龍宫苐幾重皇輿行在闢人門羣牧分屯散綵雲習馭每朝供進馬近移毳幕盡宗勳御前親拜中書令恩賜東宫設內筵手署敕黃唯一道任誰祗受付雙遷雞人唱罷內門開千騎前頭丞相來衛士金爪雙引導百司擁醉早朝回端本堂深繡榻髙滿前學士盡風騷星河騎士知唯馬慣識金箋玉兔毫旌旗千騎從儲皇詐栁行春出震