body:
  text: 張光弼詩序廬陵張光弼先生少事虞文靖公集得詩法文靖才髙識廣其詩浩博而不肆變化而不窮而一宿于正先生之詩氣宇閎壯節制老成而從容雅則稱其傳焉張潞公翥最先知之而一時學者皆傾慕之其平生之作散亡多矣豫近從給事中夏時得其五七言古近體一帙以授其外孫浮梁縣丞時昌俾刻之鄒孟氏有言誦其詩讀其書不知其人可乎先生名昱仕元至江浙行省負外郎嘗贊忠謨于戎幕元末政壞遂棄官不仕張士誠據有浙西禮致之不屈而與周伯溫楊亷夫交遊相得號一笑居士我太祖皇帝混一天下訪求前元故臣之賢者嘗𬒳徴至京深見溫接已而憫其老曰可間矣厚賜遣㱕遂採天語更號可閒老人倘伴浙西湖山之間詩酒自適春秋七十有三而終噫觀其詩而考其出處可以知其為人焉正統元年夏四月既望榮祿大夫少傅兵部尚書兼華蓋殿大學士同郡楊士竒序張光弼詩集序庚子之冬豫始識張光弼于杭光弼廬陵人也蚤遊湖海間以詩名嘗負劍挾䇿從軍入幕府佐主帥經畫籌略以功纍遷至杭省左右司貟外郎行樞密院判官杭為山水勝地而光弼能詩善歌詠是時天下方用兵藩府所在不一而光弼獨能周旋其間以詩酒自娛不侵官不怙勢以取撓敗故一時公卿大夫士咸稱之求詩者日走其門豫時每數詣光弼光弼誦所作未嘗不為之擊莭然猶未能盡閲其編其後豫去杭與光弼益逺丙辰之春豫復至焉光弼手其詩二編過豫寓舍且言曰吾平生所作多矣今其藁皆不存獨此在巾衍中與吾周旋者殆二十年幸不失墜而得古律絶句凡若干篇而凡志意之所感發欣憂哀樂于是乎在其可以自見于世者獨此而已子其為我序之豫受而讀之愛其意婉而辭麗情間而調逸有詩人之風不能去手者纍日因切自念向之所聞于光弼者雖久而未浹乃今始得其詳焉蓋言者心之聲也時者事之㑹也時異則言異于是有正變焉兵革之秋殆雅亡之日也光弼以詩人之才而遭時板蕩汩汩戎馬間其應酬交接蓋無非衰世末俗之事雖欲正言而不可得故其辭多變使光弼當盛時一鳴則鏗鍧炳耀之辭自可匹休于前人惜其遭逄不偶而其言止于是也雖然杭之山水猶昔而光弼年未耄猶可肆其餘力于詩矧今聖化之隆天下頌聲方作光弼雖在田野其能自已于言者乎尚當歌詠太平而傳之無斁也洪武九年夏四月八日錢塘陳彥博序
