front:
  text: 張光弼詩集卷之五長短句
  hash: sha256:dc94e8f5179fde5c857043b0af53837f4e9ac5052bba4912ff4bbe0b7bdb15d7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_005-1a}
body:
  text: 巫山髙巫山髙望不極際天㣲茫十二峯彩雲上蒸靈雨集中有瓊䑓承翠館㬅態脩容相出入君王淫荒進神女直以夢中爲白日洛汭無聞五子歌宋玉㣲辭諷何及巫山髙望不極不比尭階土三尺君馬黄君馬黄臣馬白十月風髙塞草枯鉄衣夜浸盧龍月深入單于臣敢辭邊城土是征人血翹揺花翹揺花清明時節徧天涯東阡南陌畫輪車樂㳺踐之同泥沙城中多少冨豪家去年不見今年花慎勿輕賤翹揺花擬古秋夜長雲中鴻鴈過門前朔風起梧桐葉落金井頭月照烏啼天似水誰家機上織逥文夜聴啼烏如不聞明朝為遣安西使細意緘題持贈君古意頭上鳯凰釵是郎手中物床上鴛鴦𬒳是妾手自織将釵與衾寄郎去願郎長見長相憶拙逸齋羣峯兮立立衆流兮湜湜大木千章兮丘陵是植桒麻百頃兮蔽扵原隰翁居是間兮以作以息階庭五子兮蘭玉其質教以一經兮是訓是式富春之渚兮漫而不激有魚可釣兮鳬鴈可弋翁居扵是兮天之所隲鑿井而飲兮耕田而食仰事俯育兮不知不識窪尊兮噏噏土鼓兮秩秩優㳺卒歲兮皆仰蒙乎帝力髙車駟馬兮非予心之所及髙車駟馬兮非予心之所及五言律詩暑中招客二首長夜不可度欝陶自難開衣冠嫌褦襶樓觀想蓬莱赤日天中過涼風湖上來非君一命駕誰與共傳盃江上猶故國風月自閑人老至謀生拙時更盛化新花疑春是夢酒與道為隣柱史猶何者何嫌有此身虀館詩有序省掾李仲常儒者也喜𬞞菜每年以時治百餘品候開歳正月人日㑹郡中諸儒士為虀舘之㑹時予為左右司貟外郎以斯得忝座右索賦其事虀舘常年㑹辛盤此日傳鷁飛慚落羽鯨吸感流年白髮干戈裏青雲談咲邊晤言寧邂逅接席亦因縁列爼餘珎味登筵総俊賢玉壺延淑景綵筆詠春天上客歡先醉狂朋喜欲顛梅懸金勝小燭照錦𫀆鮮起舞交為夀疑年各自憐主人情更重屡賦鹿鳴篇送天使僧釋子承天語儒官撰寺碑萬間靈谷建一切布金為寳界山河大璇題雨露垂丹青人所仰壮䴡古無之鈔幣勤中賜恩榮拜曲施文章尊典語億兆頌皇基騫舉鸞逥筆光華鳯吐辭繡幢天上遣金錫日邊移赫赫瞻行邁遥遥賦載馳在公無候謁扵禮有嫌疑道路承傾盖言辭見誦詩斯湏如久要造次亦委蛇宗廟觀罍洗雲霄式羽儀乃知脩白業動輒守清䂓空谷行春律餘生共聖時頂祈摩佛手目願覩尭眉慶讃諸天㑹觀光夙世期頭雲陛逺舞䄂草堂卑枝繞貪生鵲池支服氣龜睽違難折栁嚮仰只傾葵復命蒼龍闕覃思白玉墀握蘭前席對視草近臣知仙樂停宫扇天花散殿帷一人膺大慶萬宇受繁禧立雪時将至拈華事未遲有縁皆弟子無念不慈悲軟語敷甘露清齋却紫芝頻煩尊者問慚愧老夫衰在徳寧忘報惟心不可欺朝宗江漢水日夜注懐思六言詩題山青白雲一箇茆廬何䖏小橋古木溪湾但見山青雲白不知天上人間四言詩題鍾馗夢以自見正以辟邪賜之𫀆笏人耶鬼耶計七十二葉繞一卷楊陳二序各二葉附楊維禎次韻楊左丞五府壁詩皇元正朔承千載天下車書共一家一柱東南擎日月五城西北䕶烟霞寳刀雷煥蒼精傑天馬郭家獅子児收拾全呉還聖主将軍須用李輕車張光弼詩卷一止此刻失結尾處復前校
