front:
  text: 張光弼詩集卷之四
  hash: sha256:5863c3bf84f7ceb97caab0145ba5baa38e6fcf382631c0ea3e283705a87fd652
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0593_SBCK_004-1a}
body:
  text: 五言絶句古辭歡樂自歡樂苦辛長苦辛城中十萬户誰是種田人風雨牧牛圖牧牛值風雨牧具幾脫手不自風雨前不自風雨後石友蒼然柱石姿風雨莓苔久幸同貞固心相看即吾友竹君百年駒過隙萬事成鞅掌自顧非此君誰與共清賞花􅏙繁花作髙樹狹徑不數曲醉來扶杖行幽興亦自足蕉林愁懷長把酒愛此滿林玉風廽舞袖翻欲近紗窗緑芳屏衆芳結為屏左右映紅藥問訊園中人何如金孔雀𬞞畦學圃才兩畦佳𬞞欲幾品露葵不厭烹及我春酒醒梨花折枝已過清明莭猶依玉鏡臺一枝如折得幾誤蝶飛來水殿納涼圖别殿紅綃女無風亦自涼欄邊是湖水夜夜宿鴛鴦七夕乞與人間巧全慿此夜秋如何針線月容易下西樓别劉博士秪為情如雨從教醉似泥免看楊栁色相送出城西王昭君漢地非無雪胡中不見花琵琶一萬里馬上盡風沙巾幗猶知辱裙叉可即戎單于如有問教妾若為容銅雀臺自古誰無死英雄豈不知望陵歌舞歇還有夢來時邊思萬里盡風沙征人念歲華角聲悲自語誰見落梅花赤壁赤壁不改色漢江依舊流二龍爭戰後風月屬扁舟峽川石與青天近浮雲向客低自然堪下淚不是有猿啼題楊州史左丞畫扇后土祠前路金鞍憶舊遊春風雙燕子渾似在楊州塞上朔風西北來驚沙對面起人馬暗相失咫尺異千里題啇山觀奕圖縱橫十九路一著一回新如此深山許傍觀亦有人題村廟禍福慿誰降雞豚合有災年年當社日簫鼓賽神來飛來峯峯在西天竺青蓮千葉開佛人無妄説或恐是飛來呼猿洞洞閟煙霞古岩廽藤蔓叢誰能將劔術往問白猿公題名石東坡龍井回題名塔磚上豈期後百年過者為瞻仰合澗橋兩澗何年合一橋終日間桃花逐流水未覺是人間龍公洞龍或藏其用迹與蛇何異慚愧耕稼人猶來候雲氣飯猿臺僧既非昔年猿亦異往日唯有飯猿臺猶是當時石連岩棧連岩有棧道重疊架古木勿輕縱步險平地折車軸客兒亭客兒謝家子明師夢相待斯人骨已朽斯亭尚千載坐禪石法師禪定時萬象付冝漠至今岩前石每每天花落鄰墻梅花臘後春才到寒香襲素𫀆梅花如有意不在粉墻髙聞鍾朝撞亦匆匆暮撞亦匆匆銷磨浮世事都在數聲中墨萱草種得冝男草忘憂度歲華墨池憐照影朵朵鳯頭花葛仙溪葛仙浴丹溪飲溪骨自蛻試問歸來鶴何人壽千歲濟川圖平地有摧輈慎者或不免奈何千金軀涉此風濤險菊花萬夫起銅盤拔地一千丈寧知白露華暗滿菊花上臧祥卿畫竹枝白頭禽扇面片月出幽林間情欲不禁天寒憐翠袖為賦白頭吟西施館娃宫前洞西施舊來往自載扁舟後歲歲春蘿長履迹西施往行處好事作履迹幾寸莓苔深見者為憐惜問梅一種隴頭樹東風都合吹未應造物者偏在向南枝嘉新晴五色雲間鵲今朝忽放聲繞簷飛不去亦是喜新晴泉月軒為開元宫張道士題為貪真境好每到即忘歸扣齒漱明月清光生羽衣題餐霞洞愚者昧其覺貪生還一夢不見餐霞人唯見古時洞李息齋平章畫生色竹一代風流盡丹青付此君忍將湘浦淚更灑九疑雲題牧溪飛鳴鴈二畫秋風幾萬里一色是青雲誰信天山路無書可寄君倦飛憐羽翼引􅖪一長鳴紫塞秋何似今宵月正明新宫訪袁真人知已羽化留題仙客已塵土桃花依舊春後來看花者不是種桃人惜花昨夜一花開今朝一花落春事能幾何奈此風雨惡僧華光畫梅誰與一毫端示此無垢相迦葉不可招始悟色空妄栁莊種栁連莊屋春來色更嬌不同殘臘見封雪落長條桂林不歌叢桂誰能更出山若無忘世事來共此中間蘭渚幽蘭滿洲渚紉之可為佩欲遺心所親涔陽何處在竹坡城中寸金地種竹不可多風前植杖看奈此緑隂何瓜田仲夏生意繁延蔓若野葛結實田畝中庶慰行者渴荷港門前東西道下是荷花港越女不避人唱歌來蕩槳鶴亭有時命童子亭前按舞鶴雖無賓客歡對此亦云樂魚池放魚池中央池水丈尺許勿謂江湖逺時來足風雨題市學堂喧聒從終日跳梁欲上街要令心目靜除是掩空齋贈歐陽尚禮還播州人生豈無别咫尺異言笑况復萬里遙風煙接蠻徼觀拆白塔有賦白塔誰所營又復為平地猶有百年人間來説興廢題章叔厚所畫投竿圖大魚不可得小魚釣何益不如投竿坐臨流以終日上清方方壺作墨畫贈毛起宗提點風火鍊仙骨雲雷鑄鼎文壺公探造化圖寄大毛君趙清獻小像當時仰望公畫筆開生面之官唯琴鶴千載趙清獻别故人未别欲千言臨别無一語唯此舊時心隨君渡江去别鄉友共是他鄉客從遊又隔年老人偏惜别把臂一茫然贈縣令任滿一勺清泉水三年共此心不堪彈别鵠唯是邑中琴磐石吹簫圖宰相五更朝金鞍拂栁條何如磐石上散髮坐吹簫落梅花含章人正卧幾片下空墻春雪調鉛粉相和一處香題宋子障太守畫老樹含青雨平林淡白煙隔溪茅屋在好泊米家船題趙子昻畫梨花畫眉圖鳴春如有意誰與畫眉長若訴梨園事開元夢一場髙房山畫扇結屋清溪上仙凡此路分終朝看不厭唯是滿山雲惱啼鴉朝啼人盡睡暮啼人厭聞非關毛羽惡不入鳯凰羣代毛延夀褒姒故事豈謂黃金少除哀君未知古來因好色滅國是龍婺捕魚圖畫出溪邊景渾家在捕魚筆頭餘興在幾點暮鴉踈晚望東村開門見東村晨光尚蒙昧白雲何處來適興豫心會題王大年畫舟楫為生計沙鷗識此情百年浮世事九鼎一絲輕林子山畫為鄭宗表題尊前可忘世綸竿聊伴身樂然溪水上魚鳥與相親雙蝶相逐䨥飛蝶風前不自持有生皆有感微物豈無知白練帶禽一雙白練帶繞樹效于飛冝爾閨房喜圖形上繡衣秋棠喚思圖兩雀晚相依棠梨葉漸稀連枝有深思未可便辭飛梅詩十絶種梅如昨日樹已過人長粉白東鄰女爭窺出院墻小玉探春回褰簾笑語來今朝庭樹上忽有數花開黃鍾才應律英蕚已舒芽不笑黃金栁先開白玉花漢主黃金屋盧家白玉堂暗香浮動處愁思月昏黃一枝憐似玉日暮正愁新寂寞真珠佩天寒翠袖人數點飄香雪非關畫角吹驚心調鼎事細雨緑隂時雪落窗紗外寒梅正著花不同桃李樹爭艷五侯家新月回宫簷梅粧艷于雪誰謂五出花能加天下白姑射有處子雪色而內視肌粟寒不生香篝熏素𬒳樹老苔衣厚花稀春事遲為緣生驛路都是拆殘枝題畫筆墨生幽思山居春日長獨謡橋上路亦自惜年芳夜坐夜長春酒醒欹枕何曽睡時見燭花中餘光吐金穗題竹落墨生幽思風來自有香九天皆雨露容易拂雲長題西湖大佛頭寺佛身滿法界金色從地起若人加粧嚴其福亦如是題枯木石圖石氏珊瑚樹楊家翡翠鈎千年風雨後遺影海中洲青山白雲圖俗駕是難到滿山都是雲雲中有樓觀鸞鶴日相親題畫山水溪回岸影深山逈溪聲響獨有溪上人扁舟自來往題諸葛孔明像一笑出隆中黃星掩日紅妖氛不敢作白羽起西風詠雞鳯凰有五色雞亦有五德鼓翼不妄啼一聲天下白
